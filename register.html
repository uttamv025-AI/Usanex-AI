<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Usanex - Register</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;

    background:
        radial-gradient(
            circle at top left,
            #ffffff 0%,
            #eaf7ff 38%,
            #cfeaff 100%
        );

    color:#123f6b;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:420px;
}


/* =========================
   CARD
========================= */

.card{

    width:100%;

    background:rgba(255,255,255,.94);

    border:1px solid rgba(255,255,255,.9);

    border-radius:30px;

    padding:30px 23px 24px;

    box-shadow:
        0 18px 50px rgba(38,125,190,.16);

    backdrop-filter:blur(10px);

}


/* =========================
   LOGO
========================= */

.logo{

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:18px;

}

.logo-box{

    width:55px;
    height:55px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #2699ef,
            #0879d6
        );

    color:#ffffff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:31px;

    font-weight:800;

    box-shadow:
        0 8px 18px rgba(22,133,229,.25);

}

.logo-text{

    margin-left:10px;

    font-size:27px;

    font-weight:800;

    letter-spacing:-.5px;

    color:#123f6b;

}


/* =========================
   TITLE
========================= */

.title{

    text-align:center;

    color:#123f6b;

    font-size:25px;

    font-weight:800;

    letter-spacing:-.3px;

}

.subtitle{

    text-align:center;

    color:#7890a1;

    font-size:13px;

    margin-top:7px;

    margin-bottom:25px;

}


/* =========================
   INPUT
========================= */

.input-group{

    margin-bottom:15px;

}

.label{

    display:block;

    color:#315d78;

    font-size:12px;

    font-weight:700;

    margin-bottom:7px;

    padding-left:3px;

}

.input{

    width:100%;

    height:50px;

    border:1px solid #d5e8f5;

    border-radius:15px;

    outline:none;

    background:#f5fbff;

    padding:0 15px;

    color:#234;

    font-size:15px;

    transition:.2s;

}

.input:hover{

    border-color:#b8dbef;

}

.input:focus{

    border-color:#1685e5;

    background:#ffffff;

    box-shadow:
        0 0 0 3px rgba(22,133,229,.10);

}


/* =========================
   PASSWORD
========================= */

.password-box{

    position:relative;

}

.password-box .input{

    padding-right:48px;

}

.show-password{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    width:28px;
    height:28px;

    display:flex;

    justify-content:center;
    align-items:center;

    color:#628198;

    font-size:16px;

    cursor:pointer;

    border-radius:50%;

}

.show-password:active{

    background:#e9f5ff;

}


/* =========================
   BUTTON
========================= */

.register-btn{

    width:100%;

    height:51px;

    border:0;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #2397ed,
            #087bd7
        );

    color:#ffffff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    margin-top:4px;

    box-shadow:
        0 8px 18px rgba(22,133,229,.22);

    transition:.2s;

}

.register-btn:active{

    transform:scale(.98);

    box-shadow:
        0 4px 10px rgba(22,133,229,.18);

}

.register-btn:disabled{

    opacity:.65;

    cursor:not-allowed;

}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:20px;

    text-align:center;

    margin-top:12px;

    font-size:12px;

    line-height:18px;

    color:#df555c;

}


/* =========================
   DIVIDER
========================= */

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:13px 0 12px;

    color:#a1b2be;

    font-size:10px;

}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:#e1edf4;

}


/* =========================
   LOGIN
========================= */

.login-text{

    text-align:center;

    color:#8296a4;

    font-size:12px;

}

.login-link{

    color:#087bd7;

    font-weight:800;

    cursor:pointer;

    margin-left:3px;

}


/* =========================
   SECURITY TEXT
========================= */

.security{

    text-align:center;

    color:#9aaab5;

    font-size:10px;

    margin-top:16px;

}

.security span{

    color:#1685e5;

}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:360px){

    body{

        padding:10px;

    }

    .card{

        padding:25px 17px 20px;

        border-radius:25px;

    }

    .logo-box{

        width:48px;
        height:48px;

        font-size:27px;

        border-radius:15px;

    }

    .logo-text{

        font-size:24px;

    }

    .title{

        font-size:22px;

    }

    .subtitle{

        margin-bottom:21px;

    }

    .input{

        height:47px;

    }

    .register-btn{

        height:48px;

    }

}

</style>

</head>


<body>


<div class="app">

    <div class="card">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-box">
                U
            </div>

            <div class="logo-text">
                Usanex
            </div>

        </div>


        <!-- TITLE -->

        <div class="title">
            Create Account
        </div>

        <div class="subtitle">
            Join Usanex and get started
        </div>


        <!-- NAME -->

        <div class="input-group">

            <label class="label">
                Name
            </label>

            <input
                id="name"
                class="input"
                type="text"
                placeholder="Enter your name"
                autocomplete="name"
            >

        </div>


        <!-- MOBILE -->

        <div class="input-group">

            <label class="label">
                Mobile Number
            </label>

            <input
                id="mobile"
                class="input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10-digit mobile number"
                autocomplete="tel"
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label class="label">
                Password
            </label>

            <div class="password-box">

                <input
                    id="password"
                    class="input"
                    type="password"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                >

                <span
                    class="show-password"
                    onclick="togglePassword()"
                    id="eye">
                    👁
                </span>

            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="register-btn"
            id="registerBtn"
            onclick="requestOTP()">

            Continue

        </button>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message">
        </div>


        <div class="divider">
            OR
        </div>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <span
                class="login-link"
                onclick="goLogin()">

                Login

            </span>

        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Your information is
            <span>secure</span>

        </div>


    </div>

</div>


<script>


/* =========================
   API
========================= */

const API =
    "https://usanex-ai.onrender.com";


/* =========================
   REQUEST OTP
========================= */

async function requestOTP(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("registerBtn");


    message.textContent = "";


    /* VALIDATION */

    if(!name){

        message.textContent =
            "Please enter your name.";

        return;

    }


    if(!/^\d{10}$/.test(mobile)){

        message.textContent =
            "Enter a valid 10-digit mobile number.";

        return;

    }


    if(password.length < 6){

        message.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    /* LOADING */

    button.disabled = true;

    button.textContent =
        "Please wait...";


    try{

        const response =
            await fetch(
                API + "/register/request-otp",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        name:name,

                        mobile:mobile,

                        password:password

                    })

                }
            );


        const data =
            await response.json();


        if(!data.ok){

            message.textContent =
                data.message ||
                "Unable to generate OTP.";

            return;

        }


        /* SAVE DATA */

        sessionStorage.setItem(

            "usanex_register",

            JSON.stringify({

                name:name,

                mobile:mobile,

                password:password

            })

        );


        /* TEST OTP */

        sessionStorage.setItem(

            "usanex_register_otp",

            data.otp || ""

        );


        /* NEXT PAGE */

        window.location.href =
            "/register-otp.html";


    }

    catch(error){

        console.error(error);

        message.textContent =
            "Server connection failed. Please try again.";

    }

    finally{

        button.disabled = false;

        button.textContent =
            "Continue";

    }

}


/* =========================
   PASSWORD TOGGLE
========================= */

function togglePassword(){

    const password =
        document.getElementById("password");


    const eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.textContent =
            "🙈";

    }

    else{

        password.type = "password";

        eye.textContent =
            "👁";

    }

}


/* =========================
   LOGIN
========================= */

function goLogin(){

    window.location.href =
        "/login.html";

}

</script>


</body>
</html>
