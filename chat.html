<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Usanex Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --header-h:70px;
    --composer-h:76px;
    --vvh:100dvh;
    --vvt:0px;
    --vvl:0px;
    --vvw:100vw;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    background:#050b18;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    position:fixed;
    inset:0;
    overscroll-behavior:none;
}

.chat-app{
    position:fixed;
    left:var(--vvl);
    top:var(--vvt);
    width:min(var(--vvw),600px);
    height:var(--vvh);
    margin:0 auto;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,100,255,.08),
            transparent 35%
        ),
        #050b18;
    overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.chat-header{
    position:fixed;
    top:var(--vvt);
    left:var(--vvl);
    width:min(var(--vvw),600px);
    height:var(--header-h);
    min-height:var(--header-h);

    display:flex;
    align-items:center;

    padding:10px 14px;

    background:rgba(5,11,24,.99);

    border-bottom:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    z-index:3000;
    overflow:hidden;
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;

    border:0;
    background:transparent;
    color:#fff;

    font-size:27px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.profile{
    display:flex;
    align-items:center;
    gap:11px;

    flex:1;
    min-width:0;
    overflow:hidden;
}

.profile-photo{
    width:43px;
    height:43px;
    min-width:43px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #2185ff,
        #0049b5
    );

    border:2px solid rgba(33,133,255,.7);

    font-size:19px;
    font-weight:800;

    overflow:hidden;

    box-shadow:
        0 0 0 3px rgba(33,133,255,.08),
        0 4px 16px rgba(0,100,255,.25);
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile-info{
    min-width:0;
    flex:1;
    overflow:hidden;
}

.profile-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ONLY TEXT — NO DOT */
.online{
    margin-top:3px;
    font-size:12px;
    color:#65a9ff;

    display:block;
}

.header-action{
    width:38px;
    height:38px;
    min-width:38px;

    border:0;
    border-radius:12px;

    background:rgba(255,255,255,.05);
    color:#fff;

    font-size:21px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{
    position:fixed;

    top:calc(var(--vvt) + var(--header-h));
    bottom:auto;
    height:calc(var(--vvh) - var(--header-h) - var(--composer-h));

    left:var(--vvl);

    width:min(var(--vvw),600px);

    overflow-y:auto;
    overflow-x:hidden;

    padding:18px 15px 20px;

    scrollbar-width:none;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
}

.chat-area::-webkit-scrollbar{
    display:none;
}

.date-divider{
    text-align:center;
    margin:8px 0 20px;
}

.date-divider span{
    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.06);

    color:#8491a7;

    font-size:11px;
}

.message-row{
    display:flex;
    width:100%;
    margin-bottom:13px;
}

.message-row.received{
    justify-content:flex-start;
}

.message-row.sent{
    justify-content:flex-end;
}

.message{
    max-width:76%;

    padding:11px 13px 8px;

    border-radius:16px;

    position:relative;

    font-size:14px;
    line-height:1.45;

    word-break:break-word;
    white-space:pre-wrap;
}

.received .message{
    background:#111b2d;

    border:1px solid rgba(255,255,255,.055);

    border-bottom-left-radius:5px;

    box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.sent .message{
    background:linear-gradient(
        135deg,
        #1677ff,
        #0755c9
    );

    border-bottom-right-radius:5px;

    box-shadow:0 5px 20px rgba(0,100,255,.20);
}

.message-time{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;

    margin-top:4px;

    font-size:9px;
    color:rgba(255,255,255,.48);
}

.sent .message-time{
    color:rgba(255,255,255,.68);
}

.read{
    font-size:11px;
    color:#b9ddff;
}

/* =========================================================
   TYPING
========================================================= */

.typing{
    display:none;

    align-items:center;
    gap:5px;

    width:max-content;

    padding:10px 13px;

    border-radius:15px;
    border-bottom-left-radius:5px;

    background:#111b2d;

    border:1px solid rgba(255,255,255,.05);
}

.typing.show{
    display:flex;
}

.typing span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#71809a;

    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.5;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
    position:fixed;

    left:var(--vvl);
    top:calc(var(--vvt) + var(--vvh) - var(--composer-h));

    width:min(var(--vvw),600px);

    height:var(--composer-h);
    min-height:var(--composer-h);

    padding:10px 12px 14px;

    background:linear-gradient(
        to top,
        #050b18 70%,
        rgba(5,11,24,.92)
    );

    z-index:3000;
}

.composer{
    width:100%;
    min-height:52px;

    display:flex;
    align-items:center;
    gap:7px;

    padding:6px 7px 6px 9px;

    background:#0d1729;

    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;

    box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.composer-btn{
    width:38px;
    height:38px;
    min-width:38px;

    border:0;
    border-radius:12px;

    background:transparent;
    color:#9eabc0;

    font-size:20px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.composer-btn:active{
    transform:scale(.92);
}

.message-input{
    flex:1;
    width:100%;
    min-width:0;

    height:38px;

    border:0;
    outline:0;

    background:transparent;
    color:#fff;

    font-size:14px;
}

.message-input::placeholder{
    color:#66748b;
}

.send-btn{
    width:40px;
    height:40px;
    min-width:40px;

    border:0;
    border-radius:14px;

    background:linear-gradient(
        145deg,
        #2185ff,
        #0052c9
    );

    color:#fff;

    font-size:19px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 16px rgba(0,100,255,.28);
}

.send-btn:active{
    transform:scale(.92);
}

/* =========================================================
   POPUPS
========================================================= */

.attach-menu{
    display:none;

    position:absolute;

    bottom:calc(var(--composer-h) - 2px);
    left:12px;

    padding:9px;

    border-radius:16px;

    background:#101c30;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 12px 35px rgba(0,0,0,.35);

    gap:7px;

    z-index:4000;
}

.attach-menu.show{
    display:flex;
}

.attach-item{
    width:42px;
    height:42px;

    border:0;
    border-radius:12px;

    background:rgba(255,255,255,.06);

    color:#fff;
    font-size:19px;
    cursor:pointer;
}

.emoji-panel{
    display:none;

    position:absolute;

    bottom:calc(var(--composer-h) - 2px);

    left:12px;
    right:12px;

    padding:12px;

    border-radius:17px;

    background:#0f1a2d;

    border:1px solid rgba(255,255,255,.07);

    box-shadow:0 12px 35px rgba(0,0,0,.3);

    grid-template-columns:repeat(8,1fr);

    gap:8px;

    z-index:4000;
}

.emoji-panel.show{
    display:grid;
}

.emoji{
    border:0;
    background:transparent;
    font-size:22px;
    cursor:pointer;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:85px;

    transform:
        translateX(-50%)
        translateY(15px);

    padding:9px 15px;

    border-radius:12px;

    background:#14233a;

    border:1px solid rgba(255,255,255,.08);

    color:#dbe7f7;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:5000;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    :root{
        --header-h:66px;
        --composer-h:70px;
    }

    .chat-header{
        height:var(--header-h);
        min-height:var(--header-h);
        padding:9px 10px;
    }

    .back-btn{
        width:37px;
        height:37px;
        min-width:37px;
    }

    .profile-photo{
        width:41px;
        height:41px;
        min-width:41px;
    }

    .profile-name{
        font-size:15px;
    }

    .chat-area{
        padding-left:12px;
        padding-right:12px;
    }

    .message{
        max-width:82%;
        font-size:14px;
    }

    .composer-area{
        padding:8px 9px 12px;
    }

    .composer{
        min-height:51px;
        border-radius:17px;
    }
}

/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:max(0px)){

    .chat-header{
        padding-top:max(
            10px,
            env(safe-area-inset-top)
        );
    }

    .composer-area{
        padding-bottom:max(
            12px,
            env(safe-area-inset-bottom)
        );
    }
}

/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-width:360px){

    .chat-header{
        padding-left:6px;
        padding-right:6px;
    }

    .profile{
        gap:8px;
    }

    .profile-name{
        font-size:14px;
    }

    .online{
        font-size:11px;
    }

    .composer{
        gap:3px;
        padding-left:5px;
        padding-right:5px;
    }

    .composer-btn{
        width:34px;
        min-width:34px;
    }

    .send-btn{
        width:37px;
        min-width:37px;
    }
}
</style>
</head>

<body>

<div class="chat-app">

<header class="chat-header">

    <button
        class="back-btn"
        onclick="goBack()"
        aria-label="Back"
    >‹</button>

    <div class="profile">

        <div
            class="profile-photo"
            id="profilePhoto"
        >U</div>

        <div class="profile-info">

            <div
                class="profile-name"
                id="chatName"
            >Loading...</div>

            <div class="online">
                <span id="onlineText">Connecting...</span>
            </div>

        </div>

    </div>

    <button
        class="header-action"
        onclick="showToast('Coming soon')"
    >⋮</button>

</header>


<main
    class="chat-area"
    id="chatArea"
>

    <div class="date-divider">
        <span id="dateText">Today</span>
    </div>

    <div
        class="message-row received"
        id="typingRow"
    >
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

</main>


<div class="composer-area">

    <div
        class="attach-menu"
        id="attachMenu"
    >
        <button
            class="attach-item"
            onclick="showToast('Gallery coming soon')"
        >🖼️</button>

        <button
            class="attach-item"
            onclick="showToast('Camera coming soon')"
        >📷</button>

        <button
            class="attach-item"
            onclick="showToast('File sharing coming soon')"
        >📄</button>
    </div>


    <div
        class="emoji-panel"
        id="emojiPanel"
    >
        <button class="emoji" onclick="addEmoji('😀')">😀</button>
        <button class="emoji" onclick="addEmoji('😂')">😂</button>
        <button class="emoji" onclick="addEmoji('😊')">😊</button>
        <button class="emoji" onclick="addEmoji('😍')">😍</button>
        <button class="emoji" onclick="addEmoji('🥰')">🥰</button>
        <button class="emoji" onclick="addEmoji('😎')">😎</button>
        <button class="emoji" onclick="addEmoji('❤️')">❤️</button>
        <button class="emoji" onclick="addEmoji('🔥')">🔥</button>
        <button class="emoji" onclick="addEmoji('👍')">👍</button>
        <button class="emoji" onclick="addEmoji('👏')">👏</button>
        <button class="emoji" onclick="addEmoji('🙌')">🙌</button>
        <button class="emoji" onclick="addEmoji('🤝')">🤝</button>
        <button class="emoji" onclick="addEmoji('✨')">✨</button>
        <button class="emoji" onclick="addEmoji('💙')">💙</button>
        <button class="emoji" onclick="addEmoji('😁')">😁</button>
        <button class="emoji" onclick="addEmoji('🤣')">🤣</button>
    </div>


    <div class="composer">

        <button
            class="composer-btn"
            onclick="toggleEmoji()"
        >☺</button>

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Message..."
            autocomplete="off"
            enterkeyhint="send"
        >

        <button
            class="composer-btn"
            onclick="toggleAttach()"
        >＋</button>

        <button
            class="send-btn"
            id="sendButton"
            onclick="sendMessage()"
        >➤</button>

    </div>

</div>

</div>

<div
    class="toast"
    id="toast"
></div>


<script>

const input =
    document.getElementById("messageInput");

const chatArea =
    document.getElementById("chatArea");

const emojiPanel =
    document.getElementById("emojiPanel");

const attachMenu =
    document.getElementById("attachMenu");

const chatName =
    document.getElementById("chatName");

const profilePhoto =
    document.getElementById("profilePhoto");

const onlineText =
    document.getElementById("onlineText");

const typingRow =
    document.getElementById("typingRow");

const sendButton =
    document.getElementById("sendButton");


const params =
    new URLSearchParams(
        window.location.search
    );

const otherUserId =
    (params.get("user_id") || "").trim();


function getCurrentUserId(){

    const keys = [
        "usanex_user",
        "user",
        "currentUser",
        "logged_in_user"
    ];

    for(const key of keys){

        try{

            const value =
                localStorage.getItem(key);

            if(!value) continue;

            try{

                const parsed =
                    JSON.parse(value);

                if(typeof parsed === "string"){
                    return parsed.trim();
                }

                if(
                    parsed &&
                    parsed.user_id
                ){
                    return String(
                        parsed.user_id
                    ).trim();
                }

                if(
                    parsed &&
                    parsed.id
                ){
                    return String(
                        parsed.id
                    ).trim();
                }

            }catch(e){

                if(value.trim()){
                    return value.trim();
                }

            }

        }catch(e){}

    }

    return (
        localStorage.getItem(
            "usanex_user_id"
        ) || ""
    ).trim();
}


const currentUserId =
    getCurrentUserId();


function goBack(){

    if(document.referrer){
        history.back();
    }else{
        window.location.href="/home";
    }

}


function getInitial(name){

    return (
        String(name || "U")
        .trim()
        .charAt(0)
        .toUpperCase()
        || "U"
    );

}


function setProfile(name, photo){

    chatName.textContent =
        name || "User";

    profilePhoto.innerHTML = "";

    if(photo){

        const img =
            document.createElement("img");

        img.src = photo;
        img.alt = "";

        img.onerror = () => {
            profilePhoto.textContent =
                getInitial(name);
        };

        profilePhoto.appendChild(img);

    }else{

        profilePhoto.textContent =
            getInitial(name);

    }

}


function clearMessages(){

    chatArea
        .querySelectorAll(
            ".message-row:not(#typingRow)"
        )
        .forEach(
            row => row.remove()
        );

}


function formatTime(value){

    if(!value) return "";

    try{

        const date =
            new Date(value);

        if(isNaN(date.getTime())){
            return "";
        }

        return date.toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch(e){

        return "";

    }

}


function formatLastSeen(value){

    if(!value){
        return "Offline";
    }

    try{

        const date =
            new Date(value);

        if(isNaN(date.getTime())){
            return "Offline";
        }

        const now =
            new Date();

        const diff =
            now.getTime() -
            date.getTime();

        const oneMinute =
            60 * 1000;

        const oneHour =
            60 * oneMinute;

        const oneDay =
            24 * oneHour;

        if(diff < oneMinute){
            return "Last seen just now";
        }

        if(diff < oneHour){

            const minutes =
                Math.floor(
                    diff / oneMinute
                );

            return (
                "Last seen " +
                minutes +
                " min ago"
            );

        }

        if(
            date.toDateString() ===
            now.toDateString()
        ){

            return (
                "Last seen today at " +
                date.toLocaleTimeString(
                    [],
                    {
                        hour:"numeric",
                        minute:"2-digit"
                    }
                )
            );

        }

        const yesterday =
            new Date(now);

        yesterday.setDate(
            yesterday.getDate() - 1
        );

        if(
            date.toDateString() ===
            yesterday.toDateString()
        ){

            return (
                "Last seen yesterday at " +
                date.toLocaleTimeString(
                    [],
                    {
                        hour:"numeric",
                        minute:"2-digit"
                    }
                )
            );

        }

        return (
            "Last seen " +
            date.toLocaleDateString(
                [],
                {
                    day:"numeric",
                    month:"short"
                }
            ) +
            " at " +
            date.toLocaleTimeString(
                [],
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            )
        );

    }catch(e){

        return "Offline";

    }

}


/* =========================================================
   PRESENCE UI
========================================================= */

function updatePresenceUI(
    isOnline,
    lastSeenAt
){

    if(isOnline){

        onlineText.textContent =
            "Online";

    }else{

        onlineText.textContent =
            formatLastSeen(
                lastSeenAt
            );

    }

}


async function loadPresence(){

    if(
        !currentUserId ||
        !otherUserId
    ){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/chat/presence?user_id=" +
                encodeURIComponent(
                    currentUserId
                ) +
                "&other_user_id=" +
                encodeURIComponent(
                    otherUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok){
            return;
        }

        updatePresenceUI(
            !!data.is_online,
            data.last_seen_at
        );

    }catch(error){

        console.log(
            "Presence error:",
            error
        );

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function addMessageFromServer(message){

    if(!message) return;

    const sender =
        String(
            message.sender_user_id || ""
        ).trim();

    const text =
        String(
            message.message || ""
        );

    if(!sender || !text){
        return;
    }

    if(message.id){

        const existing =
            document.querySelector(
                '[data-message-id="' +
                CSS.escape(
                    String(message.id)
                ) +
                '"]'
            );

        if(existing){
            return;
        }

    }

    const type =
        sender === currentUserId
        ? "sent"
        : "received";

    const row =
        document.createElement("div");

    row.className =
        "message-row " + type;

    if(message.id){

        row.dataset.messageId =
            String(message.id);

    }

    const bubble =
        document.createElement("div");

    bubble.className =
        "message";

    const textElement =
        document.createElement("div");

    textElement.textContent =
        text;

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );

    if(type === "sent"){

        const read =
            document.createElement("span");

        read.className =
            "read";

        read.textContent =
            message.is_read
            ? "✓✓"
            : "✓";

        time.appendChild(read);

    }

    bubble.appendChild(
        textElement
    );

    bubble.appendChild(
        time
    );

    row.appendChild(
        bubble
    );

    chatArea.insertBefore(
        row,
        typingRow
    );

}


/* =========================================================
   LOAD CHAT
========================================================= */

async function loadChat(){

    if(
        !currentUserId ||
        !otherUserId
    ){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/chat/messages?user_id=" +
                encodeURIComponent(
                    currentUserId
                ) +
                "&other_user_id=" +
                encodeURIComponent(
                    otherUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.detail ||
                "Unable to load chat"
            );

        }

        if(data.other_user){

            setProfile(
                data.other_user.name,
                data.other_user.profile_photo
            );

        }

        clearMessages();

        if(
            Array.isArray(
                data.messages
            )
        ){

            data.messages.forEach(
                addMessageFromServer
            );

        }

        scrollBottom();

        markMessagesRead();

    }catch(error){

        console.error(
            "Chat load error:",
            error
        );

        onlineText.textContent =
            "Offline";

        showToast(
            error.message ||
            "Unable to load chat"
        );

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

let sending = false;

async function sendMessage(){

    if(sending) return;

    const text =
        input.value.trim();

    if(!text) return;

    if(
        !currentUserId ||
        !otherUserId
    ){

        showToast(
            "Invalid chat"
        );

        return;

    }

    sending = true;

    sendButton.style.opacity =
        ".55";

    try{

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        sender_user_id:
                            currentUserId,

                        receiver_user_id:
                            otherUserId,

                        message:text
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.detail ||
                "Message could not be sent"
            );

        }

        if(data.message){

            addMessageFromServer(
                data.message
            );

        }

        input.value = "";

        emojiPanel.classList.remove(
            "show"
        );

        attachMenu.classList.remove(
            "show"
        );

        scrollBottom();

    }catch(error){

        console.error(
            "Send message error:",
            error
        );

        showToast(
            error.message ||
            "Message could not be sent"
        );

    }finally{

        sending = false;

        sendButton.style.opacity =
            "1";

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKey(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}

input.addEventListener(
    "keydown",
    handleKey
);


/* =========================================================
   EMOJI / ATTACH
========================================================= */

function toggleEmoji(){

    emojiPanel.classList.toggle(
        "show"
    );

    attachMenu.classList.remove(
        "show"
    );

}


function addEmoji(emoji){

    input.focus();

}


function toggleAttach(){

    attachMenu.classList.toggle(

    );

    emojiPanel.classList.remove(

    );

/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    requestAnimationFrame(
        () => {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        }
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   MARK READ
========================================================= */

async function markMessagesRead(){

    if(
        !currentUserId ||
        !otherUserId
    ){
        return;
    }

    try{

        await fetch(
            "/api/chat/read?user_id=" +
            encodeURIComponent(
                currentUserId
            ) +
            "&other_user_id=" +
            encodeURIComponent(
                otherUserId
            ),
            {
                method:"POST"
            }
        );

    }catch(e){

        console.log(
            "Read status error:",
            e
        );

    }

}


/* =========================================================
   REAL-TIME WEBSOCKET
========================================================= */

let socket = null;
let reconnectTimer = null;
let manuallyClosed = false;

function getWebSocketURL(){

    const protocol =
        window.location.protocol ===
        "https:"
        ? "wss:"
        : "ws:";

    return (
        protocol +
        "//" +
        window.location.host +
        "/ws/" +
        encodeURIComponent(
            currentUserId
        )
    );

}


function connectWebSocket(){

    if(!currentUserId){
        return;
    }

    try{

        if(socket){
            socket.close();
        }

    }catch(e){}

    manuallyClosed = false;

    try{

        socket =
            new WebSocket(
                getWebSocketURL()
            );

        socket.onopen = () => {

            /*
             * IMPORTANT:
             * Own websocket connection does NOT mean
             * the other user is online.
             */

            clearTimeout(
                reconnectTimer
            );

            loadPresence();

        };


        socket.onmessage =
            event => {

                try{

                    handleWebSocketMessage(
                        JSON.parse(
                            event.data
                        )
                    );

                }catch(e){

                    console.log(
                        "WebSocket data error:",
                        e
                    );

                }

            };


        socket.onerror =
            error => {

                console.log(
                    "WebSocket error:",
                    error
                );

            };


        socket.onclose = () => {

            /*
             * Don't immediately show Offline for
             * the other user because this socket
             * belongs to the current user.
             */

            if(!manuallyClosed){

                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer =
                    setTimeout(
                        connectWebSocket,
                        3000
                    );

            }

        };

    }catch(error){

        console.error(
            "WebSocket error:",
            error
        );

        reconnectTimer =
            setTimeout(
                connectWebSocket,
                3000
            );

    }

}


/* =========================================================
   WEBSOCKET EVENTS
========================================================= */

function handleWebSocketMessage(data){

    if(!data){
        return;
    }


    /* -----------------------------------------------
       CURRENT USER SOCKET CONNECTED
    ------------------------------------------------ */

    if(
        data.type ===
        "websocket_connected"
    ){

        loadPresence();

        return;

    }


    /* -----------------------------------------------
       OTHER USER PRESENCE
    ------------------------------------------------ */

    if(
        data.type ===
        "user_presence"
    ){

        const presenceUserId =
            String(
                data.user_id || ""
            ).trim();

        if(
            presenceUserId !==
            otherUserId
        ){

            return;

        }

        updatePresenceUI(
            !!data.is_online,
            data.last_seen_at
        );

        return;

    }


    /* -----------------------------------------------
       MESSAGE READ
    ------------------------------------------------ */

    if(
        data.type ===
        "messages_read"
    ){

        const readerUserId =
            String(
                data.reader_user_id || ""
            ).trim();

        if(
            readerUserId !==
            otherUserId
        ){

            return;

        }

        const ids =
            new Set(
                (
                    data.message_ids ||
                    []
                ).map(
                    id => String(id)
                )
            );


        document
            .querySelectorAll(
                "[data-message-id]"
            )
            .forEach(
                row => {

                    const messageId =
                        String(
                            row.dataset.messageId
                        );

                    if(
                        !ids.has(
                            messageId
                        )
                    ){
                        return;
                    }

                    const read =
                        row.querySelector(
                            ".read"
                        );

                    if(read){

                        read.textContent =
                            "✓✓";

                    }

                }
            );

        return;

    }


    /* -----------------------------------------------
       CHAT MESSAGE
    ------------------------------------------------ */

    if(
        data.type !==
        "chat_message"
    ){

        return;

    }

    const message =
        data.message;

    if(!message){
        return;
    }

    const sender =
        String(
            message.sender_user_id ||
            ""
        ).trim();

    const receiver =
        String(
            message.receiver_user_id ||
            ""
        ).trim();


    const belongsToChat =
        (
            sender ===
            currentUserId &&
            receiver ===
            otherUserId
        )
        ||
        (
            sender ===
            otherUserId &&
            receiver ===
            currentUserId
        );


    if(!belongsToChat){
        return;
    }


    addMessageFromServer(
        message
    );

    scrollBottom();


    if(
        sender ===
        otherUserId
    ){

        markMessagesRead();

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

setInterval(
    () => {

        if(
            socket &&
            socket.readyState ===
            WebSocket.OPEN
        ){

            socket.send(
                "ping"
            );

        }

    },
    25000
);


/* =========================================================
   KEYBOARD SAFE VIEWPORT
========================================================= */

function updateViewport(){

    const root =
        document.documentElement;

    if(!window.visualViewport){

        root.style.setProperty(
            "--vvh",
            window.innerHeight + "px"
        );

        root.style.setProperty(
            "--vvt",
            "0px"
        );

        root.style.setProperty(
            "--vvl",
            "0px"
        );

        root.style.setProperty(
            "--vvw",
            window.innerWidth + "px"
        );

        return;

    }


    const vv =
        window.visualViewport;


    root.style.setProperty(
        "--vvh",
        Math.round(
            vv.height
        ) + "px"
    );

    root.style.setProperty(
        "--vvt",
        Math.round(
            vv.offsetTop || 0
        ) + "px"
    );

    root.style.setProperty(
        "--vvl",
        Math.round(
            vv.offsetLeft || 0
        ) + "px"
    );

    root.style.setProperty(
        "--vvw",
        Math.round(
            vv.width ||
            window.innerWidth
        ) + "px"
    );

}


if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        updateViewport
    );

    window.visualViewport.addEventListener(
        "scroll",
        updateViewport
    );

}


window.addEventListener(
    "resize",
    updateViewport
);


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(
                ".composer"
            )
            &&
            !event.target.closest(
                ".emoji-panel"
            )
        ){

            emojiPanel.classList.remove(
                "show"
            );

        }


        if(
            !event.target.closest(
                ".composer"
            )
            &&
            !event.target.closest(
                ".attach-menu"
            )
        ){

            attachMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            updateViewport();

            loadPresence();

            markMessagesRead();

        }

    }
);


/* =========================================================
   LOAD
========================================================= */

window.addEventListener(
    "load",
    async () => {

        updateViewport();


        if(!currentUserId){

            showToast(
                "Please login first"
            );

            setTimeout(
                () => {
                    window.location.href="/";
                },
                1200
            );

            return;

        }


        if(!otherUserId){

            showToast(
                "Invalid chat user"
            );

            setTimeout(
                () => {
                    window.location.href="/home";
                },
                1200
            );

            return;

        }


        await loadChat();

        await loadPresence();

        connectWebSocket();

    }
);


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        manuallyClosed = true;

        clearTimeout(
            reconnectTimer
        );

        if(socket){

            try{
                socket.close();
            }catch(e){}

        }

    }
);

</script>
