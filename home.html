<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Usanex</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f5f8ff;
    color:#13233c;
    min-height:100vh;
}

.app{
    width:min(700px,100%);
    min-height:100vh;
    margin:auto;
    background:#f7f9fd;
    position:relative;
    padding-bottom:82px;
}


/* =========================
   TOP
========================= */

.topbar{
    height:65px;
    background:#fff;
    border-bottom:1px solid #e7ebf2;
    display:flex;
    align-items:center;
    padding:0 13px;
    gap:10px;
    position:sticky;
    top:0;
    z-index:30;
}

.brand{
    display:flex;
    align-items:center;
    gap:7px;
    flex-shrink:0;
}

.logo{
    width:39px;
    height:39px;
    border-radius:12px;
    background:linear-gradient(145deg,#168bff,#0865d8);
    color:white;
    display:grid;
    place-items:center;
    font-size:21px;
    font-weight:900;
}

.brand-name{
    font-size:18px;
    font-weight:850;
    color:#083b77;
}

.search{
    flex:1;
    height:40px;
    border:1px solid #dfe6f0;
    background:#f5f8fc;
    border-radius:14px;
    display:flex;
    align-items:center;
    padding:0 12px;
}

.search span{
    font-size:16px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:none;
    margin-left:7px;
    font-size:13px;
}

.top-btn{
    width:38px;
    height:38px;
    border:0;
    background:#f1f5fb;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    position:relative;
}

.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:20px;
    background:#ef4444;
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:800;
    border:2px solid white;
}


/* =========================
   STATUS
========================= */

.status-wrap{
    background:#fff;
    border-bottom:1px solid #e9edf4;
    padding:12px 12px 10px;
}

.status-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:10px;
}

.status-row{
    display:flex;
    gap:14px;
    overflow-x:auto;
    scrollbar-width:none;
}

.status-row::-webkit-scrollbar{
    display:none;
}

.status{
    min-width:58px;
    text-align:center;
}

.status-circle{
    width:50px;
    height:50px;
    border-radius:50%;
    margin:auto;
    background:linear-gradient(145deg,#d9ecff,#8bc5ff);
    display:grid;
    place-items:center;
    color:#0865d8;
    font-weight:800;
    border:3px solid white;
    box-shadow:0 0 0 2px #5daeff;
}

.status-name{
    margin-top:5px;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   WELCOME
========================= */

.welcome{
    padding:16px 14px 8px;
}

.welcome h2{
    font-size:20px;
}

.welcome p{
    margin-top:4px;
    font-size:12px;
    color:#7d899b;
}


/* =========================
   USERS
========================= */

.section-title{
    padding:10px 14px;
    font-size:14px;
    font-weight:800;
}

.users{
    padding:0 12px;
}

.user-card{
    background:#fff;
    border:1px solid #e7ecf3;
    border-radius:17px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:10px;
    box-shadow:0 4px 14px rgba(30,70,120,.05);
}

.user-avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:linear-gradient(145deg,#168bff,#0865d8);
    color:white;
    display:grid;
    place-items:center;
    font-size:19px;
    font-weight:800;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:14px;
    font-weight:800;
}

.user-id{
    color:#7d899b;
    font-size:11px;
    margin-top:3px;
}

.follow{
    border:0;
    border-radius:10px;
    padding:8px 12px;
    background:#1682ee;
    color:white;
    font-size:11px;
    font-weight:750;
    cursor:pointer;
}

.follow.following{
    background:#edf2f8;
    color:#344054;
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    border:1px solid #e7ecf3;
    border-radius:17px;
    margin:10px 12px;
    padding:35px 15px;
    text-align:center;
    color:#8995a8;
    font-size:13px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    height:68px;
    background:rgba(255,255,255,.97);
    border-top:1px solid #e4e9f1;
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(700px,100%);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    align-items:center;
    z-index:40;
}

.nav-item{
    border:0;
    background:none;
    color:#7c8798;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.nav-item span{
    font-size:20px;
}

.nav-item.active{
    color:#086bd8;
}


/* =========================
   CAMERA
========================= */

.camera{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(145deg,#168bff,#0865d8);
    color:white;
    border:4px solid white;
    box-shadow:0 7px 20px rgba(8,101,216,.3);
    left:50%;
    top:-27px;
    transform:translateX(-50%);
    display:grid;
    place-items:center;
    font-size:22px;
    cursor:pointer;
}


/* =========================
   MENU
========================= */

.menu{
    display:none;
    position:fixed;
    right:12px;
    top:61px;
    width:190px;
    background:white;
    border:1px solid #e3e8f0;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(20,50,90,.15);
    padding:7px;
    z-index:100;
}

.menu button{
    width:100%;
    border:0;
    background:white;
    padding:12px;
    text-align:left;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
}

.menu button:hover{
    background:#f2f6fc;
}

.toast{
    display:none;
    position:fixed;
    bottom:85px;
    left:50%;
    transform:translateX(-50%);
    background:#172033;
    color:white;
    padding:10px 17px;
    border-radius:11px;
    font-size:12px;
    z-index:200;
}
</style>
</head>

<body>

<div class="app">


<!-- =========================
     TOPBAR
========================= -->

<div class="topbar">

    <div class="brand">

        <div class="logo">
            U
        </div>

        <div class="brand-name">
            Usanex
        </div>

    </div>


    <div class="search">

        <span>🔍</span>

        <input
            type="text"
            placeholder="Search users..."
            id="searchInput"
            onkeydown="searchKey(event)"
        >

    </div>


    <button
        class="top-btn"
        onclick="openNotifications()"
    >

        🔔

        <div
            id="notificationBadge"
            class="badge"
        >
            0
        </div>

    </button>


    <button
        class="top-btn"
        onclick="toggleMenu()"
    >
        ☰
    </button>

</div>


<!-- =========================
     MENU
========================= -->

<div
    id="menu"
    class="menu"
>

    <button onclick="openProfile()">
        👤 Profile
    </button>

    <button onclick="logout()">
        🚪 Logout
    </button>

</div>


<!-- =========================
     STATUS
========================= -->

<div class="status-wrap">

    <div class="status-title">
        Status
    </div>

    <div
        id="statusRow"
        class="status-row"
    >

        <div class="status">

            <div class="status-circle">
                +
            </div>

            <div class="status-name">
                You
            </div>

        </div>

        <div class="status">
            <div class="status-circle">A</div>
            <div class="status-name">Active</div>
        </div>

        <div class="status">
            <div class="status-circle">U</div>
            <div class="status-name">Usanex</div>
        </div>

    </div>

</div>


<!-- =========================
     WELCOME
========================= -->

<div class="welcome">

    <h2 id="welcomeName">
        Welcome 👋
    </h2>

    <p>
        Connect with people on Usanex
    </p>

</div>


<div class="section-title">
    People
</div>


<!-- =========================
     USERS
========================= -->

<div
    id="users"
    class="users"
>

    <div class="empty">
        Loading users...
    </div>

</div>


</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom-nav">

    <button
        class="nav-item active"
        onclick="goHome()"
    >
        <span>⌂</span>
        Home
    </button>


    <button
        class="nav-item"
        onclick="openReels()"
    >
        <span>▶</span>
        Reel
    </button>


    <button
        class="nav-item"
        onclick="openConnections()"
    >
        <span>◎</span>
        coll
    </button>


    <button
        class="nav-item"
        onclick="openProfile()"
    >
        <span>♙</span>
        Profile
    </button>


    <button
        class="camera"
        onclick="openCamera()"
    >
        📷
    </button>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================
   USER
========================= */

let currentUser=null;

function getUser(){

    try{

        const saved=
            localStorage.getItem(
                "usanex_user"
            );

        if(saved){

            const user=
                JSON.parse(saved);

            if(
                user &&
                user.user_id
            ){

                return user;

            }

        }


        const old=
            localStorage.getItem("user");

        if(old){

            const user=
                JSON.parse(old);

            if(
                user &&
                user.user_id
            ){

                return user;

            }

        }

    }catch(error){

        console.error(error);

    }

    return null;
}


currentUser=getUser();


/* =========================
   LOGIN CHECK
========================= */

if(!currentUser){

    window.location.href="/";

}


/* =========================
   WELCOME
========================= */

function updateWelcome(){

    if(!currentUser){
        return;
    }

    const name=
        currentUser.name ||
        "User";

    document.getElementById(
        "welcomeName"
    ).textContent=
        "Hello, "+name+" 👋";

}


/* =========================
   NOTIFICATION COUNT
========================= */

async function loadNotificationCount(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){
        return;
    }

    try{

        const response=
            await fetch(
                "/api/notifications?user_id="+
                encodeURIComponent(
                    currentUser.user_id
                )+
                "&_="+
                Date.now()
            );

        if(!response.ok){
            return;
        }

        const data=
            await response.json();

        if(
            !data.ok ||
            !Array.isArray(
                data.notifications
            )
        ){

            return;

        }


        const unreadCount=
            data.notifications.filter(
                notification =>
                    notification.is_read === false
            ).length;


        const badge=
            document.getElementById(
                "notificationBadge"
            );


        if(unreadCount>0){

            badge.textContent=
                unreadCount>99
                    ? "99+"
                    : unreadCount;

            badge.style.display=
                "flex";

        }else{

            badge.textContent="0";

            badge.style.display=
                "none";

        }

    }catch(error){

        console.error(
            "Notification count:",
            error
        );

    }

}


/* =========================
   NOTIFICATION PAGE
========================= */

function openNotifications(){

    window.location.href=
        "/notifications";

}


/* =========================
   MENU
========================= */

function toggleMenu(){

    const menu=
        document.getElementById(
            "menu"
        );

    menu.style.display=
        menu.style.display==="block"
            ? "none"
            : "block";

}


/* =========================
   SEARCH
========================= */

function searchKey(event){

    if(event.key==="Enter"){

        const value=
            document.getElementById(
                "searchInput"
            ).value.trim();

        if(value){

            window.location.href=
                "/search?query="+
                encodeURIComponent(
                    value
                );

        }

    }

}


/* =========================
   PROFILE
========================= */

function openProfile(){

    if(
        currentUser &&
        currentUser.user_id
    ){

        window.location.href=
            "/search?user_id="+
            encodeURIComponent(
                currentUser.user_id
            );

    }

}


/* =========================
   OTHER NAV
========================= */

function goHome(){

    window.location.href="/home";

}


function openReels(){

    window.location.href=
        "/reels";

}


function openConnections(){

    window.location.href=
        "/search";

}


function openCamera(){

    showToast(
        "Camera coming soon"
    );

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "usanex_token"
    );

    localStorage.removeItem(
        "usanex_user"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href="/";

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const el=
        document.getElementById(
            "toast"
        );

    el.textContent=message;

    el.style.display="block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer=
        setTimeout(
            ()=>{
                el.style.display="none";
            },
            2200
        );

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    const container=
        document.getElementById(
            "users"
        );

    /*
      अगर आपका search/users API बाद में
      बनता है तो इसी जगह connect होगा.
    */

    container.innerHTML=
        `
        <div class="empty">

            🔎

            <br><br>

            Search for people using
            the search bar above.

        </div>
        `;

}


/* =========================
   WEBSOCKET
========================= */

let socket=null;

function connectSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    try{

        const protocol=
            location.protocol==="https:"
                ? "wss:"
                : "ws:";


        socket=
            new WebSocket(

                protocol+
                "//"+
                location.host+
                "/ws/"+
                encodeURIComponent(
                    currentUser.user_id
                )

            );


        socket.onopen=()=>{

            console.log(
                "Usanex socket connected"
            );

        };


        socket.onmessage=event=>{

            try{

                const payload=
                    JSON.parse(
                        event.data
                    );

                /*
                  New notification आते ही
                  Home badge फिर से database
                  से calculate होगा.
                */

                if(
                    payload.notification ||
                    payload.type
                ){

                    loadNotificationCount();

                    showToast(
                        "New notification 🔔"
                    );

                }

            }catch(error){

                console.error(
                    "Socket message:",
                    error
                );

            }

        };


        socket.onclose=()=>{

            setTimeout(
                connectSocket,
                3000
            );

        };


        socket.onerror=error=>{

            console.error(
                "Socket error:",
                error
            );

        };

    }catch(error){

        console.error(error);

    }

}


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState===
            "visible"
        ){

            loadNotificationCount();

            loadUsers();

        }

    }
);


/* =========================
   PAGESHOW
========================= */

window.addEventListener(
    "pageshow",
    function(){

        /*
          Notifications page से वापस
          Home आने पर badge refresh.
        */

        loadNotificationCount();

        loadUsers();

    }
);


/* =========================
   PERIODIC CHECK
========================= */

setInterval(
    loadNotificationCount,
    30000
);


/* =========================
   START
========================= */

updateWelcome();

loadNotificationCount();

loadUsers();

connectSocket();

</script>

</body>
</html>
