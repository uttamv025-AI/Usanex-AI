<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Usanex</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    min-height:100vh;
    padding-bottom:100px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}


/* =========================
   TOPBAR
========================= */

.topbar{
    height:78px;

    padding:0 14px;

    display:flex;
    align-items:center;

    gap:9px;

    background:rgba(7,9,13,.90);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    position:sticky;
    top:0;

    z-index:50;

    backdrop-filter:blur(18px);
}


/* =========================
   LOGO
========================= */

.brand{
    display:flex;
    align-items:center;
    gap:7px;

    flex-shrink:0;
}

.logo-mark{
    width:42px;
    height:42px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:24px;
    font-weight:900;
    color:#fff;

    z-index:2;
}

.logo-shine{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:10px;
    bottom:6px;
}

.logo-name{
    font-size:18px;
    font-weight:800;

    letter-spacing:-.4px;
}


/* =========================
   SEARCH
========================= */

.search-box{
    flex:1;

    min-width:0;

    height:42px;

    display:flex;
    align-items:center;

    padding:0 12px;

    border-radius:22px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.search-icon{
    font-size:19px;

    color:#8993a5;

    margin-right:7px;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

.search-box input::placeholder{
    color:#747d8d;
}


/* =========================
   TOP BUTTON
========================= */

.top-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:13px;

    background:#151820;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    cursor:pointer;

    position:relative;

    border:
        1px solid
        rgba(255,255,255,.07);
}


/* =========================
   BADGE
========================= */

.badge{
    position:absolute;

    top:-5px;
    right:-5px;

    min-width:18px;
    height:18px;

    padding:0 5px;

    border-radius:20px;

    background:#ef4444;

    color:#fff;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:9px;

    font-weight:800;

    border:
        2px solid
        #07090d;
}


/* =========================
   STATUS
========================= */

.status-wrap{
    padding:14px 14px 12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(10,13,18,.78);
}

.status-title{
    font-size:13px;

    font-weight:800;

    margin-bottom:11px;
}

.status-row{
    display:flex;

    gap:15px;

    overflow-x:auto;

    scrollbar-width:none;
}

.status-row::-webkit-scrollbar{
    display:none;
}

.status{
    min-width:57px;

    text-align:center;
}

.status-circle{
    width:50px;
    height:50px;

    margin:auto;

    border-radius:50%;

    display:grid;
    place-items:center;

    color:#fff;

    font-size:18px;
    font-weight:800;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0757c8
        );

    border:
        2px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);
}

.status-circle.you{
    background:
        #151a23;

    border:
        2px solid
        #258cff;

    color:#3296ff;

    font-size:23px;
}

.status-name{
    margin-top:5px;

    font-size:10px;

    color:#a0a8b6;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================
   WELCOME
========================= */

.welcome{
    padding:20px 15px 10px;
}

.welcome h2{
    font-size:21px;

    font-weight:800;
}

.welcome p{
    margin-top:5px;

    font-size:12px;

    color:#7f8898;
}


/* =========================
   SECTION
========================= */

.section-head{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:14px 15px 10px;
}

.section-title{
    font-size:14px;

    font-weight:800;
}

.section-count{
    font-size:11px;

    color:#737d8d;
}


/* =========================
   PEOPLE
========================= */

.people{
    padding:0 14px;
}


/* =========================
   USER CARD
========================= */

.user-card{
    min-height:76px;

    display:flex;

    align-items:center;

    padding:12px;

    margin-bottom:10px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.96),
            rgba(14,17,23,.96)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);

    cursor:pointer;

    transition:
        transform .15s,
        border-color .15s;
}

.user-card:active{
    transform:scale(.985);
}

.user-card.follow-mode{
    border-color:
        rgba(45,145,255,.35);
}


/* =========================
   AVATAR
========================= */

.user-avatar{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:
        2px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);

    color:#fff;

    font-size:19px;

    font-weight:800;
}

.user-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;
}


/* =========================
   USER INFO
========================= */

.user-info{
    flex:1;

    min-width:0;

    margin-left:12px;
}

.user-name{
    font-size:14px;

    font-weight:750;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;

    font-size:10px;

    color:#818a9a;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.user-status{
    margin-top:4px;

    font-size:10px;

    color:#69d99b;
}


/* =========================
   FOLLOW BUTTON
========================= */

.follow-btn{
    min-width:84px;

    height:36px;

    padding:0 12px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;

    font-size:11px;

    font-weight:700;

    cursor:pointer;

    flex-shrink:0;
}

.follow-btn.connected{
    background:#252b36;

    color:#75e0a2;
}

.follow-btn.follow{
    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;
}

.follow-btn.loading{
    background:#252b36;

    color:#aeb7c5;
}

.follow-btn:disabled{
    opacity:.75;

    cursor:default;
}


/* =========================
   EMPTY
========================= */

.empty{
    margin:10px 0;

    padding:38px 20px;

    text-align:center;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    color:#7f8898;

    font-size:12px;
}

.empty-icon{
    width:58px;
    height:58px;

    margin:0 auto 15px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle,
            rgba(42,142,255,.22),
            rgba(42,142,255,.02)
        );

    color:#3296ff;

    font-size:25px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    height:70px;

    background:
        rgba(10,13,18,.97);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:min(700px,100%);

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    align-items:center;

    z-index:80;

    backdrop-filter:blur(18px);
}

.nav-item{
    border:0;

    background:none;

    color:#747d8d;

    cursor:pointer;

    font-size:10px;

    font-weight:700;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;
}

.nav-item span{
    font-size:20px;

    line-height:20px;
}

.nav-item.active{
    color:#3296ff;
}


/* =========================
   CAMERA
========================= */

.camera{
    position:absolute;

    width:53px;
    height:53px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;

    border:
        4px solid
        #07090d;

    box-shadow:
        0 7px 22px
        rgba(8,101,216,.40);

    left:50%;

    top:-27px;

    transform:translateX(-50%);

    display:grid;
    place-items:center;

    font-size:22px;

    cursor:pointer;

    z-index:5;
}


/* =========================
   MENU
========================= */

.menu{
    display:none;

    position:fixed;

    right:12px;

    top:70px;

    width:190px;

    background:
        linear-gradient(
            145deg,
            #1a1f29,
            #0e1219
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:16px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    padding:7px;

    z-index:100;
}

.menu button{
    width:100%;

    border:0;

    background:transparent;

    color:#fff;

    padding:12px;

    text-align:left;

    border-radius:10px;

    cursor:pointer;

    font-size:13px;
}

.menu button:active{
    background:#252b36;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;

    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:12px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:390px){

    .topbar{
        padding:0 8px;

        gap:6px;
    }

    .logo-mark{
        width:38px;
        height:38px;

        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        display:none;
    }

    .search-box{
        height:39px;
    }

    .top-btn{
        width:37px;
        height:37px;
    }

    .status-wrap{
        padding-left:11px;
        padding-right:11px;
    }

    .people{
        padding:0 11px;
    }

    .user-card{
        padding:10px;
    }

    .user-avatar{
        width:48px;
        height:48px;
    }

    .follow-btn{
        min-width:76px;

        padding:0 8px;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- =========================
     TOPBAR
========================= -->

<div class="topbar">


    <div class="brand">

        <div class="logo-mark">

            <div class="logo-u">
                U
            </div>

            <div class="logo-shine"></div>

        </div>

        <div class="logo-name">
            Usanex
        </div>

    </div>


    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search users..."
            onkeydown="searchKey(event)"
        >

    </div>


    <button
        class="top-btn"
        onclick="openNotifications()"
        aria-label="Notifications"
    >

        🔔

        <div
            id="notificationBadge"
            class="badge"
        >
            0
        </div>

    </button>


    <button
        class="top-btn"
        onclick="toggleMenu()"
        aria-label="Menu"
    >
        ☰
    </button>


</div>



<!-- =========================
     MENU
========================= -->

<div
    id="menu"
    class="menu"
>

    <button onclick="openProfile()">
        👤 Profile
    </button>

    <button onclick="logout()">
        🚪 Logout
    </button>

</div>



<!-- =========================
     STATUS
========================= -->

<div class="status-wrap">

    <div class="status-title">
        Status
    </div>


    <div
        id="statusRow"
        class="status-row"
    >


        <div class="status">

            <div class="status-circle you">
                +
            </div>

            <div class="status-name">
                You
            </div>

        </div>


    </div>

</div>



<!-- =========================
     WELCOME
========================= -->

<div class="welcome">

    <h2 id="welcomeName">
        Hello 👋
    </h2>

    <p>
        Connect with people on Usanex
    </p>

</div>



<!-- =========================
     PEOPLE HEADER
========================= -->

<div class="section-head">

    <div class="section-title">
        Connected People
    </div>

    <div
        id="peopleCount"
        class="section-count"
    >
        0
    </div>

</div>



<!-- =========================
     PEOPLE
========================= -->

<div
    id="people"
    class="people"
>

    <div class="empty">

        <div class="empty-icon">
            👥
        </div>

        Loading connections...

    </div>

</div>



</div>



<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom-nav">


    <button
        class="nav-item active"
        onclick="goHome()"
    >

        <span>⌂</span>

        Home

    </button>


    <button
        class="nav-item"
        onclick="openReels()"
    >

        <span>▶</span>

        Reel

    </button>


    <button
        class="nav-item"
        onclick="openConnections()"
    >

        <span>◎</span>

        coll

    </button>


    <button
        class="nav-item"
        onclick="openProfile()"
    >

        <span>♙</span>

        Profile

    </button>


    <button
        class="camera"
        onclick="openCamera()"
    >

        📷

    </button>


</div>



<div
    id="toast"
    class="toast"
></div>



<script>

/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;

let socket = null;


/* =========================================================
   GET USER
========================================================= */

function getUser(){

    try{

        const modern =
            localStorage.getItem(
                "usanex_user"
            );

        if(modern){

            const user =
                JSON.parse(modern);

            if(
                user &&
                user.user_id
            ){

                return user;

            }

        }


        const old =
            localStorage.getItem(
                "user"
            );

        if(old){

            const user =
                JSON.parse(old);

            if(
                user &&
                user.user_id
            ){

                return user;

            }

        }

    }catch(error){

        console.error(
            "User error:",
            error
        );

    }

    return null;

}


currentUser = getUser();


/* =========================================================
   LOGIN CHECK
========================================================= */

if(!currentUser){

    window.location.href="/";

}


/* =========================================================
   WELCOME
========================================================= */

function updateWelcome(){

    if(!currentUser){
        return;
    }

    document.getElementById(
        "welcomeName"
    ).textContent =
        "Hello, " +
        (
            currentUser.name ||
            "User"
        ) +
        " 👋";

}


/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id="+
                encodeURIComponent(
                    currentUser.user_id
                )+
                "&_="+
                Date.now()
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        if(
            !data.ok ||
            !Array.isArray(
                data.notifications
            )
        ){

            return;

        }


        const unread =
            data.notifications.filter(
                item =>
                    item.is_read === false
            ).length;


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        if(unread > 0){

            badge.textContent =
                unread > 99
                    ? "99+"
                    : unread;

            badge.style.display =
                "flex";

        }else{

            badge.textContent =
                "0";

            badge.style.display =
                "none";

        }

    }catch(error){

        console.error(
            "Notification count:",
            error
        );

    }

}


/* =========================================================
   OPEN NOTIFICATIONS
========================================================= */

function openNotifications(){

    window.location.href =
        "/notifications";

}


/* =========================================================
   SEARCH
========================================================= */

function searchKey(event){

    if(
        event.key !== "Enter"
    ){

        return;

    }


    const input =
        document.getElementById(
            "searchInput"
        );


    const value =
        input.value.trim();


    if(!value){

        return;

    }


    window.location.href =
        "/search?query="+
        encodeURIComponent(
            value
        );

}


/* =========================================================
   MENU
========================================================= */

function toggleMenu(){

    const menu =
        document.getElementById(
            "menu"
        );


    if(
        menu.style.display ===
        "block"
    ){

        menu.style.display =
            "none";

    }else{

        menu.style.display =
            "block";

    }

}


/* =========================================================
   CLOSE MENU OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function(event){

        const menu =
            document.getElementById(
                "menu"
            );

        const button =
            event.target.closest(
                ".top-btn"
            );


        if(
            !event.target.closest(
                "#menu"
            ) &&
            !button
        ){

            menu.style.display =
                "none";

        }

    }
);


/* =========================================================
   PROFILE
========================================================= */

function openProfile(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    window.location.href =
        "/search?user_id="+
        encodeURIComponent(
            currentUser.user_id
        );

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href =
        "/home";

}


function openReels(){

    window.location.href =
        "/reels";

}


function openConnections(){

    window.location.href =
        "/search";

}


function openCamera(){

    showToast(
        "Camera coming soon"
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    localStorage.removeItem(
        "usanex_token"
    );

    localStorage.removeItem(
        "usanex_user"
    );

    localStorage.removeItem(
        "user"
    );


    window.location.href =
        "/";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   AVATAR LETTER
========================================================= */

function getInitial(name){

    if(!name){

        return "U";

    }


    return String(name)
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =========================================================
   CONNECTION DATA NORMALIZER
========================================================= */

function normalizePerson(item){

    if(!item){

        return null;

    }


    const user =
        item.user ||
        item.person ||
        item.profile ||
        item;


    const userId =
        user.user_id ||
        user.id ||
        item.user_id ||
        item.id;


    const name =
        user.name ||
        user.display_name ||
        item.name ||
        "User";


    if(
        !userId ||
        String(userId) ===
        String(currentUser.user_id)
    ){

        return null;

    }


    return {

        user_id:
            String(userId),

        name:
            String(name),

        mobile:
            user.mobile ||
            item.mobile ||
            "",

        avatar:
            user.avatar ||
            user.profile_picture ||
            user.profile_pic ||
            item.avatar ||
            item.profile_picture ||
            "",

        status:
            "Connected"

    };

}


/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPeople(list){

    const container =
        document.getElementById(
            "people"
        );


    const count =
        document.getElementById(
            "peopleCount"
        );


    const people =
        Array.isArray(list)
            ? list
                .map(
                    normalizePerson
                )
                .filter(Boolean)
            : [];


    count.textContent =
        people.length;


    if(!people.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                No connected people yet.

                <br><br>

                Search users and connect
                with people on Usanex.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    people.forEach(
        function(person){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "user-card";


            card.dataset.userId =
                person.user_id;


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "user-avatar";


            if(person.avatar){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    person.avatar;

                img.alt =
                    person.name;

                img.onerror =
                    function(){

                        this.remove();

                        avatar.textContent =
                            getInitial(
                                person.name
                            );

                    };


                avatar.appendChild(
                    img
                );

            }else{

                avatar.textContent =
                    getInitial(
                        person.name
                    );

            }


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "user-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "user-name";


            name.textContent =
                person.name;


            const id =
                document.createElement(
                    "div"
                );


            id.className =
                "user-id";


            id.textContent =
                "ID: " +
                person.user_id;


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "user-status";


            status.textContent =
                "● Connected";


            info.appendChild(
                name
            );

            info.appendChild(
                id
            );

            info.appendChild(
                status
            );


            const follow =
                document.createElement(
                    "button"
                );


            follow.className =
                "follow-btn connected";


            follow.textContent =
                "Connected";


            follow.onclick =
                function(event){

                    event.stopPropagation();

                    activateFollow(
                        card,
                        person,
                        follow
                    );

                };


            card.appendChild(
                avatar
            );

            card.appendChild(
                info
            );

            card.appendChild(
                follow
            );


            card.onclick =
                function(){

                    activateFollow(
                        card,
                        person,
                        follow
                    );

                };


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   CONNECTED → FOLLOW
========================================================= */

function activateFollow(
    card,
    person,
    button
){

    if(
        !card ||
        !person ||
        !button
    ){

        return;

    }


    if(
        button.dataset.following ===
        "true"
    ){

        return;

    }


    button.dataset.following =
        "true";


    card.classList.add(
        "follow-mode"
    );


    button.className =
        "follow-btn follow";


    button.textContent =
        "Follow";


    button.onclick =
        function(event){

            event.stopPropagation();

            sendFollow(
                card,
                person,
                button
            );

        };

}


/* =========================================================
   SEND FOLLOW
========================================================= */

async function sendFollow(
    card,
    person,
    button
){

    if(
        !currentUser ||
        !currentUser.user_id ||
        !person.user_id
    ){

        return;

    }


    if(
        button.dataset.sending ===
        "true"
    ){

        return;

    }


    button.dataset.sending =
        "true";


    button.disabled =
        true;


    button.className =
        "follow-btn loading";


    button.textContent =
        "Following...";


    try{

        const response =
            await fetch(
                "/api/follow",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        requester_id:
                            currentUser.user_id,

                        target_user_id:
                            person.user_id

                    })

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            data.ok === false
        ){

            throw new Error(
                data.message ||
                "Follow failed"
            );

        }


        showToast(
            "Follow request sent ✓"
        );


        /*
          Successful follow ke baad
          person ko Home se turant remove.
        */

        card.style.transition =
            "opacity .25s, transform .25s";


        card.style.opacity =
            "0";


        card.style.transform =
            "translateX(35px)";


        setTimeout(
            function(){

                card.remove();

                updatePeopleCount();

            },
            260
        );


        /*
          Notification count refresh.
        */

        loadNotificationCount();


    }catch(error){

        console.error(
            "Follow error:",
            error
        );


        button.dataset.sending =
            "false";


        button.disabled =
            false;


        button.className =
            "follow-btn follow";


        button.textContent =
            "Follow";


        showToast(
            error.message ||
            "Follow failed"
        );

    }

}


/* =========================================================
   PEOPLE COUNT
========================================================= */

function updatePeopleCount(){

    const cards =
        document.querySelectorAll(
            "#people .user-card"
        );


    document.getElementById(
        "peopleCount"
    ).textContent =
        cards.length;


    if(cards.length === 0){

        document.getElementById(
            "people"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                No connected people yet.

            </div>

        `;

    }

}


/* =========================================================
   LOAD CONNECTIONS
========================================================= */

async function loadConnections(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    const container =
        document.getElementById(
            "people"
        );


    try{

        /*
          Main connections endpoint.
        */

        const response =
            await fetch(
                "/api/connections?user_id="+
                encodeURIComponent(
                    currentUser.user_id
                )+
                "&_="+
                Date.now()
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Connections API unavailable"
            );

        }


        const data =
            await response.json();


        if(
            !data.ok
        ){

            throw new Error(
                data.message ||
                "Unable to load connections"
            );

        }


        const list =
            data.connections ||
            data.users ||
            data.people ||
            [];


        renderPeople(
            list
        );


    }catch(error){

        console.error(
            "Connections:",
            error
        );


        /*
          Agar backend empty response
          de raha ho to clean empty state.
        */

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                No connected people yet.

                <br><br>

                Find people from Search.

            </div>

        `;


        document.getElementById(
            "peopleCount"
        ).textContent =
            "0";

    }

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    try{

        const protocol =
            location.protocol ===
            "https:"
                ? "wss:"
                : "ws:";


        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host +
                "/ws/" +
                encodeURIComponent(
                    currentUser.user_id
                )
            );


        socket.onopen =
            function(){

                console.log(
                    "Usanex socket connected"
                );

            };


        socket.onmessage =
            function(event){

                try{

                    const payload =
                        JSON.parse(
                            event.data
                        );


                    /*
                      Notification aaye to
                      badge refresh.
                    */

                    if(
                        payload.notification ||
                        payload.type ===
                        "notification" ||
                        payload.type ===
                        "follow_request" ||
                        payload.type ===
                        "connection_verified"
                    ){

                        loadNotificationCount();

                        loadConnections();

                        showToast(
                            "New notification 🔔"
                        );

                    }

                }catch(error){

                    console.error(
                        "Socket message:",
                        error
                    );

                }

            };


        socket.onclose =
            function(){

                setTimeout(
                    connectSocket,
                    3000
                );

            };


        socket.onerror =
            function(error){

                console.error(
                    "Socket error:",
                    error
                );

            };

    }catch(error){

        console.error(
            "Socket connection:",
            error
        );

    }

}

        if(

        ){

updateWelcome();
