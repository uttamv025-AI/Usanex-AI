<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Usanex - Home</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090b10;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 70px;
            background: #11141b;
            border-bottom: 1px solid #272c35;

            display: flex;
            align-items: center;

            padding: 0 15px;
            gap: 12px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            object-fit: contain;

            flex-shrink: 0;
        }

        .search-box {
            flex: 1;

            height: 42px;

            background: #1b1f27;

            border: 1px solid #303640;

            border-radius: 22px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            cursor: pointer;
        }

        .search-icon {
            font-size: 20px;
            margin-right: 8px;
            color: #aeb5c0;
        }

        .search-text {
            color: #9ba2ad;
            font-size: 14px;
        }

        .header-button {
            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            color: white;

            font-size: 21px;

            cursor: pointer;

            flex-shrink: 0;
        }

        /* ==============================
           MAIN
        ============================== */

        .main {
            max-width: 700px;
            margin: auto;
            padding: 18px 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;

            letter-spacing: 1px;

            color: #bfc5cf;

            margin-bottom: 14px;
        }

        /* ==============================
           CONNECTION LIST
        ============================== */

        .connections {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-card {
            min-height: 72px;

            background: #12161d;

            border: 1px solid #242a33;

            border-radius: 15px;

            display: flex;
            align-items: center;

            padding: 10px 12px;

            transition: 0.2s;
        }

        .user-card:active {
            transform: scale(0.98);
        }

        .profile-photo {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            background: #272d37;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;

            margin-right: 12px;

            flex-shrink: 0;
        }

        .user-info {
            flex: 1;

            min-width: 0;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            margin-top: 5px;

            font-size: 12px;

            color: #8e96a3;
        }

        .arrow {
            font-size: 28px;
            color: #777f8c;

            padding-left: 8px;
        }

        /* ==============================
           EMPTY STATE
        ============================== */

        .empty {
            text-align: center;

            padding: 90px 20px;

            color: #7e8794;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-title {
            color: #c4cad3;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .empty-text {
            font-size: 13px;
            line-height: 20px;
        }

        /* ==============================
           CAMERA
        ============================== */

        .camera-button {
            position: fixed;

            right: 18px;
            bottom: 88px;

            width: 56px;
            height: 56px;

            border-radius: 50%;

            border: 1px solid #39414c;

            background: #181d25;

            color: white;

            font-size: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.4);

            cursor: pointer;

            z-index: 200;
        }

        /* ==============================
           BOTTOM NAV
        ============================== */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 70px;

            background: #11141b;

            border-top: 1px solid #272c35;

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 150;
        }

        .nav-item {
            border: none;
            background: transparent;

            color: #858d99;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 4px;

            font-size: 11px;

            cursor: pointer;

            min-width: 65px;
        }

        .nav-icon {
            font-size: 21px;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .collection {
            font-size: 24px;
        }

        /* ==============================
           DESKTOP
        ============================== */

        @media (min-width: 700px) {

            .header {
                padding-left: calc((100% - 700px) / 2);
                padding-right: calc((100% - 700px) / 2);
            }

            .main {
                padding-top: 25px;
            }
        }

    </style>
</head>


<body>

    <!-- ==============================
         HEADER
    ============================== -->

    <header class="header">

        <!--
            IMPORTANT:
            Yahan apne LOGIN PAGE wale
            SAME Usanex logo ka path rakho.
        -->

        <img
            src="/static/images/usanex-logo.png"
            class="logo"
            alt="Usanex"
        >

        <div
            class="search-box"
            onclick="openSearch()"
        >

            <span class="search-icon">⌕</span>

            <span class="search-text">
                Search people
            </span>

        </div>

        <button
            class="header-button"
            onclick="openNotifications()"
        >
            🔔
        </button>

        <button
            class="header-button"
            onclick="openWallet()"
        >
            ₹
        </button>

        <button
            class="header-button"
            onclick="openMenu()"
        >
            ☰
        </button>

    </header>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="main">

        <div class="section-title">
            CONNECTIONS
        </div>

        <div
            id="connections"
            class="connections"
        >

            <!-- JavaScript yahan users dalega -->

        </div>

    </main>


    <!-- ==============================
         CAMERA
    ============================== -->

    <button
        class="camera-button"
        onclick="openCamera()"
        aria-label="Camera"
    >
        📷
    </button>


    <!-- ==============================
         BOTTOM NAVIGATION
    ============================== -->

    <nav class="bottom-nav">

        <button
            class="nav-item active"
            onclick="goHome()"
        >
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </button>


        <button
            class="nav-item"
            onclick="openReels()"
        >
            <span class="nav-icon">▶</span>
            <span>Reels</span>
        </button>


        <button
            class="nav-item"
            onclick="openCollection()"
        >
            <span class="collection">＋</span>
            <span>Coll</span>
        </button>


        <button
            class="nav-item"
            onclick="openProfile()"
        >
            <span class="nav-icon">♙</span>
            <span>Profile</span>
        </button>

    </nav>


    <script>

        /* ==========================================
           LOAD HOME CONNECTIONS
        ========================================== */

        async function loadConnections() {

            const container =
                document.getElementById("connections");

            container.innerHTML = "";

            try {

                const response =
                    await fetch("/api/home/connections");

                const data =
                    await response.json();


                if (!data.ok) {

                    showEmpty(
                        "Unable to load connections",
                        data.message || "Please try again"
                    );

                    return;
                }


                if (
                    !data.users ||
                    data.users.length === 0
                ) {

                    showEmpty(
                        "No connections yet",
                        "Search for people and connect with them. Your verified connections will appear here."
                    );

                    return;
                }


                data.users.forEach(user => {

                    const card =
                        document.createElement("div");

                    card.className = "user-card";

                    card.onclick = function () {

                        openUser(user.user_id);

                    };


                    const firstLetter =
                        (user.name || "U")
                        .charAt(0)
                        .toUpperCase();


                    card.innerHTML = `

                        <div class="profile-photo">
                            ${firstLetter}
                        </div>

                        <div class="user-info">

                            <div class="user-name">
                                ${escapeHtml(user.name)}
                            </div>

                            <div class="user-id">
                                ID: ${escapeHtml(user.user_id)}
                            </div>

                        </div>

                        <div class="arrow">
                            ›
                        </div>

                    `;


                    container.appendChild(card);

                });

            }
            catch (error) {

                console.error(error);

                showEmpty(
                    "Something went wrong",
                    "Unable to load your connections."
                );

            }

        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        function showEmpty(title, text) {

            const container =
                document.getElementById("connections");

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        👥
                    </div>

                    <div class="empty-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="empty-text">
                        ${escapeHtml(text)}
                    </div>

                </div>

            `;

        }


        /* ==========================================
           SAFE HTML
        ========================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           OPEN USER
        ========================================== */

        function openUser(userId) {

            window.location.href =
                "/search?user_id=" +
                encodeURIComponent(userId);

        }


        /* ==========================================
           NAVIGATION
        ========================================== */

        function openSearch() {

            window.location.href = "/search";

        }


        function openNotifications() {

            window.location.href =
                "/notifications";

        }


        function openWallet() {

            window.location.href =
                "/wallet";

        }


        function openMenu() {

            alert("Menu will be connected next.");

        }


        function openCamera() {

            alert("Camera will be connected next.");

        }


        function goHome() {

            window.location.href = "/home";

        }


        function openReels() {

            alert("Reels will be connected next.");

        }


        function openCollection() {

            alert("Collection will be connected next.");

        }


        function openProfile() {

            window.location.href = "/profile";

        }


        /* ==========================================
           START
        ========================================== */

        loadConnections();

    </script>

</body>
</html>
