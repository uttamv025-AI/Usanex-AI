<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usanex - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6fb;
            color: #171717;
        }

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
            position: relative;
            padding-bottom: 80px;
        }

        /* =========================
           TOP HEADER
        ========================= */

        .header {
            height: 68px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            background: #fff;
            border-bottom: 1px solid #ededed;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* SAME LOGO AS LOGIN PAGE */

        .logo {
            width: 82px;
            min-width: 82px;
            height: 42px;
            object-fit: contain;
        }

        /* SEARCH */

        .search-box {
            flex: 1;
            height: 40px;
            background: #f1f3f7;
            border-radius: 22px;
            display: flex;
            align-items: center;
            padding: 0 13px;
            gap: 7px;
        }

        .search-box span {
            font-size: 16px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
        }

        /* HEADER ICON */

        .top-icon {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            background: #f3f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
        }

        .top-icon:active {
            transform: scale(.90);
        }


        /* =========================
           STATUS
        ========================= */

        .status-section {
            border-bottom: 1px solid #eeeeee;
            padding: 14px 0;
        }

        .status-title {
            padding: 0 15px 11px;
            font-size: 14px;
            font-weight: 700;
        }

        .status-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 15px;
            scrollbar-width: none;
        }

        .status-scroll::-webkit-scrollbar {
            display: none;
        }

        .status {
            min-width: 58px;
            text-align: center;
        }

        .status-image {
            width: 54px;
            height: 54px;
            padding: 2px;
            border-radius: 50%;
            margin: auto;
            background: linear-gradient(
                135deg,
                #6d35ff,
                #d52fff,
                #ff4f9a,
                #ffae00
            );
        }

        .status-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .status-name {
            margin-top: 5px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================
           USERS
        ========================= */

        .users {
            width: 100%;
        }

        .user-card {
            min-height: 78px;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 13px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .user-card:hover {
            background: #fafaff;
        }

        .user-photo {
            width: 53px;
            height: 53px;
            min-width: 53px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 15px;
            font-weight: 700;
        }

        .username {
            color: #777;
            font-size: 12px;
            margin-top: 3px;
        }

        .user-id {
            color: #a1a1a1;
            font-size: 10px;
            margin-top: 3px;
        }

        /* FOLLOW */

        .follow-btn {
            border: none;
            background: #6d35ff;
            color: white;
            padding: 8px 13px;
            min-width: 76px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .follow-btn.following {
            background: #eeeeee;
            color: #333;
        }

        /* PROFILE ARROW */

        .arrow {
            color: #aaa;
            font-size: 24px;
            margin-left: 2px;
            padding: 5px;
        }


        /* =========================
           CAMERA
        ========================= */

        .camera {
            position: fixed;
            bottom: 75px;
            right: max(15px, calc((100vw - 600px) / 2 + 15px));
            z-index: 60;
        }

        .camera-button {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 17px;
            background: linear-gradient(
                135deg,
                #6d35ff,
                #a42cff
            );
            color: white;
            font-size: 23px;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(70, 30, 180, .25);
        }

        .camera-button:active {
            transform: scale(.92);
        }


        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 65px;
            background: rgba(255,255,255,.98);
            border-top: 1px solid #e9e9e9;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 55;
        }

        .nav-item {
            width: 70px;
            height: 55px;
            border: none;
            background: transparent;
            color: #777;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #6d35ff;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 20px;
        }

        .nav-label {
            font-size: 10px;
        }

        .collection-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #eeeaff;
            color: #6d35ff;
            font-size: 24px;
            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 430px) {

            .header {
                padding: 9px;
                gap: 6px;
            }

            .logo {
                width: 70px;
                min-width: 70px;
            }

            .top-icon {
                width: 32px;
                height: 32px;
                font-size: 15px;
            }

            .search-box {
                height: 37px;
            }

            .user-card {
                padding: 10px;
            }

            .user-photo {
                width: 49px;
                height: 49px;
                min-width: 49px;
            }

            .follow-btn {
                min-width: 70px;
                padding: 7px 9px;
            }
        }
    </style>
</head>

<script>

    /* =========================
       FOLLOW / UNFOLLOW
    ========================= */

    function toggleFollow(button, event) {

        event.stopPropagation();

        if (button.classList.contains("following")) {

            button.classList.remove("following");
            button.innerText = "Follow";

        } else {

            button.classList.add("following");
            button.innerText = "Unfollow";

        }
    }


    /* =========================
       SEARCH
    ========================= */

    function searchUsers() {

        const input =
            document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

        const users =
            document.querySelectorAll(".user-card");

        users.forEach(user => {

            const name =
                user.dataset.name;

            if (name.includes(input)) {

                user.style.display = "flex";

            } else {

                user.style.display = "none";

            }

        });
    }

    /* =========================

    }

</script>
