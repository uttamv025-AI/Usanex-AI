<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Usanex</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#dceeff;
}

body{
    display:flex;
    justify-content:center;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:520px;
    height:100vh;
    background:#ffffff;
    position:relative;
    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{
    height:66px;
    display:flex;
    align-items:center;
    padding:8px 14px;
    gap:7px;
    background:#ffffff;
}


/* MENU */

.menu{
    width:31px;
    font-size:25px;
    color:#164875;
    cursor:pointer;
    line-height:1;
}


/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
}

.logo-box{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#1685e5;
    color:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
}

.logo-text{
    font-size:22px;
    font-weight:700;
    color:#123f6b;
}


/* HEADER BUTTON */

.header-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
}


/* MONEY */

.money{
    color:#167ddd;
    font-size:21px;
    font-weight:bold;
}


/* NOTIFICATION */

.notification{
    color:#123f6b;
    font-size:20px;
}


/* NOTIFICATION BADGE */

.badge{
    position:absolute;
    top:-3px;
    right:-3px;

    background:#ef4d54;
    color:white;

    width:17px;
    height:17px;

    border-radius:50%;

    font-size:9px;
    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}


/* PROFILE */

.profile-mini{
    width:35px;
    height:35px;

    border-radius:50%;

    background:#1685e5;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;
    font-weight:bold;

    border:3px solid #e5f4ff;

    cursor:pointer;
}


/* =========================
   CONTENT
========================= */

.content{
    height:calc(100vh - 135px);

    overflow-y:auto;
    overflow-x:hidden;

    padding:7px 13px 100px;

    scrollbar-width:none;
}

.content::-webkit-scrollbar{
    display:none;
}


/* =========================
   SEARCH
========================= */

.search{
    height:47px;

    border-radius:25px;

    background:#edf7ff;

    display:flex;
    align-items:center;

    padding:0 16px;

    margin-bottom:15px;
}

.search-icon{
    font-size:22px;
    color:#64849d;

    margin-right:9px;
}

.search input{
    border:0;
    outline:0;

    background:transparent;

    width:100%;

    font-size:17px;
    color:#345;
}

.search input::placeholder{
    color:#758899;
}


/* =========================
   MOOD
========================= */

.mood{
    background:#eaf7ff;

    border:1px solid #cce7f8;

    border-radius:20px;

    padding:14px 11px 12px;

    margin-bottom:16px;
}


/* MOOD HEADER */

.mood-head{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin:0 7px 3px;
}

.mood-title{
    font-size:21px;

    font-weight:bold;

    color:#123f6b;
}

.more{
    color:#0877d1;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}


/* MOOD SUBTITLE */

.mood-sub{
    margin:0 7px 10px;

    color:#728b9e;

    font-size:13px;
}


/* MOOD LIST */

.mood-list{
    display:flex;

    gap:6px;

    overflow-x:auto;

    scrollbar-width:none;
}

.mood-list::-webkit-scrollbar{
    display:none;
}


/* MOOD ITEM */

.mood-item{
    min-width:72px;
    height:100px;

    background:#ffffff;

    border:1px solid #d9ebf7;

    border-radius:16px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}


/* MOOD EMOJI */

.mood-emoji{
    width:45px;
    height:45px;

    border-radius:50%;

    background:#eef8ff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:27px;

    margin-bottom:7px;
}

.mood-name{
    font-size:11px;

    font-weight:bold;

    color:#35627f;
}


/* =========================
   STORIES
========================= */

.section-head{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin:7px 3px 9px;
}

.section-title{
    font-size:20px;

    color:#123f6b;

    font-weight:bold;
}

.view-all{
    color:#0877d1;

    font-weight:bold;

    font-size:13px;

    cursor:pointer;
}


/* STORIES */

.stories{
    display:flex;

    gap:9px;

    overflow-x:auto;

    scrollbar-width:none;

    margin-bottom:17px;
}

.stories::-webkit-scrollbar{
    display:none;
}


/* STORY */

.story{
    min-width:68px;

    text-align:center;

    cursor:pointer;
}

.story-circle{
    width:57px;
    height:57px;

    border-radius:50%;

    background:#e5f5ff;

    border:3px solid #1786df;

    display:flex;

    justify-content:center;
    align-items:center;

    color:#087bd7;

    font-size:20px;

    font-weight:bold;

    margin:auto;
}


/* ADD STORY */

.add-story{
    background:#1685e5;

    color:white;

    font-size:28px;
}

.story-name{
    font-size:10px;

    color:#526f83;

    margin-top:5px;
}


/* =========================
   POSTS
========================= */

.post{
    background:#f1faff;

    border-radius:17px;

    padding:12px;

    margin-bottom:12px;
}

.post-head{
    display:flex;

    align-items:center;

    gap:8px;
}

.post-avatar{
    width:37px;
    height:37px;

    border-radius:50%;

    background:#1685e5;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:bold;

    font-size:18px;
}

.post-name{
    font-weight:bold;

    color:#123f6b;

    font-size:14px;
}

.post-text{
    margin-top:9px;

    color:#456;

    font-size:13px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:absolute;

    left:9px;
    right:9px;

    bottom:6px;

    height:65px;

    border-radius:23px;

    background:rgba(255,255,255,0.97);

    box-shadow:
        0 3px 18px rgba(0,0,0,.10);

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:10;
}


/* NAV ITEM */

.nav-item{
    width:48px;

    text-align:center;

    color:#72899a;

    cursor:pointer;

    font-size:10px;

    font-weight:bold;
}

.nav-icon{
    display:block;

    font-size:20px;

    margin-bottom:2px;
}

.nav-item.active{
    color:#087bd7;
}


/* =========================
   PLUS BUTTON
========================= */

.plus{
    width:52px;
    height:52px;

    border-radius:50%;

    background:#1685e5;

    color:white;

    font-size:29px;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 12px rgba(0,120,220,.3);

    margin-top:-23px;

    border:4px solid white;
}


/* =========================
   CAMERA
========================= */

.camera{
    position:absolute;

    right:15px;
    bottom:80px;

    width:47px;
    height:47px;

    border-radius:50%;

    background:#1685e5;

    border:4px solid white;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    z-index:11;

    cursor:pointer;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:360px){

    .header{
        padding:7px 10px;
        gap:5px;
    }

    .logo-box{
        width:40px;
        height:40px;
        font-size:24px;
    }

    .logo-text{
        font-size:20px;
    }

    .content{
        padding-left:10px;
        padding-right:10px;
    }

    .mood-item{
        min-width:69px;
    }

}


/* =========================
   NO OUTER SCROLL
========================= */

body,
html{
    overscroll-behavior:none;
}

</style>
</head>


<body>

<div class="app">


<!-- ==================================
     HEADER
================================== -->

<div class="header">


    <!-- MENU -->

    <div class="menu"
         onclick="openMenu()">

        ☰

    </div>


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-box">
            U
        </div>

        <div class="logo-text">
            Usanex
        </div>

    </div>


    <!-- MONETIZATION -->

    <div class="header-btn money"
         onclick="openMonetization()">

        ₹

    </div>


    <!-- NOTIFICATION -->

    <div class="header-btn notification"
         onclick="openNotifications()">

        ♧

        <span class="badge">
            3
        </span>

    </div>


    <!-- PROFILE -->

    <div class="profile-mini"
         onclick="openProfile()"
         id="miniAvatar">

        U

    </div>


</div>



<!-- ==================================
     CONTENT
================================== -->

<div class="content">


    <!-- SEARCH -->

    <div class="search">

        <span class="search-icon">
            ⌕
        </span>

        <input
            type="text"
            placeholder="Search..."
            oninput="searchUsers(this.value)"
        >

    </div>



    <!-- ==================================
         YOUR MOOD
    ================================== -->

    <div class="mood">


        <div class="mood-head">

            <div class="mood-title">
                Your Mood
            </div>

            <div class="more"
                 onclick="showMoreMood()">

                More ›

            </div>

        </div>


        <div class="mood-sub">

            How are you feeling today?

        </div>


        <div class="mood-list">


            <!-- GOOD -->

            <div class="mood-item"
                 onclick="selectMood('Good')">

                <div class="mood-emoji">
                    😊
                </div>

                <div class="mood-name">
                    Good
                </div>

            </div>


            <!-- SAD -->

            <div class="mood-item"
                 onclick="selectMood('Sad')">

                <div class="mood-emoji">
                    😔
                </div>

                <div class="mood-name">
                    Sad
                </div>

            </div>


            <!-- EMOTIONAL -->

            <div class="mood-item"
                 onclick="selectMood('Emotional')">

                <div class="mood-emoji">
                    🥹
                </div>

                <div class="mood-name">
                    Emotional
                </div>

            </div>


            <!-- MOTIVATION -->

            <div class="mood-item"
                 onclick="selectMood('Motivation')">

                <div class="mood-emoji">
                    💪
                </div>

                <div class="mood-name">
                    Motivation
                </div>

            </div>


            <!-- OTHER -->

            <div class="mood-item"
                 onclick="selectMood('Other')">

                <div class="mood-emoji">
                    •••
                </div>

                <div class="mood-name">
                    Other
                </div>

            </div>


        </div>

    </div>



    <!-- ==================================
         STORIES
    ================================== -->

    <div class="section-head">

        <div class="section-title">
            Stories
        </div>

        <div class="view-all"
             onclick="viewStories()">

            View All ›

        </div>

    </div>


    <div class="stories">


        <!-- ADD STORY -->

        <div class="story"
             onclick="addStory()">

            <div class="story-circle add-story">
                +
            </div>

            <div class="story-name">
                Add Story
            </div>

        </div>


        <!-- STORY 1 -->

        <div class="story">

            <div class="story-circle">
                U
            </div>

            <div class="story-name">
                User
            </div>

        </div>


        <!-- STORY 2 -->

        <div class="story">

            <div class="story-circle">
                A
            </div>

            <div class="story-name">
                Alex
            </div>

        </div>


        <!-- STORY 3 -->

        <div class="story">

            <div class="story-circle">
                R
            </div>

            <div class="story-name">
                Rahul
            </div>

        </div>


    </div>



    <!-- ==================================
         RECENT POSTS
    ================================== -->

    <div class="section-head">

        <div class="section-title">
            Recent Posts
        </div>

        <div class="view-all"
             onclick="viewPosts()">

            View All ›

        </div>

    </div>


    <!-- POST -->

    <div class="post">


        <div class="post-head">

            <div class="post-avatar">
                U
            </div>

            <div class="post-name">
                Welcome
            </div>

        </div>


        <div class="post-text">

            Welcome to Usanex 🎉

        </div>


    </div>


</div>



<!-- ==================================
     CAMERA
================================== -->

<div class="camera"
     onclick="openCamera()">

    📷

</div>



<!-- ==================================
     BOTTOM NAVIGATION
================================== -->

<div class="bottom-nav">


    <!-- HOME -->

    <div class="nav-item active"
         onclick="goHome()">

        <span class="nav-icon">
            ⌂
        </span>

        Home

    </div>


    <!-- REELS -->

    <div class="nav-item"
         onclick="openReels()">

        <span class="nav-icon">
            ▶
        </span>

        Reels

    </div>


    <!-- CREATE -->

    <div class="nav-item"
         onclick="createPost()">

        <div class="plus">
            +
        </div>

    </div>


    <!-- CALLS -->

    <div class="nav-item"
         onclick="openCalls()">

        <span class="nav-icon">
            ☎
        </span>

        Calls

    </div>


    <!-- PROFILE -->

    <div class="nav-item"
         onclick="openProfile()">

        <span class="nav-icon">
            ●
        </span>

        Profile

    </div>


</div>


</div>



<!-- ==================================
     JAVASCRIPT
================================== -->

<script>


/* =========================
   USER DATA
========================= */

let user = {

    name: "User",

    user_id: "",

    mobile: ""

};


try{

    const savedUser =
        localStorage.getItem("usanex_user");


    if(savedUser){

        user =
            JSON.parse(savedUser);

    }

}catch(error){

    console.log(error);

}



/* =========================
   PROFILE ICON
========================= */

const firstLetter =
    (user.name || "U")
    .charAt(0)
    .toUpperCase();


document.getElementById(
    "miniAvatar"
).textContent = firstLetter;



/* =========================
   HEADER FUNCTIONS
========================= */

function openMenu(){

    alert("Menu");

}


function openMonetization(){

    alert("Usanex Monetization");

}


function openNotifications(){

    alert("Notifications");

}


function openProfile(){

    alert("Profile");

}



/* =========================
   MOOD
========================= */

function selectMood(mood){

    alert(
        "Mood selected: " + mood
    );

}


function showMoreMood(){

    alert("More moods");

}



/* =========================
   STORIES
========================= */

function addStory(){

    alert("Add Story");

}


function viewStories(){

    alert("Stories");

}



/* =========================
   POSTS
========================= */

function viewPosts(){

    alert("Posts");

}



/* =========================
   SEARCH
========================= */

function searchUsers(value){

    if(
        value.trim() === ""
    ){

        return;

    }

    console.log(
        "Searching:",
        value
    );

}



/* =========================
   CAMERA
========================= */

function openCamera(){

    alert("Camera");

}



/* =========================
   BOTTOM NAV
========================= */

function goHome(){

    document
        .querySelector(".content")
        .scrollTop = 0;

}


function openReels(){

    alert("Reels");

}


function createPost(){

    alert("Create Post");

}


function openCalls(){

    alert("Calls");

}


</script>

</body>
</html>
