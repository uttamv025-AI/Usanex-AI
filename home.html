<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050b18;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    width:100%;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,11,24,.97);
    border-bottom:1px solid rgba(255,255,255,.07);
}

/* ================= LOGO ================= */

.brand{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-mark{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:13px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            145deg,
            #2185ff 0%,
            #0868e8 48%,
            #0049b5 100%
        );
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
        0 5px 18px rgba(0,100,255,.30),
        inset 0 1px 2px rgba(255,255,255,.20);
}

.logo-u{
    position:relative;
    z-index:3;
    color:#fff;
    font-size:27px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
    transform:translateY(-1px);
    text-shadow:0 2px 5px rgba(0,0,0,.25);
}

.logo-shine{
    position:absolute;
    z-index:2;
    width:65px;
    height:15px;
    top:-8px;
    left:-24px;
    background:rgba(255,255,255,.23);
    transform:rotate(-38deg);
    filter:blur(1px);
}

.logo-mark::after{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    right:-8px;
    bottom:-9px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
}

.logo-name{
    font-size:19px;
    font-weight:700;
    margin-left:9px;
    color:#fff;
    white-space:nowrap;
}

/* ================= SEARCH ================= */

.search-box{
    flex:1;
    height:43px;
    min-width:0;
    border-radius:13px;
    background:#101a2b;
    border:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:center;
    padding:0 13px;
    cursor:pointer;
}

.search-icon{
    color:#8794a9;
    font-size:23px;
    margin-right:8px;
}

.search-text{
    color:#7f8da3;
    font-size:13px;
    white-space:nowrap;
}

/* ================= MENU BUTTON ================= */

.menu-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border:0;
    border-radius:13px;
    background:#111b2d;
    color:#fff;
    font-size:23px;
    cursor:pointer;
}

/* ================= STATUS ================= */

.status-section{
    padding:15px 13px 8px;
}

.section-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:12px;
}

.status-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    min-width:63px;
    text-align:center;
}

.status-circle{
    width:57px;
    height:57px;
    margin:auto;
    border-radius:50%;
    border:2px solid #1777ff;
    background:#101a2d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
}

.status-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.status-name{
    margin-top:6px;
    font-size:11px;
    color:#aeb8c8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.plus-small{
    position:absolute;
    right:-1px;
    bottom:-1px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#1677ff;
    border:2px solid #050b18;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

/* ================= CONNECTIONS ================= */

.connections-section{
    padding:13px;
    padding-bottom:100px;
}

.connections-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.connections-title{
    font-size:18px;
    font-weight:700;
}

.connection-count{
    color:#7f8da3;
    font-size:13px;
}

.connections-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ================= USER CARD ================= */

.user-card{
    width:100%;
    min-height:76px;
    border-radius:17px;
    background:#0d1728;
    border:1px solid rgba(255,255,255,.06);
    display:flex;
    align-items:center;
    padding:11px;
}

.profile-photo{
    width:53px;
    height:53px;
    min-width:53px;
    border-radius:50%;
    background:linear-gradient(145deg,#17345f,#0c1728);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:20px;
    font-weight:bold;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
    margin-left:12px;
}

.user-name{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;
    color:#7f8da3;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.connected-btn{
    border:1px solid rgba(23,119,255,.35);
    background:rgba(23,119,255,.10);
    color:#63a7ff;
    border-radius:20px;
    padding:8px 12px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
}

/* ================= EMPTY ================= */

.empty-box{
    padding:32px 15px;
    text-align:center;
    color:#748198;
    background:#0d1728;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.05);
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

.empty-title{
    color:#c5cedc;
    font-size:15px;
    font-weight:600;
}

.empty-text{
    margin-top:6px;
    font-size:12px;
}

/* ================= ERROR ================= */

.error-box{
    padding:20px;
    text-align:center;
    border-radius:17px;
    background:#21121a;
    border:1px solid rgba(255,70,100,.15);
}

.error-title{
    font-size:14px;
    font-weight:700;
}

.error-text{
    margin-top:6px;
    color:#a88d98;
    font-size:12px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(7,14,28,.98);
    border-top:1px solid rgba(255,255,255,.07);
    padding:5px 8px;
}

.nav-item{
    width:20%;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
}

.nav-icon{
    width:25px;
    height:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9aa7b9;
    font-size:23px;
}

.nav-item.active .nav-icon{
    color:#fff;
}

.plus-nav{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#1677ff;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 5px 20px rgba(22,119,255,.25);
}

.notification-badge{
    position:absolute;
    top:7px;
    right:25%;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:10px;
    background:#1677ff;
    color:#fff;
    font-size:9px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

/* ================= MENU ================= */

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:300;
    display:none;
}

.menu-panel{
    position:absolute;
    top:70px;
    right:12px;
    width:235px;
    border-radius:17px;
    background:#101b2d;
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 18px 45px rgba(0,0,0,.45);
    overflow:hidden;
}

.menu-item{
    min-height:52px;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
    color:#dce3ee;
    font-size:14px;
    cursor:pointer;
}

.menu-item:hover{
    background:#17243a;
}

.menu-item .menu-icon{
    width:27px;
    min-width:27px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.menu-item .menu-label{
    flex:1;
}

.menu-arrow{
    color:#718096;
    font-size:23px;
    line-height:1;
}

.menu-item.logout{
    color:#ff7388;
    border-top:1px solid rgba(255,255,255,.07);
    margin-top:4px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:84px;
    transform:translateX(-50%);
    background:#17243a;
    color:#fff;
    padding:11px 17px;
    border-radius:22px;
    font-size:13px;
    z-index:500;
    display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .header{
        padding:10px 11px;
        gap:8px;
    }

    .logo-mark{
        width:42px;
        height:42px;
        min-width:42px;
    }

    .logo-u{
        font-size:27px;
    }

    .logo-name{
        font-size:18px;
        margin-left:7px;
    }

    .search-box{
        height:42px;
    }

    .search-text{
        font-size:12px;
    }

    .menu-btn{
        width:42px;
        height:42px;
        min-width:42px;
    }

    .menu-panel{
        right:10px;
        width:230px;
    }
}

@media(max-width:390px){

    .logo-name{
        display:none;
    }

    .search-box{
        margin-left:2px;
    }

}
</style>
</head>

<script>

let currentUser = null;
let currentUserId = "";


/* =========================================================
   USER
========================================================= */

function resolveCurrentUser(){

    let user = null;

    const keys = [
        "usanex_user",
        "user",
        "currentUser",
        "logged_in_user"
    ];

    for(const key of keys){

        try{

            const value =
                localStorage.getItem(key);

            if(!value) continue;

            const parsed =
                JSON.parse(value);

            if(
                parsed &&
                typeof parsed === "object"
            ){

                user = parsed;

                if(
                    user.user &&
                    typeof user.user === "object"
                ){

                    user = user.user;

                }

                break;

            }

        }catch(error){

            console.log(error);

        }

    }


    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlUserId =
        params.get("user_id");


    if(
        urlUserId &&
        urlUserId.trim()
    ){

        if(!user){

            user = {};

        }

        user.user_id =
            urlUserId.trim();

    }


    if(!user){

        const directId =
            localStorage.getItem(
                "usanex_user_id"
            );

        if(
            directId &&
            directId.trim()
        ){

            user = {
                user_id:directId.trim()
            };

        }

    }


    currentUser = user;

    currentUserId =
        user && user.user_id
            ? String(user.user_id).trim()
            : "";


    const letter =
        document.getElementById(
            "youLetter"
        );

    if(letter){

        if(
            user &&
            user.name &&
            String(user.name).trim()
        ){

            letter.textContent =
                String(user.name)
                .trim()
                .charAt(0)
                .toUpperCase();

        }else{

            letter.textContent = "U";

        }

    }

}


/* =========================================================
   CONNECTIONS
========================================================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "connectionsList"
        );

    const count =
        document.getElementById(
            "connectionCount"
        );


    if(!currentUserId){

        count.textContent = "0";

        list.innerHTML = `

            <div class="error-box">

                <div class="error-title">
                    Login information not found
                </div>

                <div class="error-text">
                    Please login again to see your connections.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="empty-box">

            <div class="empty-icon">
                ◌
            </div>

            <div class="empty-title">
                Loading connections...
            </div>

            <div class="empty-text">
                Please wait
            </div>

        </div>

    `;


    let data = null;


    try{

        const response =
            await fetch(
                "/api/home/connections?user_id="
                +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        data =
            await response.json();


    }catch(error){

        console.log(
            "Primary connection API error:",
            error
        );

    }


    if(!data){

        try{

            const response =
                await fetch(
                    "/api/connections?user_id="
                    +
                    encodeURIComponent(
                        currentUserId
                    ),
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }


            data =
                await response.json();


        }catch(error){

            console.log(
                "Connection API error:",
                error
            );


            count.textContent = "0";


            list.innerHTML = `

                <div class="error-box">

                    <div class="error-title">
                        Connections could not load
                    </div>

                    <div class="error-text">
                        Please refresh the page and try again.
                    </div>

                </div>

            `;

            return;

        }

    }


    let users = [];


    if(Array.isArray(data)){

        users = data;

    }
    else if(
        data &&
        Array.isArray(data.users)
    ){

        users = data.users;

    }
    else if(
        data &&
        Array.isArray(data.connections)
    ){

        users = data.connections;

    }
    else if(
        data &&
        Array.isArray(data.data)
    ){

        users = data.data;

    }


    const uniqueUsers = [];

    const seenIds = new Set();


    for(const user of users){

        if(
            !user ||
            typeof user !== "object"
        ){

            continue;

        }


        const id =
            user.user_id ||
            user.id ||
            user.username;


        if(!id){

            continue;

        }


        const cleanId =
            String(id).trim();


        if(
            !cleanId ||
            seenIds.has(cleanId)
        ){

            continue;

        }


        seenIds.add(cleanId);

        uniqueUsers.push(user);

    }


    users = uniqueUsers;


    count.textContent =
        String(users.length);


    if(users.length === 0){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ◎
                </div>

                <div class="empty-title">
                    No connected people
                </div>

                <div class="empty-text">
                    Your accepted connections will appear here.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    users.forEach(
        user => {

            const userId =
                user.user_id ||
                user.id ||
                "";


            const name =
                user.name ||
                user.display_name ||
                user.username ||
                userId ||
                "User";


            const photo =
                user.profile_photo ||
                user.profile_picture ||
                user.photo ||
                "";


            const firstLetter =
                String(name)
                .trim()
                .charAt(0)
                .toUpperCase() ||
                "U";


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "user-card";


            const photoBox =
                document.createElement(
                    "div"
                );

            photoBox.className =
                "profile-photo";


            if(photo){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src = photo;

                img.alt = name;

                img.onerror =
                    function(){

                        this.remove();

                        photoBox.textContent =
                            firstLetter;

                    };


                photoBox.appendChild(
                    img
                );

            }else{

                photoBox.textContent =
                    firstLetter;

            }


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "user-info";


            const nameBox =
                document.createElement(
                    "div"
                );

            nameBox.className =
                "user-name";

            nameBox.textContent =
                name;


            const idBox =
                document.createElement(
                    "div"
                );

            idBox.className =
                "user-id";

            idBox.textContent =
                userId;


            info.appendChild(
                nameBox
            );

            info.appendChild(
                idBox
            );


            const button =
                document.createElement(
                    "div"
                );

            button.className =
                "connected-btn";

            button.textContent =
                "Connected";


            card.appendChild(
                photoBox
            );

            card.appendChild(
                info
            );

            card.appendChild(
                button
            );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    if(!currentUserId){

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id="
                +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        let notifications = [];


        if(Array.isArray(data)){

            notifications = data;

        }
        else if(
            data &&
            Array.isArray(data.notifications)
        ){

            notifications =
                data.notifications;

        }
        else if(
            data &&
            Array.isArray(data.data)
        ){

            notifications =
                data.data;

        }


        const unread =
            notifications.filter(
                item =>
                    item &&
                    (
                        item.is_read === false ||
                        item.read === false
                    )
            ).length;


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        if(
            badge &&
            unread > 0
        ){

            badge.style.display =
                "flex";

            badge.textContent =
                unread > 99
                    ? "99+"
                    : String(unread);

        }else if(badge){

            badge.style.display =
                "none";

        }

    }catch(error){

        console.log(
            "Notification error:",
            error
        );

    }

}

/* =========================================================

========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        2200
    );

}

========================================================= */

const menuBtn =

    );

const menuOverlay =
    document.getElementById(
        "menuOverlay"
    );


menuBtn.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menuOverlay.style.display =

    }
);

    "click",
    function(event){

        if(
            event.target ===

            menuOverlay.style.display =
                "none";

        }

    }
);
