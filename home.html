<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050b18;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,11,24,.96);
    border-bottom:1px solid rgba(255,255,255,.07);
}

/* ================= USANEX LOGO ================= */

.brand{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:25px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    right:7px;
    top:6px;
    opacity:.9;
}

.logo-mark:after{
    content:"";
    position:absolute;
    width:21px;
    height:4px;
    border-radius:10px;
    background:rgba(255,255,255,.25);
    left:11px;
    bottom:6px;
}

.logo-name{
    margin-left:9px;
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

/* ================= SEARCH ================= */

.search-box{
    flex:1;
    height:43px;
    border-radius:23px;
    background:#111b2d;
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    padding:0 15px;
    cursor:pointer;
    min-width:80px;
}

.search-icon{
    font-size:18px;
    opacity:.75;
    margin-right:8px;
}

.search-text{
    color:#8f9bad;
    font-size:14px;
}

/* ================= MENU ================= */

.menu-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border:0;
    border-radius:13px;
    background:#111b2d;
    color:white;
    font-size:24px;
    cursor:pointer;
}

/* ================= STATUS ================= */

.status-section{
    padding:15px 13px 8px;
}

.section-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:12px;
}

.status-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    min-width:63px;
    text-align:center;
}

.status-circle{
    width:57px;
    height:57px;
    margin:auto;
    border-radius:50%;
    border:2px solid #1777ff;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#101a2d;
    font-size:20px;
    font-weight:bold;
    overflow:hidden;
}

.status-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.status-name{
    margin-top:6px;
    font-size:11px;
    color:#aeb8c8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* YOU */

.you-circle{
    position:relative;
}

.plus-small{
    position:absolute;
    right:-1px;
    bottom:-1px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#1677ff;
    border:2px solid #050b18;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

/* ================= CONNECTIONS ================= */

.connections-section{
    padding:13px;
    padding-bottom:100px;
}

.connections-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.connections-title{
    font-size:18px;
    font-weight:700;
}

.connection-count{
    color:#7f8da3;
    font-size:13px;
}

.connections-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ================= USER CARD ================= */

.user-card{
    width:100%;
    min-height:76px;
    border-radius:17px;
    background:#0d1728;
    border:1px solid rgba(255,255,255,.06);
    display:flex;
    align-items:center;
    padding:11px;
}

.profile-photo{
    width:53px;
    height:53px;
    min-width:53px;
    border-radius:50%;
    background:linear-gradient(145deg,#17345f,#0c1728);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:20px;
    font-weight:bold;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
    margin-left:12px;
}

.user-name{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;
    color:#7f8da3;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CONNECTED */

.connected-btn{
    border:1px solid rgba(23,119,255,.35);
    background:rgba(23,119,255,.10);
    color:#63a7ff;
    border-radius:20px;
    padding:8px 12px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
}

/* ================= EMPTY ================= */

.empty-box{
    padding:32px 15px;
    text-align:center;
    color:#748198;
    background:#0d1728;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.05);
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

.empty-title{
    color:#c5cedc;
    font-size:15px;
    font-weight:600;
}

.empty-text{
    margin-top:6px;
    font-size:12px;
}

/* ================= ERROR ================= */

.error-box{
    padding:20px;
    text-align:center;
    border-radius:17px;
    background:#21121a;
    border:1px solid rgba(255,70,100,.15);
}

.error-title{
    font-size:14px;
    font-weight:700;
}

.error-text{
    margin-top:6px;
    color:#a88d98;
    font-size:12px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(7,14,28,.98);
    border-top:1px solid rgba(255,255,255,.07);
    padding:5px 8px;
}

.nav-item{
    width:20%;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
}

.nav-icon{
    width:25px;
    height:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9aa7b9;
    font-size:23px;
}

.nav-item.active .nav-icon{
    color:white;
}

.plus-nav{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#1677ff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 5px 20px rgba(22,119,255,.25);
}

.notification-badge{
    position:absolute;
    top:7px;
    right:25%;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:10px;
    background:#1677ff;
    color:white;
    font-size:9px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

/* ================= MENU POPUP ================= */

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:300;
    display:none;
}

.menu-panel{
    position:absolute;
    top:70px;
    right:12px;
    width:210px;
    border-radius:16px;
    background:#101b2d;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    overflow:hidden;
}

.menu-item{
    height:50px;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:12px;
    color:#dce3ee;
    font-size:14px;
    cursor:pointer;
}

.menu-item:hover{
    background:#17243a;
}

.logout{
    color:#ff7388;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:84px;
    transform:translateX(-50%);
    background:#17243a;
    color:white;
    padding:11px 17px;
    border-radius:22px;
    font-size:13px;
    z-index:500;
    display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .header{
        gap:8px;
        padding:10px 11px;
    }

    .logo-mark{
        width:42px;
        height:42px;
    }

    .logo-u{
        font-size:25px;
    }

    .logo-name{
        display:block;
        font-size:18px;
        margin-left:9px;
    }

    .search-box{
        height:42px;
    }

    .status-section{
        padding-top:13px;
    }
}

/* ================= SEARCH LOGO MOBILE SIZE ================= */

@media(max-width:390px){

    .header{
        padding:0 10px;
        gap:7px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        margin-left:6px;
        font-size:16px;
    }

    .search-box{
        height:40px;
        padding:0 11px;
    }

    .search-icon{
        font-size:19px;
        margin-right:5px;
    }

}
</style>
</head>

<script>

/* =========================================================
   USER DATA
========================================================= */

let currentUser = null;
let currentUserId = "";


/* =========================================================
   GET USER FROM STORAGE / URL
========================================================= */

function resolveCurrentUser(){

    let user = null;

    const possibleKeys = [
        "usanex_user",
        "user",
        "currentUser",
        "logged_in_user"
    ];

    for(const key of possibleKeys){

        try{

            const value =
                localStorage.getItem(key);

            if(!value) continue;

            const parsed =
                JSON.parse(value);

            if(
                parsed &&
                typeof parsed === "object"
            ){

                user = parsed;

                if(
                    !user.user_id &&
                    user.user &&
                    typeof user.user === "object"
                ){

                    user = user.user;

                }

                break;
            }

        }catch(error){

            console.log(
                "Storage read error:",
                key,
                error
            );

        }

    }


    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlUserId =
        params.get("user_id");


    if(
        urlUserId &&
        urlUserId.trim()
    ){

        if(!user){

            user = {};

        }

        user.user_id =
            urlUserId.trim();

    }


    if(!user){

        const directId =
            localStorage.getItem(
                "usanex_user_id"
            );

        if(
            directId &&
            directId.trim()
        ){

            user = {
                user_id:directId.trim()
            };

        }

    }


    currentUser = user;

    currentUserId =
        user && user.user_id
            ? String(user.user_id).trim()
            : "";


    console.log(
        "Usanex current user:",
        currentUser
    );

    console.log(
        "Usanex current user id:",
        currentUserId
    );


    const letter =
        document.getElementById(
            "youLetter"
        );

    if(letter){

        if(
            user &&
            user.name &&
            String(user.name).trim()
        ){

            letter.textContent =
                String(user.name)
                .trim()
                .charAt(0)
                .toUpperCase();

        }else{

            letter.textContent = "U";

        }

    }

}


/* =========================================================
   LOAD CONNECTIONS
========================================================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "connectionsList"
        );

    const count =
        document.getElementById(
            "connectionCount"
        );


    if(!currentUserId){

        console.warn(
            "No user_id found for Home page."
        );

        count.textContent = "0";

        list.innerHTML = `

            <div class="error-box">

                <div class="error-title">
                    Login information not found
                </div>

                <div class="error-text">
                    Please login again to see your connections.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="empty-box">

            <div class="empty-icon">
                ◌
            </div>

            <div class="empty-title">
                Loading connections...
            </div>

            <div class="empty-text">
                Please wait
            </div>

        </div>

    `;


    let data = null;
    let firstError = null;


    try{

        const response =
            await fetch(
                "/api/home/connections?user_id="
                +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        console.log(
            "Home connections status:",
            response.status
        );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        data =
            await response.json();


        console.log(
            "Home connections response:",
            data
        );


    }catch(error){

        firstError = error;

        console.warn(
            "Primary connections API failed:",
            error
        );

    }


    if(!data){

        try{

            const response =
                await fetch(
                    "/api/connections?user_id="
                    +
                    encodeURIComponent(
                        currentUserId
                    ),
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );


            console.log(
                "Fallback connections status:",
                response.status
            );


            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }


            data =
                await response.json();


            console.log(
                "Fallback connections response:",
                data
            );


        }catch(error){

            console.error(
                "Both connection APIs failed:",
                firstError,
                error
            );


            count.textContent = "0";


            list.innerHTML = `

                <div class="error-box">

                    <div class="error-title">
                        Connections could not load
                    </div>

                    <div class="error-text">
                        Please refresh the page and try again.
                    </div>

                </div>

            `;

            return;

        }

    }


    let users = [];


    if(Array.isArray(data)){

        users = data;

    }

    else if(
        data &&
        Array.isArray(data.users)
    ){

        users = data.users;

    }

    else if(
        data &&
        Array.isArray(data.connections)
    ){

        users = data.connections;

    }

    else if(
        data &&
        Array.isArray(data.data)
    ){

        users = data.data;

    }


    console.log(
        "Normalized connection users:",
        users
    );


    const uniqueUsers = [];

    const seenIds = new Set();


    for(const user of users){

        if(
            !user ||
            typeof user !== "object"
        ){

            continue;

        }


        const id =
            user.user_id ||
            user.id ||
            user.username;


        if(!id){

            continue;

        }


        const cleanId =
            String(id).trim();


        if(
            !cleanId ||
            seenIds.has(cleanId)
        ){

            continue;

        }


        seenIds.add(cleanId);

        uniqueUsers.push(user);

    }


    users = uniqueUsers;


    count.textContent =
        String(users.length);


    if(users.length === 0){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ◎
                </div>

                <div class="empty-title">
                    No connected people
                </div>

                <div class="empty-text">
                    Your accepted connections will appear here.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    users.forEach(
        user => {

            const userId =
                user.user_id ||
                user.id ||
                "";


            const name =
                user.name ||
                user.display_name ||
                user.username ||
                userId ||
                "User";


            const photo =
                user.profile_photo ||
                user.profile_picture ||
                user.photo ||
                "";


            const firstLetter =
                String(name)
                .trim()
                .charAt(0)
                .toUpperCase() ||
                "U";


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "user-card";


            const photoBox =
                document.createElement(
                    "div"
                );

            photoBox.className =
                "profile-photo";


            if(photo){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src = photo;

                img.alt = name;

                img.onerror =
                    function(){

                        this.remove();

                        photoBox.textContent =
                            firstLetter;

                    };


                photoBox.appendChild(
                    img
                );

            }else{

                photoBox.textContent =
                    firstLetter;

            }


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "user-info";


            const nameBox =
                document.createElement(
                    "div"
                );

            nameBox.className =
                "user-name";

            nameBox.textContent =
                name;


            const idBox =
                document.createElement(
                    "div"
                );

            idBox.className =
                "user-id";

            idBox.textContent =
                userId;


            info.appendChild(
                nameBox
            );

            info.appendChild(
                idBox
            );


            const button =
                document.createElement(
                    "div"
                );

            button.className =
                "connected-btn";

            button.textContent =
                "Connected";


            card.appendChild(
                photoBox
            );

            card.appendChild(
                info
            );

            card.appendChild(
                button
            );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    if(!currentUserId){

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id="
                +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        let notifications = [];


        if(Array.isArray(data)){

            notifications = data;

        }

        else if(
            data &&
            Array.isArray(data.notifications)
        ){

            notifications =
                data.notifications;

        }

        else if(
            data &&
            Array.isArray(data.data)
        ){

            notifications =
                data.data;

        }


        const unread =
            notifications.filter(
                item =>
                    item &&
                    (
                        item.is_read === false ||
                        item.read === false
                    )
            ).length;


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        if(
            badge &&
            unread > 0
        ){

            badge.style.display =
                "flex";

            badge.textContent =
                unread > 99
                    ? "99+"
                    : String(unread);

        }else if(badge){

            badge.style.display =
                "none";

        }

    }catch(error){

        console.log(
            "Notification count error:",
            error
        );

    }

}

/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        2200
    );

}
