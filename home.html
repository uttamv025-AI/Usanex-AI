<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Usanex</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    min-height:100vh;
    padding-bottom:82px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:72px;

    padding:0 15px;

    display:flex;
    align-items:center;

    gap:10px;

    background:
        rgba(7,9,13,.88);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    position:sticky;

    top:0;

    z-index:30;

    backdrop-filter:blur(18px);
}


/* =========================================================
   LOGO
========================================================= */

.logo-mark{
    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:24px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:10px;
    bottom:6px;
}

.logo-name{
    font-size:18px;

    font-weight:800;

    letter-spacing:-.5px;

    white-space:nowrap;
}


/* =========================================================
   SEARCH BOX
========================================================= */

.search-box{
    flex:1;

    min-width:0;

    height:42px;

    display:flex;

    align-items:center;

    padding:0 13px;

    border-radius:23px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor:pointer;

    transition:
        border-color .2s,
        transform .15s;
}

.search-box:active{
    transform:scale(.985);

    border-color:
        rgba(50,150,255,.35);
}

.search-icon{
    font-size:20px;

    color:#8993a5;

    margin-right:7px;

    flex-shrink:0;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;

    cursor:pointer;
}

.search-box input::placeholder{
    color:#747d8d;
}


/* =========================================================
   HEADER BUTTON
========================================================= */

.header-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:13px;

    background:#151820;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.07);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;
}

.header-btn:active{
    transform:scale(.95);
}

.bell-icon{
    font-size:20px;
}


/* =========================================================
   NOTIFICATION BADGE
========================================================= */

.notification-badge{
    position:absolute;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:20px;

    background:#247fff;

    color:#fff;

    font-size:10px;

    font-weight:800;

    display:flex;

    align-items:center;
    justify-content:center;

    top:-3px;
    right:-3px;

    border:
        2px solid
        #07090d;
}

.notification-badge.hidden{
    display:none;
}


/* =========================================================
   MENU ICON
========================================================= */

.menu-icon{
    display:flex;

    flex-direction:column;

    gap:4px;
}

.menu-icon span{
    width:17px;
    height:2px;

    border-radius:5px;

    background:#fff;
}


/* =========================================================
   STATUS
========================================================= */

.status-wrapper{
    padding:16px 15px 12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);
}

.status-scroll{
    display:flex;

    gap:15px;

    overflow-x:auto;

    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    width:58px;

    flex-shrink:0;

    text-align:center;
}

.status-circle{
    width:53px;
    height:53px;

    margin:auto;

    border-radius:50%;

    padding:2px;

    background:
        linear-gradient(
            145deg,
            #3196ff,
            #0758cb
        );

    display:flex;

    align-items:center;
    justify-content:center;
}

.status-inner{
    width:100%;
    height:100%;

    border-radius:50%;

    background:#151820;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:17px;

    font-weight:800;

    overflow:hidden;
}

.status-inner img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;
}

.status-name{
    margin-top:6px;

    font-size:10px;

    color:#8b94a5;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   YOU PLUS
========================================================= */

.add-status{
    position:relative;
}

.add-status .plus{
    position:absolute;

    right:0;

    bottom:17px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#2788ff;

    border:
        2px solid
        #07090d;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:14px;

    font-weight:900;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content{
    padding:22px 15px 30px;
}


/* =========================================================
   CONNECTED SECTION
========================================================= */

.people-section{
    width:100%;
}

.people-title{
    font-size:21px;

    font-weight:800;

    margin-bottom:5px;
}

.people-subtitle{
    font-size:11px;

    color:#7f8898;

    margin-bottom:18px;
}


/* =========================================================
   PEOPLE LIST
========================================================= */

.people-list{
    display:flex;

    flex-direction:column;

    gap:10px;
}


/* =========================================================
   PERSON CARD
========================================================= */

.user-card{
    width:100%;

    min-height:76px;

    display:flex;

    align-items:center;

    padding:12px 13px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);

    cursor:default;

    transition:
        opacity .25s,
        border-color .2s;
}


/* =========================================================
   PROFILE PHOTO
========================================================= */

.user-dp{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    font-size:20px;

    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:
        2px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);

    user-select:none;
}

.user-dp img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


/* =========================================================
   USER INFO
========================================================= */

.user-info{
    flex:1;

    min-width:0;

    margin-left:12px;

    overflow:hidden;
}

.user-name{
    font-size:15px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;

    font-size:11px;

    color:#818a9a;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   CONNECTED BUTTON
========================================================= */

.follow-btn{
    min-width:84px;

    height:36px;

    padding:0 13px;

    border:0;

    border-radius:12px;

    font-size:12px;

    font-weight:700;

    flex-shrink:0;
}

.follow-btn.connected{
    background:#252b36;

    color:#75e0a2;

    cursor:default;
}

.follow-btn:disabled{
    opacity:1;
}


/* =========================================================
   EMPTY CONNECTED STATE
========================================================= */

.no-connected{
    min-height:300px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px 20px;
}

.no-connected-icon{
    width:70px;
    height:70px;

    border-radius:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:16px;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 10px 30px
        rgba(20,105,232,.25);

    font-size:30px;
}

.no-connected-title{
    font-size:17px;

    font-weight:800;

    margin-bottom:7px;
}

.no-connected-text{
    max-width:270px;

    color:#7f8898;

    font-size:12px;

    line-height:1.5;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;

    bottom:0;

    height:70px;

    background:
        rgba(10,13,18,.97);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:100;

    padding:0 4px;
}

.nav-item{
    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#697384;

    font-size:10px;

    cursor:pointer;

    transition:
        color .15s,
        transform .15s;
}

.nav-icon{
    font-size:21px;

    line-height:1;

    height:23px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.nav-item.active{
    color:#3296ff;
}

.nav-item:active{
    transform:scale(.94);
}


/* =========================================================
   MENU OVERLAY
========================================================= */

.menu-overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.58);

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:500;
}

.menu-overlay.show{
    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   MENU PANEL
========================================================= */

.menu-panel{
    position:absolute;

    top:70px;

    right:14px;

    width:205px;

    padding:8px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #1a1f29,
            #0e1219
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.5);

    transform:
        translateY(-8px)
        scale(.97);

    transition:.2s;
}

.menu-overlay.show .menu-panel{
    transform:
        translateY(0)
        scale(1);
}

.menu-user{
    padding:12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    margin-bottom:5px;
}

.menu-user-name{
    font-size:14px;

    font-weight:700;
}

.menu-user-id{
    margin-top:4px;

    font-size:10px;

    color:#7f8898;
}

.menu-option{
    height:43px;

    padding:0 12px;

    border-radius:12px;

    display:flex;

    align-items:center;

    gap:11px;

    color:#d8deea;

    font-size:12px;

    cursor:pointer;
}

.menu-option:active{
    background:#202631;
}

.menu-option.logout{
    color:#ff9292;
}


/* =========================================================
   TOAST
========================================================= */

.status-popup{
    position:fixed;

    left:50%;

    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:700;
}

.status-popup.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

    .header{
        padding:0 9px;

        gap:7px;
    }

    .logo-mark{
        width:38px;
        height:38px;

        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        font-size:15px;
    }

    .search-box{
        height:39px;

        padding:0 10px;
    }

    .search-icon{
        font-size:18px;

        margin-right:5px;
    }

    .header-btn{
        width:36px;
        height:36px;

        border-radius:11px;
    }

    .content{
        padding-left:13px;
        padding-right:13px;
    }

    .user-card{
        padding:10px;
    }

    .user-dp{
        width:47px;
        height:47px;
    }

    .follow-btn{
        min-width:76px;

        padding:0 9px;
    }

    .nav-item{
        font-size:9px;
    }

    .nav-icon{
        font-size:20px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">


    <!-- LOGO -->

    <div class="logo-mark">

        <div class="logo-u">
            U
        </div>

        <div class="logo-shine"></div>

    </div>


    <div class="logo-name">
        Usanex
    </div>


    <!-- SEARCH -->

    <div
        class="search-box"
        id="searchBox">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search people..."
            autocomplete="off"
            readonly
        >

    </div>


    <!-- NOTIFICATION -->

    <button
        class="header-btn"
        id="notificationBtn"
        aria-label="Notifications">

        <span class="bell-icon">
            🔔
        </span>

        <span
            class="notification-badge hidden"
            id="notificationBadge">
            0
        </span>

    </button>


    <!-- MENU -->

    <button
        class="header-btn"
        id="menuBtn"
        aria-label="Menu">

        <div class="menu-icon">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </button>

</header>



<!-- =======================================================
     STATUS
======================================================= -->

<section class="status-wrapper">


    <div
        class="status-scroll"
        id="statusScroll">


        <!-- YOUR STATUS -->

        <div
            class="status-item add-status"
            id="yourStatus">


            <div class="status-circle">

                <div
                    class="status-inner"
                    id="yourStatusAvatar">

                    U

                </div>

            </div>


            <div class="plus">
                +
            </div>


            <div class="status-name">
                You
            </div>


        </div>


    </div>

</section>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="content">


    <section
        class="people-section"
        id="peopleSection">


        <div class="people-title">
            Connected People
        </div>


        <div class="people-subtitle">
            People connected with you
        </div>


        <div
            class="people-list"
            id="peopleList">
        </div>


    </section>


    <!-- EMPTY STATE -->

    <section
        class="no-connected"
        id="noConnected"
        style="display:none;">


        <div class="no-connected-icon">
            👥
        </div>


        <div class="no-connected-title">
            No connected people
        </div>


        <div class="no-connected-text">

            Search people above and connect with them
            to see them here.

        </div>


    </section>


</main>



<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<nav class="bottom-nav">


    <!-- HOME -->

    <div
        class="nav-item active"
        id="homeNav">

        <div class="nav-icon">
            🏠
        </div>

        <div>
            Home
        </div>

    </div>


    <!-- REEL -->

    <div
        class="nav-item"
        id="reelNav">

        <div class="nav-icon">
            ▶
        </div>

        <div>
            Reel
        </div>

    </div>


    <!-- CAMERA -->

    <div
        class="nav-item"
        id="cameraNav">

        <div class="nav-icon">
            📷
        </div>

        <div>
            Camera
        </div>

    </div>


    <!-- USERS -->

    <div
        class="nav-item"
        id="usersNav">

        <div class="nav-icon">
            👥
        </div>

        <div>
            Users
        </div>

    </div>


    <!-- PROFILE -->

    <div
        class="nav-item"
        id="profileNav">

        <div class="nav-icon">
            👤
        </div>

        <div>
            Profile
        </div>

    </div>


</nav>


</div>



<!-- =======================================================
     MENU
======================================================= -->

<div
    class="menu-overlay"
    id="menuOverlay">


    <div
        class="menu-panel"
        id="menuPanel">


        <div class="menu-user">


            <div
                class="menu-user-name"
                id="menuUserName">

                User

            </div>


            <div
                class="menu-user-id"
                id="menuUserId">

                @user

            </div>


        </div>


        <div
            class="menu-option"
            id="menuProfile">

            👤

            <span>
                Profile
            </span>

        </div>


        <div
            class="menu-option logout"
            id="menuLogout">

            🚪

            <span>
                Logout
            </span>

        </div>


    </div>

</div>



<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="status-popup"
    id="statusPopup">
</div>



<script>


/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;


function getCurrentUser(){

    try{

        const saved =
            localStorage.getItem(
                "usanex_user"
            );

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.log(
            "usanex_user error:",
            error
        );

    }


    try{

        const saved =
            localStorage.getItem(
                "user"
            );

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.log(
            "user error:",
            error
        );

    }


    return null;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const popup =
        document.getElementById(
            "statusPopup"
        );


    popup.textContent =
        message;


    popup.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                popup.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   USER UI
========================================================= */

function updateUserUI(){

    if(!currentUser){

        return;

    }


    const name =
        currentUser.name ||
        currentUser.display_name ||
        currentUser.username ||
        "User";


    const userId =
        currentUser.user_id ||
        currentUser.username ||
        "";


    document.getElementById(
        "menuUserName"
    ).textContent =
        name;


    document.getElementById(
        "menuUserId"
    ).textContent =
        userId
            ? "@" + userId
            : "";


    const avatar =
        document.getElementById(
            "yourStatusAvatar"
        );


    const photo =
        currentUser.profile_photo ||
        currentUser.profile_picture ||
        currentUser.avatar ||
        currentUser.photo ||
        "";


    if(photo){

        avatar.innerHTML =
            `<img src="${escapeHTML(photo)}" alt="">`;

    }else{

        avatar.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}


/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        hideNotificationBadge();

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ) +
                "&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Notification request failed"
            );

        }


        const data =
            await response.json();


        const notifications =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.notifications
                    )
                        ? data.notifications
                        : []
                );


        const unreadCount =
            notifications.filter(
                function(n){

                    return n &&
                    (
                        n.is_read === false ||
                        n.is_read === 0
                    );

                }
            ).length;


        if(unreadCount > 0){

            showNotificationBadge(
                unreadCount
            );

        }else{

            hideNotificationBadge();

        }

    }catch(error){

        console.log(
            "Notification count error:",
            error
        );

        hideNotificationBadge();

    }

}


function showNotificationBadge(count){

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    badge.textContent =
        count > 99
            ? "99+"
            : String(count);


    badge.classList.remove(
        "hidden"
    );

}


function hideNotificationBadge(){

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    badge.textContent =
        "0";


    badge.classList.add(
        "hidden"
    );

}

/* =========================================================
   CONNECTION DATA
========================================================= */

function normalizePerson(item){

    if(!item){

        return null;

    }


    const person =
        item.user ||
        item.person ||
        item.profile ||
        item.connected_user ||
        item;


    if(!person){

        return null;

    }


    const userId =
        person.user_id ||
        person.username ||
        person.id ||
        "";


    const name =
        person.name ||
        person.display_name ||
        person.full_name ||
        person.username ||
        "User";


    const photo =
        person.profile_photo ||
        person.profile_picture ||
        person.avatar ||
        person.photo ||
        person.profile_image ||
        "";


    return {

        user_id:String(
            userId
        ),

        name:String(
            name
        ),

        photo:String(
            photo
        )

    };

}


/* =========================================================
   LOAD CONNECTED PEOPLE
========================================================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "peopleList"
        );


    const empty =
        document.getElementById(
            "noConnected"
        );


    if(
        !currentUser ||
        !currentUser.user_id
    ){

        list.innerHTML =
            "";

        empty.style.display =
            "flex";

        return;

    }


    try{

        const response =
            await fetch(
                "/api/connections?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ) +
                "&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Connection request failed"
            );

        }


        const data =
            await response.json();


        let people = [];


        if(
            Array.isArray(data)
        ){

            people =
                data;

        }
        else if(
            Array.isArray(
                data.connections
            )
        ){

            people =
                data.connections;

        }
        else if(
            Array.isArray(
                data.users
            )
        ){

            people =
                data.users;

        }
        else if(
            Array.isArray(
                data.data
            )
        ){

            people =
                data.data;

        }


        const normalized =
            people
                .map(
                    normalizePerson
                )
                .filter(
                    function(person){

                        return (
                            person &&
                            person.user_id &&
                            person.user_id !==
                            String(
                                currentUser.user_id
                            )
                        );

                    }
                );


        renderPeople(
            normalized
        );


    }catch(error){

        console.log(
            "Connections error:",
            error
        );


        list.innerHTML =
            "";


        empty.style.display =
            "flex";

    }

}


/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPeople(people){

    const list =
        document.getElementById(
            "peopleList"
        );


    const empty =
        document.getElementById(
            "noConnected"
        );


    list.innerHTML =
        "";


    if(
        !Array.isArray(people) ||
        people.length === 0
    ){

        empty.style.display =
            "flex";

        return;

    }


    empty.style.display =
        "none";


    people.forEach(
        function(person){

            const card =
                createPersonCard(
                    person
                );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   CREATE CONNECTED PERSON CARD
   NO FOLLOW
   NO CLICK
========================================================= */

function createPersonCard(person){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "user-card";


    card.dataset.userId =
        person.user_id;


    /* =====================================================
       PROFILE PHOTO
    ===================================================== */

    const dp =
        document.createElement(
            "div"
        );


    dp.className =
        "user-dp";


    if(person.photo){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            person.photo;


        img.alt =
            "";


        img.onerror =
            function(){

                this.remove();


                dp.textContent =
                    person.name
                        .charAt(0)
                        .toUpperCase();

            };


        dp.appendChild(
            img
        );

    }else{

        dp.textContent =
            person.name
                .charAt(0)
                .toUpperCase();

    }


    /* =====================================================
       USER INFO
    ===================================================== */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "user-info";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "user-name";


    name.textContent =
        person.name;


    const userId =
        document.createElement(
            "div"
        );


    userId.className =
        "user-id";


    userId.textContent =
        "@" +
        person.user_id;


    info.appendChild(
        name
    );


    info.appendChild(
        userId
    );


    /* =====================================================
       CONNECTED BUTTON
    ===================================================== */

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "follow-btn connected";


    button.textContent =
        "Connected";


    button.type =
        "button";


    button.disabled =
        true;


    /*
       IMPORTANT:

       No card click event.

       No button click event.

       Connected can NEVER become Follow.
    */


    card.appendChild(
        dp
    );


    card.appendChild(
        info
    );


    card.appendChild(
        button
    );


    return card;

}


/* =========================================================
   WEBSOCKET
========================================================= */

let socket = null;


function connectSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }


    try{

        const protocol =
            location.protocol ===
            "https:"
                ? "wss:"
                : "ws:";


        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host +
                "/ws/" +
                encodeURIComponent(
                    currentUser.user_id
                )
            );


        socket.onopen =
            function(){

                console.log(
                    "Usanex socket connected"
                );

            };


        socket.onmessage =
            function(event){

                try{

                    const message =
                        JSON.parse(
                            event.data
                        );


                    if(
                        message &&
                        (
                            message.type ===
                            "notification" ||

                            message.type ===
                            "new_notification"
                        )
                    ){

                        loadNotificationCount();

                    }


                    if(
                        message &&
                        (
                            message.type ===
                            "connection" ||

                            message.type ===
                            "connection_accepted" ||

                            message.type ===
                            "connection_verified"
                        )
                    ){

                        loadConnections();

                    }

                }catch(error){

                    console.log(
                        "Socket message error:",
                        error
                    );


                    loadNotificationCount();

                    loadConnections();

                }

            };


        socket.onclose =
            function(){

                console.log(
                    "Usanex socket disconnected"
                );

            };


        socket.onerror =
            function(error){

                console.log(
                    "Socket error:",
                    error
                );

            };

    }catch(error){

        console.log(
            "Socket connection error:",
            error
        );

    }

}
