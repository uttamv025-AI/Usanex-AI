<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usanex</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

.app{
    min-height:100vh;
    padding-bottom:85px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:72px;
    padding:0 15px;

    display:flex;
    align-items:center;
    gap:10px;

    background:rgba(7,9,13,.88);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    position:sticky;
    top:0;
    z-index:30;

    backdrop-filter:blur(18px);
}


/* LOGO */

.logo-mark{
    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:24px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:10px;
    bottom:6px;
}

.logo-name{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
    white-space:nowrap;
}


/* =========================================================
   LARGE SEARCH BOX
========================================================= */

.search-box{
    flex:1;
    min-width:0;

    height:45px;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-radius:24px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor:pointer;

    transition:.15s;
}

.search-box:active{
    transform:scale(.985);
}

.search-icon{
    font-size:20px;
    color:#8993a5;
    margin-right:8px;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:14px;

    pointer-events:none;
}

.search-box input::placeholder{
    color:#747d8d;
}


/* =========================================================
   HEADER MENU
========================================================= */

.header-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;
    border-radius:13px;

    background:#151820;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.07);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.header-btn:active{
    transform:scale(.94);
}

.menu-icon{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-icon span{
    width:17px;
    height:2px;

    border-radius:5px;

    background:#fff;
}


/* =========================================================
   STATUS
========================================================= */

.status-wrapper{
    padding:16px 15px 8px;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);
}

.status-scroll{
    display:flex;
    gap:15px;

    overflow-x:auto;

    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    width:58px;
    flex-shrink:0;
    text-align:center;

    cursor:pointer;
}

.status-circle{
    width:53px;
    height:53px;

    margin:auto;

    border-radius:50%;

    padding:2px;

    background:
        linear-gradient(
            145deg,
            #3196ff,
            #0758cb
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.status-inner{
    width:100%;
    height:100%;

    border-radius:50%;

    background:#151820;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:800;

    overflow:hidden;
}

.status-inner img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;
}

.status-name{
    margin-top:6px;

    font-size:10px;

    color:#8b94a5;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* PLUS */

.add-status{
    position:relative;
}

.add-status .plus{
    position:absolute;

    right:0;
    bottom:17px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#2788ff;

    border:
        2px solid
        #07090d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:900;
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:22px 15px 30px;
}

.people-section{
    width:100%;
}

.people-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:5px;
}

.people-subtitle{
    font-size:11px;
    color:#7f8898;
    margin-bottom:18px;
}

.people-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}


/* =========================================================
   CONNECTED CARD
========================================================= */

.user-card{
    width:100%;
    min-height:76px;

    display:flex;
    align-items:center;

    padding:12px 13px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);

    cursor:default;

    user-select:none;
}

.user-dp{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    font-size:20px;
    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:
        2px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);

    user-select:none;
}

.user-dp img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}

.user-info{
    flex:1;
    min-width:0;

    margin-left:12px;
}

.user-name{
    font-size:15px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;

    font-size:11px;

    color:#818a9a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* CONNECTED */

.connected-btn{
    min-width:84px;
    height:36px;

    padding:0 13px;

    border:0;
    border-radius:12px;

    background:#252b36;

    color:#75e0a2;

    font-size:12px;
    font-weight:700;

    cursor:default;

    flex-shrink:0;

    pointer-events:none;
}


/* =========================================================
   EMPTY
========================================================= */

.no-connected{
    min-height:300px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 20px;
}

.no-connected-icon{
    width:70px;
    height:70px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:16px;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 10px 30px
        rgba(20,105,232,.25);

    font-size:30px;
}

.no-connected-title{
    font-size:17px;
    font-weight:800;

    margin-bottom:7px;
}

.no-connected-text{
    max-width:270px;

    color:#7f8898;

    font-size:12px;
    line-height:1.5;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    background:
        rgba(10,13,18,.97);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

    display:flex;

    align-items:center;
    justify-content:space-around;

    z-index:100;

    padding:0 4px;
}

.nav-item{
    flex:1;

    max-width:80px;

    height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ffffff;

    cursor:pointer;

    user-select:none;

    position:relative;

    transition:.15s;
}

.nav-item:active{
    transform:scale(.92);
}


/* SIMPLE OUTLINE ICON */

.nav-svg{
    width:24px;
    height:24px;

    fill:none;

    stroke:#ffffff;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* PLUS */

.plus-svg{
    width:27px;
    height:27px;

    stroke:#ffffff;

    stroke-width:1.8;
}


/* =========================================================
   NOTIFICATION BADGE
========================================================= */

.notification-badge{
    position:absolute;

    top:7px;
    right:14px;

    min-width:16px;
    height:16px;

    padding:0 4px;

    border-radius:20px;

    background:#247fff;

    color:#fff;

    font-size:9px;
    font-weight:800;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        2px solid
        #0a0d12;
}

.notification-badge.hidden{
    display:none;
}


/* =========================================================
   MENU
========================================================= */

.menu-overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.58);

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:500;
}

.menu-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.menu-panel{
    position:absolute;

    top:70px;
    right:14px;

    width:205px;

    padding:8px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #1a1f29,
            #0e1219
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.5);

    transform:
        translateY(-8px)
        scale(.97);

    transition:.2s;
}

.menu-overlay.show .menu-panel{
    transform:
        translateY(0)
        scale(1);
}

.menu-user{
    padding:12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    margin-bottom:5px;
}

.menu-user-name{
    font-size:14px;
    font-weight:700;
}

.menu-user-id{
    margin-top:4px;

    font-size:10px;

    color:#7f8898;
}

.menu-option{
    height:43px;

    padding:0 12px;

    border-radius:12px;

    display:flex;
    align-items:center;

    gap:11px;

    color:#d8deea;

    font-size:12px;

    cursor:pointer;
}

.menu-option:active{
    background:#202631;
}

.menu-option.logout{
    color:#ff9292;
}


/* =========================================================
   TOAST
========================================================= */

.status-popup{
    position:fixed;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:700;
}

.status-popup.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

    .header{
        padding:0 9px;
        gap:7px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        font-size:15px;
    }

    .search-box{
        height:40px;
        padding:0 10px;
    }

    .search-icon{
        font-size:18px;
        margin-right:5px;
    }

    .user-card{
        padding:10px;
    }

    .user-dp{
        width:47px;
        height:47px;
    }

    .connected-btn{
        min-width:76px;
        padding:0 9px;
    }

    .notification-badge{
        right:10px;
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="logo-mark">

        <div class="logo-u">
            U
        </div>

        <div class="logo-shine"></div>

    </div>


    <div class="logo-name">
        Usanex
    </div>


    <!-- SEARCH -->

    <div
        class="search-box"
        id="searchBox">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search people..."
            autocomplete="off"
            readonly
        >

    </div>


    <!-- MENU -->

    <button
        class="header-btn"
        id="menuBtn"
        aria-label="Menu">

        <div class="menu-icon">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </button>

</header>



<!-- =======================================================
     STATUS
======================================================= -->

<section class="status-wrapper">

    <div
        class="status-scroll"
        id="statusScroll">

        <div
            class="status-item add-status"
            id="yourStatus">

            <div class="status-circle">

                <div
                    class="status-inner"
                    id="yourStatusAvatar">

                    U

                </div>

            </div>


            <div class="plus">
                +
            </div>


            <div class="status-name">
                You
            </div>

        </div>

    </div>

</section>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="content">

    <section
        class="people-section"
        id="peopleSection">

        <div class="people-title">
            Connected People
        </div>

        <div class="people-subtitle">
            People connected with you
        </div>

        <div
            class="people-list"
            id="peopleList">
        </div>

    </section>


    <section
        class="no-connected"
        id="noConnected"
        style="display:none;">

        <div class="no-connected-icon">
            👥
        </div>

        <div class="no-connected-title">
            No connected people
        </div>

        <div class="no-connected-text">
            Search people above and connect with them
            to see them here.
        </div>

    </section>

</main>



<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<nav class="bottom-nav">


    <!-- HOME -->

    <div
        class="nav-item active"
        id="homeNav"
        aria-label="Home"
        title="Home">

        <svg
            class="nav-svg"
            viewBox="0 0 24 24">

            <path
                d="M3 10.5L12 3l9 7.5"/>

            <path
                d="M5.5 9.5V21h13V9.5"/>

            <path
                d="M9.5 21v-7h5v7"/>

        </svg>

    </div>



    <!-- REEL -->

    <div
        class="nav-item"
        id="reelNav"
        aria-label="Reel"
        title="Reel">

        <svg
            class="nav-svg"
            viewBox="0 0 24 24">

            <rect
                x="3"
                y="4"
                width="18"
                height="16"
                rx="3"/>

            <path
                d="M8 4l3 5"/>

            <path
                d="M13 4l3 5"/>

            <path
                d="M10 10l5 3-5 3z"/>

        </svg>

    </div>



    <!-- PLUS -->

    <div
        class="nav-item"
        id="plusNav"
        aria-label="Create"
        title="Create">

        <svg
            class="nav-svg plus-svg"
            viewBox="0 0 24 24">

            <path
                d="M12 5v14"/>

            <path
                d="M5 12h14"/>

        </svg>

    </div>



    <!-- NOTIFICATION -->

    <div
        class="nav-item"
        id="notificationNav"
        aria-label="Notifications"
        title="Notifications">

        <svg
            class="nav-svg"
            viewBox="0 0 24 24">

            <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>

            <path
                d="M10 21h4"/>

        </svg>


        <span
            class="notification-badge hidden"
            id="notificationBadge">

            0

        </span>

    </div>



    <!-- PROFILE -->

    <div
        class="nav-item"
        id="profileNav"
        aria-label="Profile"
        title="Profile">

        <svg
            class="nav-svg"
            viewBox="0 0 24 24">

            <circle
                cx="12"
                cy="8"
                r="4"/>

            <path
                d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>

        </svg>

    </div>

</nav>


</div>



<!-- =======================================================
     MENU
======================================================= -->

<div
    class="menu-overlay"
    id="menuOverlay">

    <div
        class="menu-panel"
        id="menuPanel">

        <div class="menu-user">

            <div
                class="menu-user-name"
                id="menuUserName">

                Usanex User

            </div>

            <div
                class="menu-user-id"
                id="menuUserId">

                User ID

            </div>

        </div>


        <div
            class="menu-option"
            id="menuProfile">

            <span>👤</span>

            <span>
                Profile
            </span>

        </div>


        <div
            class="menu-option logout"
            id="logoutBtn">

            <span>↪</span>

            <span>
                Logout
            </span>

        </div>

    </div>

</div>



<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="status-popup"
    id="statusPopup">
</div>



<script>

/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const popup =
        document.getElementById(
            "statusPopup"
        );

    popup.textContent =
        message;

    popup.classList.add(
        "show"
    );

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            function(){

                popup.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* =========================================================
   LOAD CURRENT USER
========================================================= */

function loadCurrentUser(){

    try{

        const saved =
            localStorage.getItem(
                "usanex_user"
            );

        if(saved){

            currentUser =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "User data error:",
            error
        );

        currentUser =
            null;

    }


    /*
     * Fallback:
     * read user_id from URL if needed.
     */

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        const params =
            new URLSearchParams(
                window.location.search
            );

        const userId =
            params.get(
                "user_id"
            );

        if(userId){

            currentUser = {
                user_id:userId
            };

        }

    }


    updateUserUI();

    loadConnections();

    loadNotificationCount();

}


/* =========================================================
   UPDATE USER UI
========================================================= */

function updateUserUI(){

    const avatar =
        document.getElementById(
            "yourStatusAvatar"
        );

    const menuName =
        document.getElementById(
            "menuUserName"
        );

    const menuId =
        document.getElementById(
            "menuUserId"
        );


    if(!currentUser){

        avatar.textContent =
            "U";

        menuName.textContent =
            "Usanex User";

        menuId.textContent =
            "User ID";

        return;

    }


    const name =
        currentUser.name ||
        currentUser.display_name ||
        currentUser.username ||
        "User";


    const userId =
        currentUser.user_id ||
        currentUser.username ||
        "";


    avatar.textContent =
        name
            .trim()
            .charAt(0)
            .toUpperCase() ||
        "U";


    menuName.textContent =
        name;


    menuId.textContent =
        userId;


    const photo =
        currentUser.profile_photo ||
        currentUser.profile_picture ||
        currentUser.avatar ||
        currentUser.photo ||
        currentUser.profile_image ||
        "";


    if(photo){

        avatar.innerHTML =
            "";

        const img =
            document.createElement(
                "img"
            );

        img.src =
            photo;

        img.alt =
            "";

        img.onerror =
            function(){

                avatar.innerHTML =
                    "";

                avatar.textContent =
                    name
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "U";

            };

        avatar.appendChild(
            img
        );

    }

}


/* =========================================================
   LOAD CONNECTED USERS
========================================================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "peopleList"
        );

    const empty =
        document.getElementById(
            "noConnected"
        );


    if(!currentUser ||
       !currentUser.user_id){

        list.innerHTML =
            "";

        empty.style.display =
            "flex";

        return;

    }


    try{

        /*
         * IMPORTANT:
         *
         * Home connections API
         *
         * NOT /api/connections
         *
         */

        const url =
            "/api/home/connections?user_id=" +
            encodeURIComponent(
                currentUser.user_id
            );


        console.log(
            "Loading connections:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Home connections response:",
            data
        );


        let people = [];


        /*
         * Supports:
         *
         * {users:[...]}
         * {connections:[...]}
         * {data:[...]}
         * [...]
         */

        if(Array.isArray(data)){

            people =
                data;

        }
        else if(
            Array.isArray(
                data.users
            )
        ){

            people =
                data.users;

        }
        else if(
            Array.isArray(
                data.connections
            )
        ){

            people =
                data.connections;

        }
        else if(
            Array.isArray(
                data.data
            )
        ){

            people =
                data.data;

        }


        list.innerHTML =
            "";


        if(!people.length){

            empty.style.display =
                "flex";

            return;

        }


        empty.style.display =
            "none";


        people.forEach(
            function(person){

                createConnectedCard(
                    person
                );

            }
        );


    }catch(error){

        console.error(
            "Connection loading error:",
            error
        );


        list.innerHTML =
            "";


        empty.style.display =
            "flex";

    }

}


/* =========================================================
   CREATE CONNECTED USER CARD
========================================================= */

function createConnectedCard(person){

    const list =
        document.getElementById(
            "peopleList"
        );


    const card =
        document.createElement(
            "div"
        );

    card.className =
        "user-card";


    /* ---------- AVATAR ---------- */

    const dp =
        document.createElement(
            "div"
        );

    dp.className =
        "user-dp";


    const name =
        person.name ||
        person.display_name ||
        person.username ||
        "User";


    const userId =
        person.user_id ||
        person.username ||
        person.id ||
        "";


    const photo =
        person.profile_photo ||
        person.profile_picture ||
        person.avatar ||
        person.photo ||
        person.profile_image ||
        "";


    if(photo){

        const img =
            document.createElement(
                "img"
            );

        img.src =
            photo;

        img.alt =
            "";


        img.onerror =
            function(){

                img.remove();

                dp.textContent =
                    name
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "U";

            };


        dp.appendChild(
            img
        );

    }else{

        dp.textContent =
            name
                .trim()
                .charAt(0)
                .toUpperCase() ||
            "U";

    }


    /* ---------- USER INFO ---------- */

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "user-info";


    const nameElement =
        document.createElement(
            "div"
        );

    nameElement.className =
        "user-name";

    nameElement.textContent =
        name;


    const idElement =
        document.createElement(
            "div"
        );

    idElement.className =
        "user-id";

    idElement.textContent =
        userId;


    info.appendChild(
        nameElement
    );

    info.appendChild(
        idElement
    );


    /* ---------- CONNECTED ---------- */

    const connected =
        document.createElement(
            "button"
        );

    connected.type =
        "button";

    connected.className =
        "connected-btn";

    connected.textContent =
        "Connected";

    connected.disabled =
        true;

    connected.tabIndex =
        -1;


    /*
     * NO CLICK
     *
     * NO FOLLOW
     *
     * NO UNFOLLOW
     */


    card.appendChild(
        dp
    );

    card.appendChild(
        info
    );

    card.appendChild(
        connected
    );


    list.appendChild(
        card
    );

}

/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    if(
        !currentUser ||
        !currentUser.user_id
    ){

        badge.classList.add(
            "hidden"
        );

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Notification API " +
                response.status
            );

        }


        const data =
            await response.json();


        let count = 0;


        if(
            typeof data.unread_count ===
            "number"
        ){

            count =
                data.unread_count;

        }
        else if(
            typeof data.count ===
            "number"
        ){

            count =
                data.count;

        }
        else if(
            Array.isArray(
                data.notifications
            )
        ){

            count =
                data.notifications.filter(
                    function(item){

                        return (
                            item.is_read === false ||
                            item.read === false
                        );

                    }
                ).length;

        }


        if(count > 0){

            badge.textContent =
                count > 99
                    ? "99+"
                    : String(count);

            badge.classList.remove(
                "hidden"
            );

        }else{

            badge.classList.add(
                "hidden"
            );

        }


    }catch(error){

        console.log(
            "Notification count unavailable"
        );

        badge.classList.add(
            "hidden"
        );

    }

}
