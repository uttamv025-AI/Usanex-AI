<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    min-height:100vh;
    padding-bottom:90px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}

/* =========================
   TOP HEADER
========================= */

.header{
    height:72px;
    padding:0 15px;
    display:flex;
    align-items:center;
    gap:10px;

    background:rgba(7,9,13,.88);
    border-bottom:1px solid rgba(255,255,255,.07);

    position:sticky;
    top:0;
    z-index:30;

    backdrop-filter:blur(18px);
}

.logo-mark{
    width:42px;
    height:42px;
    flex-shrink:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:24px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:10px;
    bottom:6px;
}

.logo-name{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
    white-space:nowrap;
}

/* SEARCH */

.search-box{
    flex:1;
    min-width:0;
    height:42px;

    display:flex;
    align-items:center;

    padding:0 13px;

    border-radius:23px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.search-icon{
    font-size:20px;
    color:#8993a5;
    margin-right:7px;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

.search-box input::placeholder{
    color:#747d8d;
}

/* HEADER BUTTONS */

.header-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;
    border-radius:13px;

    background:#151820;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.07);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;
}

.header-btn:active{
    transform:scale(.95);
}

.bell-icon{
    font-size:20px;
}

/* NOTIFICATION BADGE */

.notification-badge{
    position:absolute;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:20px;

    background:#247fff;

    color:#fff;

    font-size:10px;
    font-weight:800;

    display:flex;
    align-items:center;
    justify-content:center;

    top:-3px;
    right:-3px;

    border:
        2px solid
        #07090d;
}

.notification-badge.hidden{
    display:none;
}

/* MENU */

.menu-icon{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-icon span{
    width:17px;
    height:2px;

    border-radius:5px;

    background:#fff;
}

/* =========================
   STATUS
========================= */

.status-wrapper{
    padding:16px 15px 5px;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);
}

.status-scroll{
    display:flex;
    gap:15px;

    overflow-x:auto;

    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    width:58px;
    flex-shrink:0;

    text-align:center;
}

.status-circle{
    width:53px;
    height:53px;

    margin:auto;

    border-radius:50%;

    padding:2px;

    background:
        linear-gradient(
            145deg,
            #3196ff,
            #0758cb
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.status-inner{
    width:100%;
    height:100%;

    border-radius:50%;

    background:#151820;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:800;

    overflow:hidden;
}

.status-inner img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;
}

.status-name{
    margin-top:6px;

    font-size:10px;

    color:#8b94a5;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* YOU STATUS */

.add-status{
    position:relative;
}

.add-status .plus{
    position:absolute;

    right:0;
    bottom:17px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#2788ff;

    border:
        2px solid
        #07090d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:900;
}

/* =========================
   MAIN CONTENT
========================= */

.content{
    padding:25px 15px 30px;
}

.welcome-card{
    padding:22px 18px;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.98),
            rgba(14,17,23,.98)
        );

    border:
        1px solid
        rgba(45,145,255,.14);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.18);

    position:relative;
    overflow:hidden;
}

.welcome-card:after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(45,145,255,.18),
            transparent 70%
        );
}

.welcome-small{
    font-size:12px;
    color:#7f8898;

    margin-bottom:7px;

    position:relative;
    z-index:2;
}

.welcome-title{
    font-size:24px;
    font-weight:800;

    letter-spacing:-.5px;

    position:relative;
    z-index:2;
}

.welcome-title span{
    color:#3296ff;
}

.welcome-text{
    margin-top:8px;

    color:#8b94a5;

    font-size:12px;
    line-height:1.5;

    position:relative;
    z-index:2;
}

/* =========================
   EMPTY HOME AREA
========================= */

.home-empty{
    min-height:360px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 20px;
}

.empty-circle{
    width:92px;
    height:92px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:20px;

    background:
        radial-gradient(
            circle,
            rgba(45,145,255,.22),
            rgba(7,9,13,0)
        );

    box-shadow:
        0 0 55px
        rgba(20,105,232,.12);
}

.empty-icon{
    width:58px;
    height:58px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    box-shadow:
        0 10px 28px
        rgba(20,105,232,.28);
}

.empty-title{
    font-size:18px;
    font-weight:800;

    margin-bottom:7px;
}

.empty-text{
    max-width:280px;

    font-size:12px;
    line-height:1.5;

    color:#7f8898;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    background:
        rgba(10,13,18,.96);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

    display:flex;
    align-items:center;
    justify-content:space-around;

    z-index:100;
}

.nav-item{
    min-width:60px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    color:#697384;

    font-size:10px;

    cursor:pointer;
}

.nav-icon{
    font-size:21px;
    line-height:1;
}

.nav-item.active{
    color:#3296ff;
}

.nav-item:active{
    transform:scale(.94);
}

/* CAMERA */

.camera-wrap{
    width:54px;
    height:54px;

    margin-top:-24px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    box-shadow:
        0 9px 28px
        rgba(20,105,232,.38);

    border:
        4px solid
        #07090d;

    cursor:pointer;
}

.camera-icon{
    font-size:22px;
}

/* =========================
   MENU POPUP
========================= */

.menu-overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.58);

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:500;
}

.menu-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.menu-panel{
    position:absolute;

    top:70px;
    right:14px;

    width:205px;

    padding:8px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #1a1f29,
            #0e1219
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.5);

    transform:
        translateY(-8px)
        scale(.97);

    transition:.2s;
}

.menu-overlay.show .menu-panel{
    transform:
        translateY(0)
        scale(1);
}

.menu-user{
    padding:12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    margin-bottom:5px;
}

.menu-user-name{
    font-size:14px;
    font-weight:700;
}

.menu-user-id{
    margin-top:4px;

    font-size:10px;

    color:#7f8898;
}

.menu-option{
    height:43px;

    padding:0 12px;

    border-radius:12px;

    display:flex;
    align-items:center;

    gap:11px;

    color:#d8deea;

    font-size:12px;

    cursor:pointer;
}

.menu-option:active{
    background:#202631;
}

.menu-option.logout{
    color:#ff9292;
}

/* =========================
   TOAST
========================= */

.status-popup{
    position:fixed;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:13px;

    text-align:center;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:700;
}

.status-popup.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

    .header{
        padding:0 9px;
        gap:7px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        font-size:15px;
    }

    .search-box{
        height:39px;
        padding:0 10px;
    }

    .search-icon{
        font-size:18px;
        margin-right:5px;
    }

    .header-btn{
        width:36px;
        height:36px;
        border-radius:11px;
    }

    .content{
        padding-left:13px;
        padding-right:13px;
    }

    .welcome-title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo-mark">
            <div class="logo-u">U</div>
            <div class="logo-shine"></div>
        </div>

        <div class="logo-name">
            Usanex
        </div>

        <div class="search-box"
             id="searchBox">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search people..."
                autocomplete="off"
            >
        </div>

        <button
            class="header-btn"
            id="notificationBtn"
            aria-label="Notifications">

            <span class="bell-icon">
                🔔
            </span>

            <span
                class="notification-badge hidden"
                id="notificationBadge">
                0
            </span>

        </button>

        <button
            class="header-btn"
            id="menuBtn"
            aria-label="Menu">

            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </button>

    </header>


    <!-- =========================
         STATUS BAR
    ========================== -->

    <section class="status-wrapper">

        <div
            class="status-scroll"
            id="statusScroll">

            <!-- YOU -->

            <div
                class="status-item add-status"
                id="yourStatus">

                <div class="status-circle">

                    <div
                        class="status-inner"
                        id="yourStatusAvatar">
                        U
                    </div>

                </div>

                <div class="plus">
                    +
                </div>

                <div class="status-name">
                    You
                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="content">

        <section class="welcome-card">

            <div class="welcome-small">
                Welcome back
            </div>

            <div class="welcome-title">
                Hello, <span id="welcomeName">User</span>
            </div>

            <div class="welcome-text">
                Stay connected, discover people and enjoy Usanex.
            </div>

        </section>


        <!--
            IMPORTANT:
            NO CONNECTION / CONNECTED USERS
            ARE DISPLAYED HERE.
        -->

        <section class="home-empty">

            <div class="empty-circle">

                <div class="empty-icon">
                    ✦
                </div>

            </div>

            <div class="empty-title">
                Welcome to Usanex
            </div>

            <div class="empty-text">
                Search for people using the search bar above and
                explore their profiles.
            </div>

        </section>

    </main>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

        <div
            class="nav-item active"
            id="homeNav">

            <div class="nav-icon">
                🏠
            </div>

            <div>
                Home
            </div>

        </div>


        <div
            class="nav-item"
            id="reelNav">

            <div class="nav-icon">
                ▶
            </div>

            <div>
                Reel
            </div>

        </div>


        <div
            class="nav-item"
            id="collNav">

            <div class="nav-icon">
                ◎
            </div>

            <div>
                coll
            </div>

        </div>


        <div
            class="camera-wrap"
            id="cameraBtn">

            <div class="camera-icon">
                📷
            </div>

        </div>


        <div
            class="nav-item"
            id="profileNav">

            <div class="nav-icon">
                👤
            </div>

            <div>
                Profile
            </div>

        </div>

    </nav>

</div>


<!-- =========================
     MENU
========================= -->

<div
    class="menu-overlay"
    id="menuOverlay">

    <div
        class="menu-panel"
        id="menuPanel">

        <div class="menu-user">

            <div
                class="menu-user-name"
                id="menuUserName">
                User
            </div>

            <div
                class="menu-user-id"
                id="menuUserId">
                @user
            </div>

        </div>

        <div
            class="menu-option"
            id="menuProfile">

            👤
            <span>Profile</span>

        </div>

        <div
            class="menu-option logout"
            id="menuLogout">

            🚪
            <span>Logout</span>

        </div>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    class="status-popup"
    id="statusPopup">
</div>


<script>

/* ==========================================
   CURRENT USER
========================================== */

let currentUser = null;

function getCurrentUser(){

    try{

        const saved =
            localStorage.getItem("usanex_user");

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.log(error);

    }

    try{

        const saved =
            localStorage.getItem("user");

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.log(error);

    }

    return null;
}


/* ==========================================
   TOAST
========================================== */

let toastTimer = null;

function showToast(message){

    const popup =
        document.getElementById("statusPopup");

    popup.textContent = message;

    popup.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                popup.classList.remove("show");
            },
            2200
        );
}


/* ==========================================
   UPDATE USER UI
========================================== */

function updateUserUI(){

    if(!currentUser){
        return;
    }

    const name =
        currentUser.name ||
        currentUser.display_name ||
        currentUser.username ||
        "User";

    const userId =
        currentUser.user_id ||
        currentUser.username ||
        "";

    document.getElementById(
        "welcomeName"
    ).textContent = name;

    document.getElementById(
        "menuUserName"
    ).textContent = name;

    document.getElementById(
        "menuUserId"
    ).textContent =
        userId
            ? "@" + userId
            : "";

    const avatar =
        document.getElementById(
            "yourStatusAvatar"
        );

    const photo =
        currentUser.profile_picture ||
        currentUser.avatar ||
        currentUser.photo ||
        "";

    if(photo){

        avatar.innerHTML =
            `<img src="${escapeHTML(photo)}" alt="">`;

    }else{

        avatar.textContent =
            name.charAt(0).toUpperCase();

    }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   NOTIFICATION COUNT
========================================== */

async function loadNotificationCount(){

    if(!currentUser ||
       !currentUser.user_id){

        hideNotificationBadge();

        return;
    }

    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ) +
                "&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Notification request failed"
            );

        }

        const data =
            await response.json();

        const notifications =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.notifications)
                        ? data.notifications
                        : []
                );

        const unreadCount =
            notifications.filter(
                n => n &&
                     (
                       n.is_read === false ||
                       n.is_read === 0
                     )
            ).length;

        if(unreadCount > 0){

            showNotificationBadge(
                unreadCount
            );

        }else{

            hideNotificationBadge();

        }

    }catch(error){

        console.log(
            "Notification count error:",
            error
        );

        /*
         Do not show fake unread count
         if server request fails.
        */

        hideNotificationBadge();

    }

}


function showNotificationBadge(count){

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    badge.textContent =
        count > 99
            ? "99+"
            : String(count);

    badge.classList.remove(
        "hidden"
    );

}


function hideNotificationBadge(){

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    badge.textContent = "0";

    badge.classList.add(
        "hidden"
    );

}


/* ==========================================
   SEARCH
========================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );

searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){
            return;
        }

        const query =
            searchInput.value.trim();

        if(!query){

            showToast(
                "Enter a name or user ID"
            );

            return;
        }

        window.location.href =
            "/search?query=" +
            encodeURIComponent(query);

    }
);


/* ==========================================
   SEARCH BOX CLICK
========================================== */

document.getElementById(
    "searchBox"
).addEventListener(
    "click",
    function(){

        searchInput.focus();

    }
);


/* ==========================================
   NOTIFICATION BUTTON
========================================== */

document.getElementById(
    "notificationBtn"
).addEventListener(
    "click",
    function(){

        window.location.href =
            "/notifications";

    }
);


/* ==========================================
   MENU
========================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const menuOverlay =
    document.getElementById(
        "menuOverlay"
    );

menuBtn.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menuOverlay.classList.add(
            "show"
        );

    }
);


menuOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            menuOverlay
        ){

            menuOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* ==========================================
   PROFILE FROM MENU
========================================== */

document.getElementById(
    "menuProfile"
).addEventListener(

/* ==========================================
   WEBSOCKET
========================================== */

let socket = null;

function connectSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;

    }

    try{

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host +
                "/ws/" +
                encodeURIComponent(
                    currentUser.user_id
                )
            );


        socket.onopen =
            function(){

                console.log(
                    "Usanex socket connected"
                );

            };


        socket.onmessage =
            function(event){

                try{

                    const message =
                        JSON.parse(
                            event.data
                        );

                    /*
                     New notification:
                     refresh badge only.
                    */

                    if(
                        message &&
                        (
                            message.type ===
                            "notification" ||

                            message.type ===
                            "new_notification"
                        )
                    ){

                        loadNotificationCount();

                        showToast(
                            "New notification"
                        );

                    }

                }catch(error){

                    /*
                     Even if websocket message
                     is not JSON, refresh count.
                    */

                    loadNotificationCount();

                }

            };


        socket.onclose =
            function(){

                console.log(
                    "Usanex socket disconnected"
                );

            };


        socket.onerror =
            function(error){

                console.log(
                    "Socket error:",
                    error
                );

            };

    }catch(error){

        console.log(
            "Socket connection error:",
            error
        );

    }

}
