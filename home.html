<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050b18;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    width:100%;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,11,24,.97);
    border-bottom:1px solid rgba(255,255,255,.07);
}

/* ================= LOGO ================= */

.brand{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-mark{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:13px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #2185ff 0%,
            #0868e8 48%,
            #0049b5 100%
        );

    border:1px solid rgba(255,255,255,.16);

    box-shadow:
        0 5px 18px rgba(0,100,255,.30),
        inset 0 1px 2px rgba(255,255,255,.20);
}

.logo-u{
    position:relative;
    z-index:3;
    color:#fff;
    font-size:27px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
    transform:translateY(-1px);

    text-shadow:
        0 2px 5px rgba(0,0,0,.25);
}

.logo-shine{
    position:absolute;
    z-index:2;
    width:65px;
    height:15px;
    top:-8px;
    left:-24px;
    background:rgba(255,255,255,.23);
    transform:rotate(-38deg);
    filter:blur(1px);
}

.logo-mark::after{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    right:-8px;
    bottom:-9px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
}

.logo-name{
    font-size:19px;
    font-weight:700;
    margin-left:9px;
    color:#fff;
    white-space:nowrap;
}

/* ================= SEARCH ================= */

.search-box{
    flex:1;
    height:43px;
    min-width:0;
    border-radius:13px;
    background:#101a2b;
    border:1px solid rgba(255,255,255,.07);

    display:flex;
    align-items:center;

    padding:0 13px;
    cursor:text;
}

.search-icon{
    color:#8794a9;
    font-size:23px;
    margin-right:8px;
}

.search-input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

.search-input::placeholder{
    color:#7f8da3;
}

/* ================= SEARCH RESULT BOX ================= */

.search-results{
    position:fixed;

    top:72px;
    left:10px;
    right:10px;

    z-index:500;

    display:none;

    max-height:70vh;
    overflow-y:auto;

    background:#0d1728;

    border:1px solid rgba(255,255,255,.08);

    border-radius:17px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.55);

    padding:8px;
}

.search-results.active{
    display:block;
}

.search-result-title{
    padding:10px 10px 8px;

    color:#8794a9;

    font-size:12px;
}

.search-result-card{
    min-height:70px;

    width:100%;

    display:flex;
    align-items:center;

    padding:9px;

    border-radius:13px;

    cursor:pointer;

    transition:.15s ease;
}

.search-result-card:hover{
    background:#142238;
}

.search-result-card:active{
    transform:scale(.985);
}

.search-result-photo{
    width:48px;
    height:48px;
    min-width:48px;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #17345f,
            #0c1728
        );

    border:1px solid rgba(255,255,255,.07);

    font-size:18px;
    font-weight:bold;
}

.search-result-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.search-result-info{
    flex:1;
    min-width:0;

    margin-left:11px;
}

.search-result-name{
    font-size:14px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-result-id{
    margin-top:4px;

    color:#8290a5;

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-result-mobile{
    margin-top:3px;

    color:#617087;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-follow-btn{
    border:1px solid rgba(23,119,255,.35);

    background:rgba(23,119,255,.11);

    color:#63a7ff;

    border-radius:18px;

    padding:7px 11px;

    font-size:11px;
    font-weight:600;

    white-space:nowrap;

    cursor:pointer;
}

.search-follow-btn.following{
    color:#7fd8a1;

    border-color:rgba(70,200,120,.30);

    background:rgba(70,200,120,.08);
}

.search-follow-btn.connected{
    color:#63a7ff;

    border-color:rgba(23,119,255,.35);

    background:rgba(23,119,255,.10);

    cursor:pointer;
}

.search-follow-btn:disabled{
    opacity:1;
}

.search-empty{
    padding:28px 15px;

    text-align:center;

    color:#78869b;

    font-size:13px;
}

.search-loading{
    padding:25px;

    text-align:center;

    color:#8290a5;

    font-size:13px;
}

/* ================= MENU BUTTON ================= */

.menu-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border:0;
    border-radius:13px;
    background:#111b2d;
    color:#fff;
    font-size:23px;
    cursor:pointer;
}

/* ================= STATUS ================= */

.status-section{
    padding:15px 13px 8px;
}

.status-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.status-title{
    font-size:17px;
    font-weight:700;
    color:#fff;
}

.status-see-all{
    color:#5ca8ff;
    font-size:12px;
    cursor:pointer;
}

.status-scroll{
    display:flex;
    gap:15px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:2px 2px 6px;
}

.status-scroll::-webkit-scrollbar{
    display:none;
}

.status-item{
    min-width:62px;
    width:62px;
    text-align:center;
    cursor:pointer;
}

.status-circle{
    width:58px;
    height:58px;
    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:visible;

    background:#101a2d;

    font-size:20px;
    font-weight:bold;
}

/* UNSEEN STATUS */

.status-circle.unseen{
    border:3px solid #1685ff;
    padding:3px;
}

/* SEEN STATUS */

.status-circle.seen{
    border:3px solid #586273;
    padding:3px;
}

/* INNER DP */

.status-avatar-inner{
    width:100%;
    height:100%;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #1b579d,
            #0d1a30
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:19px;
    font-weight:700;

    overflow:hidden;
}

.status-avatar-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* YOUR STATUS */

.status-circle.your-status{
    border:2px solid #586273;
}

.status-plus{
    position:absolute;

    right:-2px;
    bottom:-2px;

    width:21px;
    height:21px;

    border-radius:50%;

    background:#1685ff;

    border:2px solid #050b18;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:15px;
    font-weight:bold;

    z-index:5;
}

.status-name{
    margin-top:7px;

    font-size:11px;

    color:#b4bfce;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= CONNECTIONS ================= */

.connections-section{
    padding:13px;
    padding-bottom:100px;
}

.connections-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.connections-title{
    font-size:18px;
    font-weight:700;
}

.connection-count{
    color:#7f8da3;
    font-size:13px;
}

.connections-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ================= USER CARD ================= */

.user-card{
    width:100%;
    min-height:76px;

    border-radius:17px;
    background:#0d1728;
    border:1px solid rgba(255,255,255,.06);

    display:flex;
    align-items:center;

    padding:11px;

    cursor:pointer;

    transition:
        background .15s ease,
        transform .12s ease;
}

.user-card:active{
    transform:scale(.985);
}

.user-card:hover{
    background:#101d32;
}

.profile-photo{
    width:53px;
    height:53px;
    min-width:53px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #17345f,
            #0c1728
        );

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    border:1px solid rgba(255,255,255,.06);

    transition:
        transform .15s ease,
        border-color .15s ease;
}

.profile-photo:active{
    transform:scale(.94);
}

.profile-photo:hover{
    border-color:rgba(23,119,255,.65);
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
    margin-left:12px;
}

.user-name{
    font-size:15px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;
    color:#7f8da3;
    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.connected-btn{
    border:1px solid rgba(23,119,255,.35);
    background:rgba(23,119,255,.10);

    color:#63a7ff;

    border-radius:20px;

    padding:8px 12px;

    font-size:12px;
    font-weight:600;

    white-space:nowrap;

    cursor:pointer;
}

/* ================= EMPTY ================= */

.empty-box{
    padding:32px 15px;

    text-align:center;

    color:#748198;

    background:#0d1728;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.05);
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

.empty-title{
    color:#c5cedc;
    font-size:15px;
    font-weight:600;
}

.empty-text{
    margin-top:6px;
    font-size:12px;
}

/* ================= ERROR ================= */

.error-box{
    padding:20px;

    text-align:center;

    border-radius:17px;

    background:#21121a;

    border:1px solid rgba(255,70,100,.15);
}

.error-title{
    font-size:14px;
    font-weight:700;
}

.error-text{
    margin-top:6px;
    color:#a88d98;
    font-size:12px;
}

/* ================= DP VIEWER ================= */

.dp-viewer{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    cursor:pointer;
}

.dp-viewer.active{
    display:flex;
}

.dp-viewer-image{
    display:block;

    width:min(82vw,360px);
    height:min(82vw,360px);

    object-fit:cover;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.92);

    box-shadow:
        0 0 35px rgba(22,119,255,.35),
        0 20px 70px rgba(0,0,0,.75);

    animation:dpZoom .18s ease-out;

    cursor:pointer;
}

@keyframes dpZoom{

    from{
        transform:scale(.88);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.dp-viewer-close{
    position:absolute;

    top:18px;
    right:18px;

    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.13);

    color:#fff;

    font-size:27px;

    cursor:pointer;

    z-index:5;
}

.dp-viewer-close:active{
    transform:scale(.92);
}

.dp-viewer-name{
    position:absolute;

    left:20px;
    right:20px;
    bottom:25px;

    text-align:center;

    color:#fff;

    font-size:15px;
    font-weight:600;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8);

    pointer-events:none;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    z-index:200;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:rgba(7,14,28,.98);

    border-top:1px solid rgba(255,255,255,.07);

    padding:5px 8px;
}

.nav-item{
    width:20%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    cursor:pointer;
}

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9aa7b9;

    font-size:23px;
}

.nav-item.active .nav-icon{
    color:#fff;
}

.plus-nav{
    width:44px;
    height:44px;

    border-radius:14px;

    background:#1677ff;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    box-shadow:
        0 5px 20px rgba(22,119,255,.25);
}

.notification-badge{
    position:absolute;

    top:7px;
    right:25%;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:10px;

    background:#1677ff;

    color:#fff;

    font-size:9px;
    font-weight:bold;

    display:none;

    align-items:center;
    justify-content:center;
}

/* ================= MENU ================= */

.menu-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.55);

    z-index:300;

    display:none;
}

.menu-panel{
    position:absolute;

    top:70px;
    right:12px;

    width:235px;

    border-radius:17px;

    background:#101b2d;

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 18px 45px rgba(0,0,0,.45);

    overflow:hidden;
}

.menu-item{
    min-height:52px;

    display:flex;
    align-items:center;

    padding:0 15px;

    gap:12px;

    color:#dce3ee;

    font-size:14px;

    cursor:pointer;
}

.menu-item:hover{
    background:#17243a;
}

.menu-item .menu-icon{
    width:27px;
    min-width:27px;
    height:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
}

.menu-item .menu-label{
    flex:1;
}

.menu-arrow{
    color:#718096;
    font-size:23px;
    line-height:1;
}

.menu-item.logout{
    color:#ff7388;

    border-top:1px solid rgba(255,255,255,.07);

    margin-top:4px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    left:50%;
    bottom:84px;

    transform:translateX(-50%);

    background:#17243a;

    color:#fff;

    padding:11px 17px;

    border-radius:22px;

    font-size:13px;

    z-index:1100;

    display:none;

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .header{
        padding:10px 11px;
        gap:8px;
    }

    .logo-mark{
        width:42px;
        height:42px;
        min-width:42px;
    }

    .logo-u{
        font-size:27px;
    }

    .logo-name{
        font-size:18px;
        margin-left:7px;
    }

    .search-box{
        height:42px;
    }

    .search-input{
        font-size:12px;
    }

    .menu-btn{
        width:42px;
        height:42px;
        min-width:42px;
    }

    .menu-panel{
        right:10px;
        width:230px;
    }

}

@media(max-width:390px){

    .logo-name{
        display:none;
    }

    .search-box{
        margin-left:2px;
    }

}
/* ================= STATUS PREVIEW ================= */

.status-preview-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.status-preview-box{
    width:100%;
    max-width:420px;
    background:#0b1425;
    border:1px solid #263752;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.status-preview-header{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    color:#fff;
    font-size:16px;
    font-weight:700;
}

.status-preview-header button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.status-preview-content{
    width:100%;
    min-height:300px;
    max-height:65vh;
    background:#050912;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.status-preview-content img,
.status-preview-content video{
    display:none;
    max-width:100%;
    max-height:65vh;
    object-fit:contain;
}

.status-next-btn{
    width:calc(100% - 30px);
    margin:15px;
    height:46px;
    border:none;
    border-radius:12px;
    background:#1685ff;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand">

        <div class="logo-mark">

            <span class="logo-u">U</span>

            <span class="logo-shine"></span>

        </div>

        <div class="logo-name">
            Usanex
        </div>

    </div>

    <div class="search-box">

        <span class="search-icon">
            ⌕
        </span>

        <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search name, user ID or number..."
            autocomplete="off"
            inputmode="search">

    </div>

    <button
        class="menu-btn"
        id="menuBtn">
        ☰
    </button>

</header>


<!-- ================= SEARCH RESULTS ================= -->

<div
    class="search-results"
    id="searchResults">
</div>


<!-- ================= STATUS ================= -->

<section class="status-section">

    <div class="status-title-row">

        <div class="status-title">
            Status
        </div>

        <div
            class="status-see-all"
            onclick="showAllStatuses()">

            See all

        </div>

    </div>


    <div class="status-scroll">


        <!-- YOUR STATUS -->

        <div
            class="status-item"
            onclick="addMyStatus()">

            <div class="status-circle your-status">

                <div class="status-avatar-inner">

                    <span id="youLetter">
                        U
                    </span>

                </div>

                <div class="status-plus">
                    +
                </div>

            </div>

            <div class="status-name">
                Your status
            </div>

        </div>


        <!-- SHIVAM -->

        <div
            class="status-item"
            onclick="openStatus('S','Shivam',false)">

            <div class="status-circle unseen">

                <div class="status-avatar-inner">
                    S
                </div>

            </div>

            <div class="status-name">
                Shivam
            </div>

        </div>


        <!-- KARAN -->

        <div
            class="status-item"
            onclick="openStatus('K','Karan',false)">

            <div class="status-circle unseen">

                <div class="status-avatar-inner">
                    K
                </div>

            </div>

            <div class="status-name">
                Karan
            </div>

        </div>


        <!-- ANKIT -->

        <div
            class="status-item"
            onclick="openStatus('A','Ankit',true)">

            <div class="status-circle seen">

                <div class="status-avatar-inner">
                    A
                </div>

            </div>

            <div class="status-name">
                Ankit
            </div>

        </div>


        <!-- RAHUL -->

        <div
            class="status-item"
            onclick="openStatus('R','Rahul',false)">

            <div class="status-circle unseen">

                <div class="status-avatar-inner">
                    R
                </div>

            </div>

            <div class="status-name">
                Rahul
            </div>

        </div>


        <!-- PRIYA -->

        <div
            class="status-item"
            onclick="openStatus('P','Priya',true)">

            <div class="status-circle seen">

                <div class="status-avatar-inner">
                    P
                </div>

            </div>

            <div class="status-name">
                Priya

<script>

/* =========================================================
   GLOBAL USER
========================================================= */

let currentUser = null;
let currentUserId = "";

let searchTimer = null;


/*
 * IMPORTANT:
 * Is Set me sirf accepted/current connections ke IDs
 * save honge.
 */
let connectedUserIds = new Set();


/* =========================================================
   USER RESOLUTION
========================================================= */

function resolveCurrentUser(){

    let user = null;

    const keys = [
        "usanex_user",
        "user",
        "currentUser",
        "logged_in_user"
    ];

    for(const key of keys){

        try{

            const value =
                localStorage.getItem(key);

            if(!value){
                continue;
            }

            const parsed =
                JSON.parse(value);

            if(
                parsed &&
                typeof parsed === "object"
            ){

                user = parsed;

                if(
                    user.user &&
                    typeof user.user === "object"
                ){

                    user = user.user;

                }

                break;

            }

        }catch(error){

            console.log(error);

        }

    }


    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlUserId =
        params.get("user_id");


    if(
        urlUserId &&
        urlUserId.trim()
    ){

        if(!user){
            user = {};
        }

        user.user_id =
            urlUserId.trim();

    }


    if(!user){

        const directId =
            localStorage.getItem(
                "usanex_user_id"
            );

        if(
            directId &&
            directId.trim()
        ){

            user = {
                user_id:
                    directId.trim()
            };

        }

    }


    currentUser = user;

    currentUserId =
        user && user.user_id
            ? String(user.user_id).trim()
            : "";


    const letter =
        document.getElementById(
            "youLetter"
        );


    if(letter){

        if(
            user &&
            user.name &&
            String(user.name).trim()
        ){

            letter.textContent =
                String(user.name)
                .trim()
                .charAt(0)
                .toUpperCase();

        }else{

            letter.textContent =
                "U";

        }

    }

}


/* =========================================================
   CONNECTION CHECK
========================================================= */

function isConnectedUser(userId){

    if(!userId){
        return false;
    }

    return connectedUserIds.has(
        String(userId).trim()
    );

}


/* =========================================================
   SEARCH ELEMENTS
========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );


/* =========================================================
   SEARCH INPUT
========================================================= */

if(searchInput){

    searchInput.addEventListener(
        "input",
        function(){

            const query =
                this.value.trim();

            clearTimeout(
                searchTimer
            );

            if(query.length < 2){

                closeSearchResults();

                return;

            }

            searchTimer =
                setTimeout(
                    function(){

                        searchUsers(
                            query
                        );

                    },
                    350
                );

        }
    );


    searchInput.addEventListener(
        "focus",
        function(){

            const query =
                this.value.trim();

            if(query.length >= 2){

                searchUsers(
                    query
                );

            }

        }
    );

}


/* =========================================================
   SEARCH USERS
========================================================= */

async function searchUsers(query){

    if(!searchResults){
        return;
    }


    searchResults.classList.add(
        "active"
    );


    searchResults.innerHTML = `

        <div class="search-loading">
            Searching...
        </div>

    `;


    try{

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(query) +
                "&user_id=" +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let users = [];


        if(Array.isArray(data)){

            users =
                data;

        }
        else if(
            data &&
            Array.isArray(data.users)
        ){

            users =
                data.users;

        }
        else if(
            data &&
            Array.isArray(data.results)
        ){

            users =
                data.results;

        }
        else if(
            data &&
            Array.isArray(data.data)
        ){

            users =
                data.data;

        }
        else if(
            data &&
            data.user
        ){

            users =
                [data.user];

        }


        const uniqueUsers = [];

        const seen =
            new Set();


        for(const user of users){

            if(
                !user ||
                typeof user !== "object"
            ){
                continue;
            }


            const id =
                user.user_id ||
                user.id ||
                user.username ||
                user.mobile;


            if(!id){
                continue;
            }


            const cleanId =
                String(id).trim();


            if(
                seen.has(cleanId)
            ){
                continue;
            }


            seen.add(cleanId);

            uniqueUsers.push(
                user
            );

        }


        users =
            uniqueUsers;


        /*
         * Frontend filtering:
         * name
         * user_id
         * username
         * mobile
         */

        const q =
            query.toLowerCase();


        users =
            users.filter(
                function(user){

                    const name =
                        String(
                            user.name ||
                            user.display_name ||
                            user.username ||
                            ""
                        )
                        .toLowerCase();


                    const userId =
                        String(
                            user.user_id ||
                            user.id ||
                            ""
                        )
                        .toLowerCase();


                    const username =
                        String(
                            user.username ||
                            ""
                        )
                        .toLowerCase();


                    const mobile =
                        String(
                            user.mobile ||
                            user.phone ||
                            user.phone_number ||
                            ""
                        )
                        .toLowerCase();


                    return (
                        name.includes(q) ||
                        userId.includes(q) ||
                        username.includes(q) ||
                        mobile.includes(q)
                    );

                }
            );


        renderSearchResults(
            users,
            query
        );


    }catch(error){

        console.log(
            "Search error:",
            error
        );


        searchResults.innerHTML = `

            <div class="search-empty">
                Search could not load.
                <br>
                Please try again.
            </div>

        `;

    }

}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function renderSearchResults(
    users,
    query
){

    if(!searchResults){
        return;
    }


    searchResults.innerHTML =
        "";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "search-result-title";

    title.textContent =
        users.length
            ? "People"
            : "No people found";


    searchResults.appendChild(
        title
    );


    if(users.length === 0){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "search-empty";

        empty.textContent =
            'No user found for "' +
            query +
            '"';


        searchResults.appendChild(
            empty
        );

        return;

    }


    users.forEach(
        function(user){

            const userId =
                user.user_id ||
                user.id ||
                user.username ||
                "";


            const cleanUserId =
                String(userId).trim();


            if(!cleanUserId){
                return;
            }


            /*
             * Current user ko search result me
             * show nahi karna.
             */

            if(
                currentUserId &&
                cleanUserId ===
                String(currentUserId).trim()
            ){

                return;

            }


            const name =
                user.name ||
                user.display_name ||
                user.username ||
                "User";


            const mobile =
                user.mobile ||
                user.phone ||
                user.phone_number ||
                "";


            const photo =
                user.profile_photo ||
                user.profile_picture ||
                user.photo ||
                "";


            const firstLetter =
                String(name)
                .trim()
                .charAt(0)
                .toUpperCase() ||
                "U";


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "search-result-card";


            /* ================= PHOTO ================= */

            const photoBox =
                document.createElement(
                    "div"
                );

            photoBox.className =
                "search-result-photo";


            if(photo){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    photo;

                img.alt =
                    name;


                img.onerror =
                    function(){

                        this.remove();

                        photoBox.textContent =
                            firstLetter;

                    };


                photoBox.appendChild(
                    img
                );

            }else{

                photoBox.textContent =
                    firstLetter;

            }


            /*
             * Search DP par click:
             * sirf DP viewer.
             */

            photoBox.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();

                    openDPViewer(
                        photo,
                        name
                    );

                }
            );


            /* ================= INFO ================= */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "search-result-info";


            const nameBox =
                document.createElement(
                    "div"
                );

            nameBox.className =
                "search-result-name";

            nameBox.textContent =
                name;


            const idBox =
                document.createElement(
                    "div"
                );

            idBox.className =
                "search-result-id";

            idBox.textContent =
                "ID: " +
                cleanUserId;


            info.appendChild(
                nameBox
            );

            info.appendChild(
                idBox
            );


            if(mobile){

                const mobileBox =
                    document.createElement(
                        "div"
                    );

                mobileBox.className =
                    "search-result-mobile";

                mobileBox.textContent =
                    "Mobile: " +
                    mobile;

                info.appendChild(
                    mobileBox
                );

            }


            /* ================= BUTTON ================= */

            const followBtn =
                document.createElement(
                    "button"
                );


            const alreadyConnected =
                isConnectedUser(
                    cleanUserId
                );


            if(alreadyConnected){

                /*
                 * CONNECTED USER
                 */

                followBtn.className =
                    "search-follow-btn connected";

                followBtn.textContent =
                    "Connected";


                /*
                 * Connected button par click:
                 * Chat open hoga.
                 */

                followBtn.addEventListener(
                    "click",
                    function(event){

                        event.preventDefault();

                        event.stopPropagation();


                        openChat(
                            cleanUserId
                        );

                    }
                );

            }else{

                /*
                 * NON-CONNECTED USER
                 */

                followBtn.className =
                    "search-follow-btn";

                followBtn.textContent =
                    "Follow";


                /*
                 * Follow button par sirf
                 * Follow request jayegi.
                 */

                followBtn.addEventListener(
                    "click",
                    async function(event){

                        event.preventDefault();

                        event.stopPropagation();


                        await followUser(
                            cleanUserId,
                            followBtn
                        );

                    }
                );

            }


            /* ================= CARD CLICK ================= */

            card.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();


                    /*
                     * ONLY connected user:
                     * card click -> Chat
                     */

                    if(
                        isConnectedUser(
                            cleanUserId
                        )
                    ){

                        closeSearchResults();

                        openChat(
                            cleanUserId
                        );

                        return;

                    }


                    /*
                     * NON-CONNECTED USER:
                     *
                     * Card par click karne par
                     * KISI PAGE par nahi jayega.
                     *
                     * Yahan jaan-bujhkar
                     * koi action nahi hai.
                     */

                    return;

                }
            );


            card.appendChild(
                photoBox
            );

            card.appendChild(
                info
            );

            card.appendChild(
                followBtn
            );


            searchResults.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(targetUserId){

    if(!targetUserId){
        return;
    }


    closeSearchResults();


    window.location.href =
        "/chat?user_id=" +
        encodeURIComponent(
            String(targetUserId).trim()
        );

}


/* =========================================================
   FOLLOW USER
========================================================= */

async function followUser(
    targetUserId,
    button
){

    if(!currentUserId){

        showToast(
            "Please login again"
        );

        return;

    }


    if(!targetUserId){
        return;
    }


    /*
     * Safety:
     * Already connected user ko follow request
     * nahi bhejni.
     */

    if(
        isConnectedUser(
            targetUserId
        )
    ){

        button.textContent =
            "Connected";

        button.classList.remove(
            "following"
        );

        button.classList.add(
            "connected"
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "...";


    try{

        const response =
            await fetch(
                "/api/follow",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        requester_id:
                            currentUserId,

                        target_user_id:
                            targetUserId

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.detail ||
                data.message ||
                "Follow failed"
            );

        }


        button.textContent =
            "Requested";

        button.classList.add(
            "following"
        );


        showToast(
            data.message ||
            "Follow request sent"
        );


    }catch(error){

        console.log(
            "Follow error:",
            error
        );


        button.disabled =
            false;

        button.textContent =
            "Follow";


        showToast(
            error.message ||
            "Follow request failed"
        );

    }

}


/* =========================================================
   CLOSE SEARCH
========================================================= */

function closeSearchResults(){

    if(searchResults){

        searchResults.classList.remove(
            "active"
        );

        searchResults.innerHTML =
            "";

    }

}


document.addEventListener(
    "click",
    function(event){

        const header =
            document.querySelector(
                ".header"
            );


        if(
            searchResults &&
            header &&
            !header.contains(event.target) &&
            !searchResults.contains(
                event.target
            )
        ){

            closeSearchResults();

        }

    }
);


/* =========================================================
   LOAD CONNECTIONS
========================================================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "connectionsList"
        );

    const count =
        document.getElementById(
            "connectionCount"
        );


    if(!currentUserId){

        connectedUserIds =
            new Set();

        count.textContent =
            "0";


        list.innerHTML = `

            <div class="error-box">

                <div class="error-title">
                    Login information not found
                </div>

                <div class="error-text">
                    Please login again to see your connections.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="empty-box">

            <div class="empty-icon">
                ◌
            </div>

            <div class="empty-title">
                Loading connections...
            </div>

            <div class="empty-text">
                Please wait
            </div>

        </div>

    `;


    let data = null;


    try{

        const response =
            await fetch(
                "/api/home/connections?user_id=" +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        data =
            await response.json();

    }catch(error){

        console.log(
            "Primary connection API error:",
            error
        );

    }


    if(!data){

        try{

            const response =
                await fetch(
                    "/api/connections?user_id=" +
                    encodeURIComponent(
                        currentUserId
                    ),
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            data =
                await response.json();

        }catch(error){

            console.log(
                "Connection API error:",
                error
            );


            connectedUserIds =
                new Set();


            count.textContent =
                "0";


            list.innerHTML = `

                <div class="error-box">

                    <div class="error-title">
                        Connections could not load
                    </div>

                    <div class="error-text">
                        Please refresh the page and try again.
                    </div>

                </div>

            `;

            return;

        }

    }


    let users = [];


    if(Array.isArray(data)){

        users =
            data;

    }
    else if(
        data &&
        Array.isArray(data.users)
    ){

        users =
            data.users;

    }
    else if(
        data &&
        Array.isArray(data.connections)
    ){

        users =
            data.connections;

    }
    else if(
        data &&
        Array.isArray(data.data)
    ){

        users =
            data.data;

    }


    const uniqueUsers = [];

    const seenIds =
        new Set();


    for(const user of users){

        if(
            !user ||
            typeof user !== "object"
        ){
            continue;
        }


        const id =
            user.user_id ||
            user.id ||
            user.username;


        if(!id){
            continue;
        }


        const cleanId =
            String(id).trim();


        if(
            !cleanId ||
            seenIds.has(cleanId)
        ){
            continue;
        }


        seenIds.add(
            cleanId
        );

        uniqueUsers.push(
            user
        );

    }


    users =
        uniqueUsers;


    /*
     * IMPORTANT:
     * Global Connected IDs refresh.
     */

    connectedUserIds =
        new Set(
            users
                .map(
                    function(user){

                        return String(
                            user.user_id ||
                            user.id ||
                            user.username ||
                            ""
                        ).trim();

                    }
                )
                .filter(Boolean)
        );


    count.textContent =
        String(users.length);


    if(users.length === 0){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ◎
                </div>

                <div class="empty-title">
                    No connected people
                </div>

                <div class="empty-text">
                    Your accepted connections will appear here.
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML =
        "";


    users.forEach(
        function(user){

            const userId =
                user.user_id ||
                user.id ||
                "";


            const cleanUserId =
                String(userId).trim();


            const name =
                user.name ||
                user.display_name ||
                user.username ||
                cleanUserId ||
                "User";


            const photo =
                user.profile_photo ||
                user.profile_picture ||
                user.photo ||
                "";


            const firstLetter =
                String(name)
                .trim()
                .charAt(0)
                .toUpperCase() ||
                "U";


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "user-card";


            /*
             * Connected card click:
             * Chat
             */

            card.addEventListener(
                "click",
                function(event){

                    if(
                        event.target.closest(
                            ".profile-photo"
                        )
                    ){
                        return;
                    }


                    if(!cleanUserId){
                        return;
                    }


                    openChat(
                        cleanUserId
                    );

                }
            );


            /* ================= PHOTO ================= */

            const photoBox =
                document.createElement(
                    "div"
                );

            photoBox.className =
                "profile-photo";


            if(photo){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    photo;

                img.alt =
                    name;


                img.onerror =
                    function(){

                        this.remove();

                        photoBox.textContent =
                            firstLetter;

                    };


                photoBox.appendChild(
                    img
                );

            }else{

                photoBox.textContent =
                    firstLetter;

            }


            photoBox.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();

                    openDPViewer(
                        photo,
                        name
                    );

                }
            );


            /* ================= INFO ================= */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "user-info";


            const nameBox =
                document.createElement(
                    "div"
                );

            nameBox.className =
                "user-name";

            nameBox.textContent =
                name;


            const idBox =
                document.createElement(
                    "div"
                );

            idBox.className =
                "user-id";

            idBox.textContent =
                cleanUserId;


            info.appendChild(
                nameBox
            );

            info.appendChild(
                idBox
            );


            /* ================= CONNECTED BUTTON ================= */

            const button =
                document.createElement(
                    "div"
                );

            button.className =
                "connected-btn";

            button.textContent =
                "Connected";


            button.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();


                    openChat(
                        cleanUserId
                    );

                }
            );


            card.appendChild(
                photoBox
            );

            card.appendChild(
                info
            );

            card.appendChild(
                button
            );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   DP VIEWER
========================================================= */

function openDPViewer(
    photo,
    name
){

    const viewer =
        document.getElementById(
            "dpViewer"
        );

    const image =
        document.getElementById(
            "dpViewerImage"
        );

    const nameBox =
        document.getElementById(
            "dpViewerName"
        );


    if(!viewer){
        return;
    }


    if(
        photo &&
        String(photo).trim()
    ){

        image.src =
            photo;

        image.alt =
            name ||
            "Profile Photo";

        image.style.display =
            "block";

    }else{

        image.removeAttribute(
            "src"
        );

        image.style.display =
            "none";

    }


    nameBox.textContent =
        name || "";


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


function closeDPViewer(event){

    if(event){
        event.stopPropagation();
    }


    const viewer =
        document.getElementById(
            "dpViewer"
        );


    if(viewer){

        viewer.classList.remove(
            "active"
        );

    }


    document.body.style.overflow =
        "";

}


/* =========================================================
   NOTIFICATION COUNT
========================================================= */

async function loadNotificationCount(){

    if(!currentUserId){
        return;
    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUserId
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){
            return;
        }


        const data =
            await response.json();


        let notifications = [];


        if(Array.isArray(data)){

            notifications =
                data;

        }
        else if(
            data &&
            Array.isArray(
                data.notifications
            )
        ){

            notifications =
                data.notifications;

        }
        else if(
            data &&
            Array.isArray(
                data.data
            )
        ){

            notifications =
                data.data;

        }


        const unread =
            notifications.filter(
                function(item){

                    return (
                        item &&
                        (
                            item.is_read === false ||
                            item.read === false
                        )
                    );

                }
            ).length;


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        if(
            badge &&
            unread > 0
        ){

            badge.style.display =
                "flex";

            badge.textContent =
                unread > 99
                    ? "99+"
                    : String(unread);

        }else if(badge){

            badge.style.display =
                "none";

        }

    }catch(error){

        console.log(
            "Notification error:",
            error
        );

    }

}

/* =========================================================
   STATUS: ADD MY STATUS
========================================================= */

function addMyStatus(){

    const input = document.createElement("input");

    input.type = "file";

    input.accept = "image/*,video/*";

    input.onchange = function(){

        const file = input.files[0];

        if(!file){
            return;
        }

        const modal =
            document.getElementById(
                "statusPreviewModal"
            );

        const image =
            document.getElementById(
                "statusPreviewImage"
            );

        const video =
            document.getElementById(
                "statusPreviewVideo"
            );

        const fileURL =
            URL.createObjectURL(file);

        image.style.display = "none";
        video.style.display = "none";

        if(file.type.startsWith("image/")){

            image.src = fileURL;

            image.style.display = "block";

        }
        else if(file.type.startsWith("video/")){

            video.src = fileURL;

            video.style.display = "block";

        }

        modal.style.display = "flex";

    };

    input.click();

}
