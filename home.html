<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Usanex</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial, sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{
    min-height:100vh;
    padding-bottom:100px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:88px;

    padding:0 20px;

    display:flex;
    align-items:center;

    gap:14px;

    background:rgba(7,9,13,.88);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    position:sticky;
    top:0;

    z-index:30;

    backdrop-filter:blur(18px);
}


/* =========================================================
   LOGO
========================================================= */

.brand{

    display:flex;
    align-items:center;

    flex-shrink:0;
}

.logo-mark{

    width:43px;
    height:43px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{

    font-size:25px;
    font-weight:900;

    color:#fff;

    z-index:2;
}

.logo-shine{

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{

    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:11px;
    bottom:6px;
}

.logo-name{

    margin-left:9px;

    font-size:20px;
    font-weight:800;

    letter-spacing:-.5px;
}


/* =========================================================
   SEARCH
========================================================= */

.search{

    height:45px;

    flex:1;

    min-width:0;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-radius:24px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.03);

    cursor:text;
}

.search-icon{

    font-size:22px;

    color:#8993a5;

    margin-right:9px;
}

.search input{

    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:14px;
}

.search input::placeholder{

    color:#747d8d;
}


/* =========================================================
   HEADER ICONS
========================================================= */

.header-actions{

    display:flex;

    align-items:center;

    gap:12px;
}

.header-btn{

    width:40px;
    height:40px;

    border:0;

    border-radius:13px;

    background:#151820;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;
}

.header-btn:active{

    transform:scale(.92);
}


/* =========================================================
   MAIN
========================================================= */

.content{

    padding:20px 20px 20px;
}


/* =========================================================
   STATUS SECTION
========================================================= */

.status-section{

    margin-bottom:27px;
}

.status-head{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.status-title{

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;
}

.status-see{

    font-size:12px;

    color:#6faeff;

    font-weight:700;

    cursor:pointer;
}


/* =========================================================
   STATUS SCROLL
========================================================= */

.status-scroll{

    display:flex;

    gap:16px;

    overflow-x:auto;

    overflow-y:hidden;

    padding:3px 2px 8px;

    scroll-behavior:smooth;

    scrollbar-width:none;
}

.status-scroll::-webkit-scrollbar{

    display:none;
}


/* =========================================================
   STATUS ITEM
========================================================= */

.status-item{

    width:68px;

    flex-shrink:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    cursor:pointer;
}

.status-ring{

    width:64px;
    height:64px;

    padding:3px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #2e94ff,
            #7c4dff,
            #16c9ff
        );

    box-shadow:
        0 5px 18px
        rgba(30,120,255,.18);
}

.status-avatar{

    width:100%;
    height:100%;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:800;

    background:
        linear-gradient(
            145deg,
            #202735,
            #0f131b
        );

    border:
        3px solid
        #090b10;
}

.status-name{

    width:68px;

    margin-top:7px;

    text-align:center;

    font-size:10px;

    color:#aab2c0;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   NO STATUS
========================================================= */

.no-status{

    color:#70798a;

    font-size:12px;

    padding:15px 5px;

    display:none;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:17px;
}

.section-title{

    font-size:19px;

    font-weight:800;

    letter-spacing:.8px;
}

.section-line{

    flex:1;

    height:1px;

    margin-left:15px;

    background:
        linear-gradient(
            90deg,
            #29303c,
            transparent
        );
}


/* =========================================================
   CONNECTIONS
========================================================= */

.connections{

    display:flex;

    flex-direction:column;

    gap:10px;
}

.connection{

    min-height:72px;

    display:flex;

    align-items:center;

    padding:11px 13px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);

    cursor:pointer;

    transition:.2s;
}

.connection:active{

    transform:scale(.985);
}

.avatar{

    width:49px;
    height:49px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
    font-weight:800;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);
}

.connection-info{

    flex:1;

    min-width:0;

    margin-left:12px;
}

.connection-name{

    font-size:15px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.connection-id{

    margin-top:5px;

    font-size:11px;

    color:#818a9a;
}

.connection-arrow{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9aa3b2;

    background:#1d222c;

    font-size:21px;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{

    min-height:
        calc(100vh - 390px);

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        30px 25px;
}

.empty-circle{

    width:105px;
    height:105px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(35,133,245,.20),
            rgba(35,133,245,.04)
        );

    border:
        1px solid
        rgba(50,140,255,.16);

    box-shadow:
        0 0 45px
        rgba(25,115,245,.10);

    margin-bottom:22px;
}

.empty-icon{

    font-size:43px;
}

.empty-title{

    font-size:22px;

    font-weight:800;

    margin-bottom:9px;
}

.empty-text{

    max-width:310px;

    color:#7e8797;

    font-size:13px;

    line-height:1.6;
}


/* =========================================================
   CAMERA BUTTON
========================================================= */

.camera{

    position:fixed;

    right:20px;
    bottom:111px;

    width:58px;
    height:58px;

    border-radius:19px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        linear-gradient(
            145deg,
            #1e2735,
            #121720
        );

    color:#fff;

    font-size:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.45);

    z-index:40;

    cursor:pointer;
}

.camera:active{

    transform:scale(.92);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    left:10px;
    right:10px;
    bottom:10px;

    height:76px;

    border-radius:25px;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        1fr;

    align-items:center;

    background:
        rgba(19,22,29,.94);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.50);

    backdrop-filter:blur(20px);

    z-index:50;
}


/* =========================================================
   NAV ITEM
========================================================= */

.nav-item{

    height:70px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    color:#737c8d;

    cursor:pointer;
}

.nav-icon{

    font-size:21px;

    line-height:1;
}

.nav-label{

    font-size:10px;

    font-weight:600;
}

.nav-item.active{

    color:#fff;
}

.nav-item.active .nav-icon{

    filter:
        drop-shadow(
            0 0 8px
            rgba(45,145,255,.7)
        );
}


/* =========================================================
   CENTER PLUS
========================================================= */

.nav-center{

    display:flex;

    align-items:center;
    justify-content:center;
}

.plus-btn{

    width:55px;
    height:55px;

    border-radius:18px;

    border:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;

    font-size:34px;

    font-weight:300;

    box-shadow:
        0 9px 25px
        rgba(18,105,232,.40);

    cursor:pointer;
}

.plus-btn:active{

    transform:scale(.90);
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:390px){

    .header{

        padding:0 10px;

        gap:7px;
    }

    .logo-mark{

        width:38px;
        height:38px;

        border-radius:12px;
    }

    .logo-u{

        font-size:22px;
    }

    .logo-name{

        margin-left:6px;

        font-size:16px;
    }

    .search{

        height:40px;

        padding:0 11px;
    }

    .search-icon{

        font-size:19px;

        margin-right:5px;
    }

    .header-actions{

        gap:5px;
    }

    .header-btn{

        width:35px;
        height:35px;

        font-size:17px;
    }

    .content{

        padding-left:15px;
        padding-right:15px;
    }

    .status-scroll{

        gap:14px;
    }

    .status-item{

        width:63px;
    }

    .status-ring{

        width:60px;
        height:60px;
    }

    .status-name{

        width:63px;
    }

    .bottom-nav{

        left:7px;
        right:7px;
    }

    .camera{

        right:16px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <div class="brand">

        <div class="logo-mark">

            <span class="logo-u">
                U
            </span>

            <span class="logo-shine">
            </span>

        </div>

        <div class="logo-name">
            Usanex
        </div>

    </div>


    <div
        class="search"
        onclick="openSearch()">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search people"
            autocomplete="off">

    </div>


    <div class="header-actions">

        <button
            class="header-btn"
            onclick="openNotifications()">

            🔔

        </button>

        <button
            class="header-btn"
            onclick="openMenu()">

            ☰

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="content">


<!-- =====================================================
     STATUS
===================================================== -->

<section class="status-section">

    <div class="status-head">

        <div class="status-title">
            Status
        </div>

        <div
            class="status-see"
            onclick="openAllStatus()">

            See all

        </div>

    </div>


    <div
        id="statusScroll"
        class="status-scroll">

        <!-- Status users will load here -->

    </div>


    <div
        id="noStatus"
        class="no-status">

        No active status from your connections.

    </div>

</section>


<!-- =====================================================
     CONNECTIONS
===================================================== -->

<div class="section-head">

    <div class="section-title">
        Connections
    </div>

    <div class="section-line"></div>

</div>


<div
    id="connections"
    class="connections">
</div>


<!-- EMPTY -->

<div
    id="emptyState"
    class="empty">

    <div class="empty-circle">

        <div class="empty-icon">
            👥
        </div>

    </div>

    <div class="empty-title">
        No connections yet
    </div>

    <div class="empty-text">
        Search for people and connect with them.
        Your verified connections will appear here.
    </div>

</div>


</main>


<!-- =====================================================
     CAMERA
===================================================== -->

<button
    class="camera"
    onclick="openCamera()">

    📷

</button>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <div
        class="nav-item active"
        onclick="goHome()">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            Home
        </div>

    </div>


    <div
        class="nav-item"
        onclick="openReels()">

        <div class="nav-icon">
            ▶
        </div>

        <div class="nav-label">
            Reels
        </div>

    </div>


    <div class="nav-center">

        <button
            class="plus-btn"
            onclick="openCreate()">

            +

        </button>

    </div>


    <div
        class="nav-item"
        onclick="openCollection()">

        <div class="nav-icon">
            ▣
        </div>

        <div class="nav-label">
            Coll
        </div>

    </div>


    <div
        class="nav-item"
        onclick="openProfile()">

        <div class="nav-icon">
            ♙
        </div>

        <div class="nav-label">
            Profile
        </div>

    </div>


</nav>


</div>


<script>

/* =========================================================
   DEMO STATUS DATA
========================================================= */

/*
   Abhi UI test ke liye demo status users hain.

   Jab real Status API banegi,
   isi array ki jagah API se verified connections
   ke active status load honge.
*/

const demoStatuses = [

    {
        name: "Rahul",
        user_id: "rahul01"
    },

    {
        name: "Aman",
        user_id: "aman02"
    },

    {
        name: "Priya",
        user_id: "priya03"
    },

    {
        name: "Rohit",
        user_id: "rohit04"
    },

    {
        name: "Neha",
        user_id: "neha05"
    },

    {
        name: "Vikas",
        user_id: "vikas06"
    }

];


/* =========================================================
   LOAD STATUS
========================================================= */

function loadStatuses(){

    const container =
        document.getElementById(
            "statusScroll"
        );

    const noStatus =
        document.getElementById(
            "noStatus"
        );

    container.innerHTML = "";

    /*
       Demo data.

       Baad me yahan:
       /api/home/statuses

       se real data aayega.
    */

    const statuses =
        demoStatuses;


    if(
        !statuses ||
        statuses.length === 0
    ){

        noStatus.style.display =
            "block";

        return;

    }


    noStatus.style.display =
        "none";


    statuses.forEach(status => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "status-item";


        const firstLetter =
            (
                status.name ||
                "U"
            )
            .charAt(0)
            .toUpperCase();


        item.innerHTML = `

            <div class="status-ring">

                <div class="status-avatar">

                    ${firstLetter}

                </div>

            </div>

            <div class="status-name">

                ${escapeHtml(
                    status.name ||
                    "User"
                )}

            </div>

        `;


        item.onclick =
            function(){

                openStatus(
                    status.user_id
                );

            };


        container.appendChild(item);

    });

}


/* =========================================================
   OPEN STATUS
========================================================= */

function openStatus(userId){

    if(!userId){

        return;

    }

    /*
       Baad me actual Status Viewer
       yahan open hoga.
    */

    alert(
        "Status of " +
        userId +
        " will open here."
    );

}


/* =========================================================
   SEE ALL STATUS
========================================================= */

function openAllStatus(){

    alert(
        "All active statuses will open here."
    );

}


/* =========================================================
   LOAD CONNECTIONS
========================================================= */

async function loadConnections(){

    const connections =
        document.getElementById(
            "connections"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );

    try{

        const response =
            await fetch(
                "/api/home/connections"
            );

        if(!response.ok){

            throw new Error(
                "Connection API failed"
            );

        }

        const data =
            await response.json();

        connections.innerHTML = "";

        const users =
            data.users || [];


        if(users.length === 0){

            empty.style.display =
                "flex";

            return;

        }


        empty.style.display =
            "none";


        users.forEach(user => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "connection";


            const firstLetter =
                (
                    user.name ||
                    "U"
                )
                .charAt(0)
                .toUpperCase();


            row.innerHTML = `

                <div class="avatar">
                    ${firstLetter}
                </div>

                <div class="connection-info">

                    <div class="connection-name">

                        ${escapeHtml(
                            user.name ||
                            "User"
                        )}

                    </div>

                    <div class="connection-id">

                        ${escapeHtml(
                            user.user_id ||
                            ""
                        )}

                    </div>

                </div>

                <div class="connection-arrow">
                    ›
                </div>

            `;


            row.onclick = function(){

                if(user.user_id){

                    window.location.href =
                        "/search?user_id=" +
                        encodeURIComponent(
                            user.user_id
                        );

                }

            };


            connections.appendChild(row);

        });


    }catch(error){

        console.error(
            error
        );

        connections.innerHTML = "";

        empty.style.display =
            "flex";

    }

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   HEADER
========================================================= */

function openSearch(){

    window.location.href =
        "/search";

}


function openNotifications(){

    window.location.href =
        "/notifications";

}


function openMenu(){

    alert(
        "Menu will be available here."
    );

}


/* =========================================================
   CAMERA
========================================================= */

function openCamera(){

    alert(
        "Camera will be available here."
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href =
        "/home";

}


function openReels(){

    alert(
        "Reels will be available here."
    );

}


function openCreate(){

    alert(
        "Create option will be available here."
    );

}


function openCollection(){

    alert(
        "Collection will be available here."
    );

}


function openProfile(){

    alert(
        "Profile will be available here."
    );

}


/* =========================================================
   START
========================================================= */

loadStatuses();

loadConnections();

</script>

</body>

</html>
