<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex AI - Home</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#05080d;
    color:#fff;
    min-height:100vh;
}

/* ============================================================
   HEADER
============================================================ */

.header{
    height:72px;
    padding:0 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,13,.97);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(14px);
}

/* ============================================================
   USANEX LOGO
============================================================ */

.brand{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:linear-gradient(145deg,#2d91ff,#0756c9);
    box-shadow:0 7px 22px rgba(18,105,232,.38);
    overflow:hidden;
}

.logo-u{
    font-size:25px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    right:7px;
    top:6px;
    opacity:.9;
}

.logo-mark:after{
    content:"";
    position:absolute;
    width:21px;
    height:4px;
    border-radius:10px;
    background:rgba(255,255,255,.25);
    left:11px;
    bottom:6px;
}

.logo-name{
    margin-left:9px;
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#fff;
}

/* ============================================================
   HEADER SEARCH
============================================================ */

.header-search{
    flex:1;
    min-width:0;
    height:43px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-radius:23px;
    background:#151a22;
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    transition:.2s;
}

.header-search:active{
    transform:scale(.98);
}

.header-search:hover{
    background:#191f29;
    border-color:rgba(45,145,255,.20);
}

.header-search-icon{
    font-size:21px;
    color:#8993a5;
    margin-right:9px;
    line-height:1;
}

.header-search-text{
    color:#8993a5;
    font-size:14px;
}

/* ============================================================
   HEADER ACTIONS
============================================================ */

.header-actions{
    display:flex;
    gap:8px;
    align-items:center;
    flex-shrink:0;
}

.header-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.10);
    background:#0c121a;
    color:#fff;
    font-size:19px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:.2s;
}

.header-btn:active{
    transform:scale(.92);
}

.header-btn:hover{
    background:#121b27;
}

/* ============================================================
   NOTIFICATION BADGE
============================================================ */

.notification-wrap{
    position:relative;
    display:flex;
}

.notification-badge{
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:#ff304f;
    color:#fff;
    border:2px solid #05080d;
    font-size:10px;
    font-weight:800;
    line-height:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(255,48,79,.35);
    pointer-events:none;
    transform:scale(1);
    transition:
        transform .2s ease,
        opacity .2s ease;
}

.notification-badge.hidden{
    opacity:0;
    transform:scale(.5);
}

.notification-badge.bump{
    animation:badgeBump .35s ease;
}

@keyframes badgeBump{

    0%{
        transform:scale(.7);
    }

    55%{
        transform:scale(1.25);
    }

    100%{
        transform:scale(1);
    }

}

/* ============================================================
   MAIN
============================================================ */

.container{
    max-width:700px;
    margin:auto;
    padding:18px 16px 100px;
}

/* ============================================================
   STATUS
============================================================ */

.section-title{
    font-size:17px;
    font-weight:700;
    margin:20px 0 12px;
}

.status-row{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:5px;
}

.status-row::-webkit-scrollbar{
    display:none;
}

.status{
    min-width:66px;
    text-align:center;
    cursor:pointer;
}

.status-img{
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid #21d4fd;
    padding:2px;
    margin:auto;
    background:#101722;
}

.status-img img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

.status-name{
    margin-top:6px;
    font-size:11px;
    color:#aeb7c5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ============================================================
   CONNECTIONS
============================================================ */

.connections{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.connection-card{
    background:#0b1119;
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:13px;
}

.connection-dp{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#18212d;
}

.connection-info{
    flex:1;
    min-width:0;
}

.connection-name{
    font-size:15px;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.connection-id{
    font-size:12px;
    color:#758194;
    margin-top:4px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* ============================================================
   CAMERA
============================================================ */

.camera-btn{
    position:fixed;
    right:20px;
    bottom:78px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:linear-gradient(145deg,#21d4fd,#1677ff);
    color:#fff;
    font-size:24px;
    box-shadow:0 8px 25px rgba(20,140,255,.30);
    cursor:pointer;
    z-index:90;
}

.camera-btn:active{
    transform:scale(.92);
}

/* ============================================================
   BOTTOM NAV
============================================================ */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:rgba(7,11,17,.97);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:80;
}

.nav-item{
    color:#778294;
    font-size:11px;
    text-align:center;
    cursor:pointer;
}

.nav-icon{
    font-size:20px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#fff;
}

.plus-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:500;
}

/* ============================================================
   EMPTY / LOADING
============================================================ */

.loading{
    text-align:center;
    color:#707b8b;
    padding:30px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#687486;
    padding:30px 10px;
    font-size:13px;
}

/* ============================================================
   TOAST
============================================================ */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#121a24;
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

    .header{
        height:68px;
        padding:0 10px;
        gap:8px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        margin-left:6px;
        font-size:16px;
    }

    .header-search{
        height:40px;
        padding:0 11px;
    }

    .header-search-icon{
        font-size:19px;
        margin-right:6px;
    }

    .header-search-text{
        font-size:13px;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        width:37px;
        height:37px;
        font-size:17px;
    }

}

@media(max-width:390px){

    .logo-name{
        display:none;
    }

    .header{
        gap:7px;
    }

    .header-search{
        height:39px;
    }

    .header-search-text{
        font-size:12px;
    }

    .header-btn{
        width:36px;
        height:36px;
    }

}

</style>
</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

    <!-- Usanex Logo -->

    <div class="brand">

        <div class="logo-mark">

            <span class="logo-u">
                U
            </span>

            <span class="logo-shine"></span>

        </div>

        <div class="logo-name">
            Usanex
        </div>

    </div>


    <!-- Search -->

    <div
        class="header-search"
        onclick="openSearch()"
    >

        <span class="header-search-icon">
            ⌕
        </span>

        <span class="header-search-text">
            Search
        </span>

    </div>


    <!-- Header Actions -->

    <div class="header-actions">

        <!-- Notification -->

        <div class="notification-wrap">

            <button
                class="header-btn"
                onclick="openNotifications()"
                aria-label="Notifications"
            >
                🔔
            </button>

            <div
                id="notificationBadge"
                class="notification-badge hidden"
            >
                0
            </div>

        </div>


        <!-- Menu -->

        <button
            class="header-btn"
            onclick="openMenu()"
            aria-label="Menu"
        >
            ☰
        </button>

    </div>

</header>



<!-- ============================================================
     MAIN
============================================================ -->

<main class="container">


    <!-- Status -->

    <div class="section-title">
        Status
    </div>

    <div
        id="statusRow"
        class="status-row"
    ></div>


    <!-- Connections -->

    <div class="section-title">
        Connections
    </div>

    <div
        id="connections"
        class="connections"
    >

        <div class="loading">
            Loading connections...
        </div>

    </div>

</main>



<!-- ============================================================
     CAMERA
============================================================ -->

<button
    class="camera-btn"
    onclick="openCamera()"
>
    📷
</button>



<!-- ============================================================
     BOTTOM NAV
============================================================ -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        onclick="goHome()"
    >

        <div class="nav-icon">
            ⌂
        </div>

        Home

    </div>


    <div
        class="nav-item"
        onclick="openReels()"
    >

        <div class="nav-icon">
            ▶
        </div>

        Reels

    </div>


    <div
        class="plus-btn"
        onclick="createPost()"
    >
        +
    </div>


    <div
        class="nav-item"
        onclick="openCollections()"
    >

        <div class="nav-icon">
            ▣
        </div>

        Coll

    </div>


    <div
        class="nav-item"
        onclick="openProfile()"
    >

        <div class="nav-icon">
            ◉
        </div>

        Profile

    </div>

</nav>



<!-- ============================================================
     TOAST
============================================================ -->

<div
    id="toast"
    class="toast"
></div>



<script>

/* ============================================================
   USER
============================================================ */

function getCurrentUser(){

    try{

        const user =
            JSON.parse(
                localStorage.getItem("user") || "null"
            );

        return user;

    }catch(error){

        return null;

    }

}


/* ============================================================
   NAVIGATION
============================================================ */

function openSearch(){

    window.location.href = "/search";

}


function openNotifications(){

    window.location.href = "/notifications";

}


function openMenu(){

    alert("Menu");

}


function openCamera(){

    alert("Camera");

}


function goHome(){

    window.location.href = "/home";

}


function openReels(){

    alert("Reels");

}


function createPost(){

    alert("Create Post");

}


function openCollections(){

    alert("Collections");

}


function openProfile(){

    alert("Profile");

}


/* ============================================================
   TOAST
============================================================ */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast){

        return;

    }

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove("show");

            },
            2500
        );

}


/* ============================================================
   NOTIFICATION COUNT
============================================================ */

let lastNotificationCount = 0;


function setNotificationBadge(
    count,
    animate = false
){

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if(!badge){

        return;

    }

    count =
        Number(count) || 0;


    if(count <= 0){

        badge.textContent = "0";

        badge.classList.add("hidden");

        lastNotificationCount = 0;

        return;

    }


    badge.classList.remove("hidden");


    if(count > 99){

        badge.textContent = "99+";

    }else{

        badge.textContent =
            String(count);

    }


    if(
        animate &&
        count !== lastNotificationCount
    ){

        badge.classList.remove("bump");

        void badge.offsetWidth;

        badge.classList.add("bump");

    }


    lastNotificationCount = count;

}


async function loadNotificationCount(){

    const user =
        getCurrentUser();


    if(
        !user ||
        !user.user_id
    ){

        setNotificationBadge(0);

        return;

    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    user.user_id
                ),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        if(!data.ok){

            return;

        }


        const notifications =
            Array.isArray(
                data.notifications
            )
            ? data.notifications
            : [];


        const unreadCount =
            notifications.filter(
                function(notification){

                    return !notification.is_read;

                }
            ).length;


        setNotificationBadge(
            unreadCount,
            true
        );


    }catch(error){

        console.log(
            "Notification count error:",
            error
        );

    }

}


/* ============================================================
   REALTIME NOTIFICATIONS
============================================================ */

let notificationSocket = null;
let reconnectTimer = null;


function connectNotificationSocket(){

    const user =
        getCurrentUser();


    if(
        !user ||
        !user.user_id
    ){

        return;

    }


    try{

        const protocol =
            window.location.protocol === "https:"
                ? "wss:"
                : "ws:";


        /*
         * Backend endpoint:
         *
         * /ws/{user_id}
         *
         * NOT:
         *
         * /ws/notifications/{user_id}
         */

        const socketUrl =
            protocol +
            "//" +
            window.location.host +
            "/ws/" +
            encodeURIComponent(
                user.user_id
            );


        notificationSocket =
            new WebSocket(socketUrl);


        notificationSocket.onopen =
            function(){

                console.log(
                    "Notification realtime connected"
                );

                loadNotificationCount();

            };


        notificationSocket.onmessage =
            function(event){

                try{

                    const payload =
                        JSON.parse(
                            event.data
                        );


                    if(
                        payload.type ===
                        "notification"
                    ){

                        loadNotificationCount();

                        /*
                         * Verification complete hone
                         * par Home connections refresh.
                         */

                        const notification =
                            payload.notification || {};


                        if(
                            notification.type ===
                            "connection_verified"
                        ){

                            loadConnections();

                            /*
                             * Agar user verification ke baad
                             * kisi aur page par hai to Home par
                             * bhej do.
                             */

                            if(
                                window.location.pathname !==
                                "/home"
                            ){

                                setTimeout(
                                    function(){

                                        window.location.href =
                                            "/home";

                                    },
                                    400
                                );

                            }

                        }

                    }


                }catch(error){

                    console.log(
                        "Realtime notification parse error:",
                        error
                    );

                }

            };


        notificationSocket.onerror =
            function(error){

                console.log(
                    "Notification socket error:",
                    error
                );

            };


        notificationSocket.onclose =
            function(){

                console.log(
                    "Notification realtime disconnected"
                );


                clearTimeout(
                    reconnectTimer
                );


                reconnectTimer =
                    setTimeout(
                        function(){

                            connectNotificationSocket();

                        },
                        5000
                    );

            };


    }catch(error){

        console.log(
            "WebSocket error:",
            error
        );


        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                function(){

                    connectNotificationSocket();

                },
                5000
            );

    }

}


/* ============================================================
   STATUS
============================================================ */

function loadStatuses(){

    const statusRow =
        document.getElementById(
            "statusRow"
        );


    if(!statusRow){

        return;

    }


    const demoStatuses = [

        {
            name:"Your Status",
            image:"https://i.pravatar.cc/100?img=12"
        },

        {
            name:"Friend",
            image:"https://i.pravatar.cc/100?img=13"
        },

        {
            name:"Someone",
            image:"https://i.pravatar.cc/100?img=14"
        },

        {
            name:"New",
            image:"https://i.pravatar.cc/100?img=15"
        }

    ];


    statusRow.innerHTML =
        demoStatuses.map(
            function(status){

                return `

                    <div class="status">

                        <div class="status-img">

                            <img
                                src="${status.image}"
                                alt=""
                                onerror="
                                    this.style.display='none'
                                "
                            >

                        </div>

                        <div class="status-name">
                            ${status.name}
                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* ============================================================
   CONNECTIONS
============================================================ */

async function loadConnections(){

    const container =
        document.getElementById(
            "connections"
        );


    if(!container){

        return;

    }


    const currentUser =
        getCurrentUser();


    if(
        !currentUser ||
        !currentUser.user_id
    ){

        container.innerHTML = `

            <div class="empty">
                Please login again.
            </div>

        `;

        return;

    }


    try{

        /*
         * Backend ko current user ID deni zaroori hai.
         */

        const response =
            await fetch(
                "/api/home/connections?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Failed to load connections"
            );

        }


        const data =
            await response.json();


        /*
         * Backend response:
         *
         * {
         *   ok:true,
         *   users:[...]
         * }
         */

        const connections =
            Array.isArray(data.users)
                ? data.users
                : [];


        if(connections.length === 0){

            container.innerHTML = `

                <div class="empty">
                    No connections yet.
                </div>

            `;

            return;

        }


        container.innerHTML =
            connections.map(
                function(user){

                    const photo =
                        user.profile_photo ||
                        "https://i.pravatar.cc/100";


                    const name =
                        user.name ||
                        user.user_id ||
                        "User";


                    const userId =
                        user.user_id ||
                        "";


                    return `

                        <div class="connection-card">

                            <img
                                class="connection-dp"
                                src="${photo}"
                                alt=""
                                onerror="
                                    this.src='https://i.pravatar.cc/100'
                                "
                            >

                            <div class="connection-info">

                                <div class="connection-name">
                                    ${name}
                                </div>

                                <div class="connection-id">
                                    ${userId}
                                </div>

                            </div>

                        </div>

                    `;

                }
            ).join("");


    }catch(error){

        console.log(
            "Connections error:",
            error
        );


        container.innerHTML = `

            <div class="empty">
                Unable to load connections.
            </div>

        `;

    }

}


/* ============================================================
   PAGE VISIBILITY
============================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            loadNotificationCount();

            loadConnections();

        }

    }
);


/* ============================================================
   FALLBACK REFRESH
============================================================ */

setInterval(
    function(){

        loadNotificationCount();

        loadConnections();

    },
    30000
);


/* ============================================================
   START
============================================================ */

loadStatuses();

loadConnections();

loadNotificationCount();

connectNotificationSocket();

</script>

</body>
</html>
