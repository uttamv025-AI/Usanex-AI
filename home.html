<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usanex AI - Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#05080d;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    height:70px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,13,.96);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#21d4fd;
}

.header-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.header-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.10);
    background:#0c121a;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:.2s;
}

.header-btn:active{
    transform:scale(.92);
}

.header-btn:hover{
    background:#121b27;
}

/* ================= NOTIFICATION BADGE ================= */

.notification-wrap{
    position:relative;
    display:flex;
}

.notification-badge{
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:#ff304f;
    color:#fff;
    border:2px solid #05080d;
    font-size:10px;
    font-weight:800;
    line-height:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(255,48,79,.35);
    pointer-events:none;
    transform:scale(1);
    transition:
        transform .2s ease,
        opacity .2s ease;
}

.notification-badge.hidden{
    opacity:0;
    transform:scale(.5);
}

.notification-badge.bump{
    animation:badgeBump .35s ease;
}

@keyframes badgeBump{
    0%{
        transform:scale(.7);
    }
    55%{
        transform:scale(1.25);
    }
    100%{
        transform:scale(1);
    }
}

/* ================= MAIN ================= */

.container{
    max-width:700px;
    margin:auto;
    padding:18px 16px 100px;
}

/* ================= SEARCH ================= */

.search-box{
    background:#0c121a;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    margin-bottom:20px;
}

.search-icon{
    font-size:20px;
    opacity:.7;
}

.search-text{
    color:#8893a3;
    font-size:14px;
}

/* ================= STATUS ================= */

.section-title{
    font-size:17px;
    font-weight:700;
    margin:20px 0 12px;
}

.status-row{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:5px;
}

.status-row::-webkit-scrollbar{
    display:none;
}

.status{
    min-width:66px;
    text-align:center;
    cursor:pointer;
}

.status-img{
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid #21d4fd;
    padding:2px;
    margin:auto;
    background:#101722;
}

.status-img img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

.status-name{
    margin-top:6px;
    font-size:11px;
    color:#aeb7c5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= CONNECTIONS ================= */

.connections{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.connection-card{
    background:#0b1119;
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:13px;
}

.connection-dp{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#18212d;
}

.connection-info{
    flex:1;
}

.connection-name{
    font-size:15px;
    font-weight:700;
}

.connection-id{
    font-size:12px;
    color:#758194;
    margin-top:4px;
}

/* ================= CAMERA ================= */

.camera-btn{
    position:fixed;
    right:20px;
    bottom:78px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:linear-gradient(145deg,#21d4fd,#1677ff);
    color:#fff;
    font-size:24px;
    box-shadow:0 8px 25px rgba(20,140,255,.30);
    cursor:pointer;
    z-index:90;
}

.camera-btn:active{
    transform:scale(.92);
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:rgba(7,11,17,.97);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:80;
}

.nav-item{
    color:#778294;
    font-size:11px;
    text-align:center;
    cursor:pointer;
}

.nav-icon{
    font-size:20px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#fff;
}

.plus-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:500;
}

/* ================= EMPTY / LOADING ================= */

.loading{
    text-align:center;
    color:#707b8b;
    padding:30px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#687486;
    padding:30px 10px;
    font-size:13px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#121a24;
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        Usa<span>nex</span>
    </div>

    <div class="header-actions">

        <!-- Notification -->
        <div class="notification-wrap">

            <button
                class="header-btn"
                onclick="openNotifications()"
                aria-label="Notifications"
            >
                🔔
            </button>

            <div
                id="notificationBadge"
                class="notification-badge hidden"
            >
                0
            </div>

        </div>

        <!-- Menu -->
        <button
            class="header-btn"
            onclick="openMenu()"
            aria-label="Menu"
        >
            ☰
        </button>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

    <!-- Search -->

    <div
        class="search-box"
        onclick="openSearch()"
    >
        <div class="search-icon">🔍</div>
        <div class="search-text">
            Search by User ID or phone number
        </div>
    </div>


    <!-- Status -->

    <div class="section-title">
        Status
    </div>

    <div
        id="statusRow"
        class="status-row"
    ></div>


    <!-- Connections -->

    <div class="section-title">
        Connections
    </div>

    <div
        id="connections"
        class="connections"
    >
        <div class="loading">
            Loading connections...
        </div>
    </div>

</main>


<!-- Camera -->

<button
    class="camera-btn"
    onclick="openCamera()"
>
    📷
</button>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        onclick="goHome()"
    >
        <div class="nav-icon">⌂</div>
        Home
    </div>

    <div
        class="nav-item"
        onclick="openReels()"
    >
        <div class="nav-icon">▶</div>
        Reels
    </div>

    <div
        class="plus-btn"
        onclick="createPost()"
    >
        +
    </div>

    <div
        class="nav-item"
        onclick="openCollections()"
    >
        <div class="nav-icon">▣</div>
        Coll
    </div>

    <div
        class="nav-item"
        onclick="openProfile()"
    >
        <div class="nav-icon">◉</div>
        Profile
    </div>

</nav>


<div
    id="toast"
    class="toast"
></div>


<script>

/* ============================================================
   USER
============================================================ */

function getCurrentUser(){

    try{

        const user =
            JSON.parse(
                localStorage.getItem("user") || "null"
            );

        return user;

    }catch(e){

        return null;

    }

}


/* ============================================================
   NAVIGATION
============================================================ */

function openSearch(){

    window.location.href = "/search";

}


function openNotifications(){

    window.location.href = "/notifications";

}


function openMenu(){

    alert("Menu");

}


function openCamera(){

    alert("Camera");

}


function goHome(){

    window.location.href = "/home";

}


function openReels(){

    alert("Reels");

}


function createPost(){

    alert("Create Post");

}


function openCollections(){

    alert("Collections");

}


function openProfile(){

    alert("Profile");

}


/* ============================================================
   TOAST
============================================================ */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2500);

}


/* ============================================================
   NOTIFICATION COUNT
============================================================ */

let lastNotificationCount = 0;


function setNotificationBadge(count, animate = false){

    const badge =
        document.getElementById("notificationBadge");

    count = Number(count) || 0;

    if(count <= 0){

        badge.textContent = "0";

        badge.classList.add("hidden");

        return;

    }

    badge.classList.remove("hidden");

    if(count > 99){

        badge.textContent = "99+";

    }else{

        badge.textContent = String(count);

    }

    if(
        animate &&
        count !== lastNotificationCount
    ){

        badge.classList.remove("bump");

        void badge.offsetWidth;

        badge.classList.add("bump");

    }

    lastNotificationCount = count;

}


async function loadNotificationCount(){

    const user =
        getCurrentUser();

    if(
        !user ||
        !user.user_id
    ){

        setNotificationBadge(0);

        return;

    }

    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(user.user_id),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            return;

        }

        const data =
            await response.json();

        if(!data.ok){

            return;

        }

        const notifications =
            Array.isArray(data.notifications)
                ? data.notifications
                : [];

        const unreadCount =
            notifications.filter(
                notification =>
                    !notification.is_read
            ).length;

        setNotificationBadge(
            unreadCount,
            true
        );

    }catch(error){

        console.log(
            "Notification count error:",
            error
        );

    }

}


/* ============================================================
   REALTIME NOTIFICATIONS
============================================================ */

let notificationSocket = null;
let reconnectTimer = null;


function connectNotificationSocket(){

    const user =
        getCurrentUser();

    if(
        !user ||
        !user.user_id
    ){

        return;

    }

    try{

        const protocol =
            window.location.protocol === "https:"
                ? "wss:"
                : "ws:";

        const socketUrl =
            protocol +
            "//" +
            window.location.host +
            "/ws/notifications/" +
            encodeURIComponent(user.user_id);

        notificationSocket =
            new WebSocket(socketUrl);


        notificationSocket.onopen = function(){

            console.log(
                "Notification realtime connected"
            );

            loadNotificationCount();

        };


        notificationSocket.onmessage =
            function(event){

                try{

                    const payload =
                        JSON.parse(event.data);

                    /*
                       Backend notification format:

                       {
                           type:"notification",
                           notification:{...}
                       }
                    */

                    if(
                        payload.type ===
                        "notification"
                    ){

                        loadNotificationCount();

                    }

                }catch(error){

                    console.log(
                        "Realtime notification parse error:",
                        error
                    );

                }

            };


        notificationSocket.onerror =
            function(){

                console.log(
                    "Notification socket error"
                );

            };


        notificationSocket.onclose =
            function(){

                console.log(
                    "Notification realtime disconnected"
                );

                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer =
                    setTimeout(
                        connectNotificationSocket,
                        5000
                    );

            };

    }catch(error){

        console.log(
            "WebSocket error:",
            error
        );

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connectNotificationSocket,
                5000
            );

    }

}


/* ============================================================
   STATUS
============================================================ */

function loadStatuses(){

    const statusRow =
        document.getElementById("statusRow");

    const demoStatuses = [

        {
            name:"Your Status",
            image:"https://i.pravatar.cc/100?img=12"
        },

        {
            name:"Friend",
            image:"https://i.pravatar.cc/100?img=13"
        },

        {
            name:"Someone",
            image:"https://i.pravatar.cc/100?img=14"
        },

        {
            name:"New",
            image:"https://i.pravatar.cc/100?img=15"
        }

    ];


    statusRow.innerHTML =
        demoStatuses.map(
            status => `

                <div class="status">

                    <div class="status-img">

                        <img
                            src="${status.image}"
                            alt=""
                        >

                    </div>

                    <div class="status-name">
                        ${status.name}
                    </div>

                </div>

            `
        ).join("");

}


/* ============================================================
   CONNECTIONS
============================================================ */

async function loadConnections(){

    const container =
        document.getElementById(
            "connections"
        );

    try{

        const response =
            await fetch(
                "/api/home/connections",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Failed to load connections"
            );

        }

        const data =
            await response.json();

        const connections =
            Array.isArray(data.connections)
                ? data.connections
                : [];


        if(connections.length === 0){

            container.innerHTML = `

                <div class="empty">

                    No connections yet.

                </div>

            `;

            return;

        }


        container.innerHTML =
            connections.map(
                user => `

                    <div class="connection-card">

                        <img
                            class="connection-dp"
                            src="${
                                user.profile_photo ||
                                "https://i.pravatar.cc/100"
                            }"
                            alt=""
                            onerror="
                                this.src='https://i.pravatar.cc/100'
                            "
                        >

                        <div class="connection-info">

                            <div class="connection-name">

                                ${
                                    user.name ||
                                    user.user_id ||
                                    "User"
                                }

                            </div>

                            <div class="connection-id">

                                ${
                                    user.user_id ||
                                    ""
                                }

                            </div>

                        </div>

                    </div>

                `
            ).join("");


    }catch(error){

        console.log(
            "Connections error:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                Unable to load connections.

            </div>

        `;

    }

}


/* ============================================================
   PAGE VISIBILITY / FALLBACK REFRESH
============================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            loadNotificationCount();

        }

    }
);


/*
   WebSocket realtime ke saath
   30 second fallback bhi rakha hai.
*/

setInterval(
    loadNotificationCount,
    30000
);


/* ============================================================
   START
============================================================ */

loadStatuses();

loadConnections();

loadNotificationCount();

connectNotificationSocket();

</script>

</body>
</html>
