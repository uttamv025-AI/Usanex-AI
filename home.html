<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Usanex</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    min-height:100vh;
    padding-bottom:95px;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}

/* ================= HEADER ================= */

.header{
    height:82px;
    padding:0 18px;
    display:flex;
    align-items:center;
    gap:12px;

    background:rgba(7,9,13,.90);
    border-bottom:1px solid rgba(255,255,255,.07);

    position:sticky;
    top:0;
    z-index:30;

    backdrop-filter:blur(18px);
}

/* LOGO */

.logo-mark{
    width:43px;
    height:43px;
    flex-shrink:0;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:25px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:11px;
    bottom:6px;
}

.logo-name{
    font-size:21px;
    font-weight:800;
    letter-spacing:-.5px;
}

/* ================= SEARCH ================= */

.search-box{
    flex:1;
    min-width:0;

    height:46px;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-radius:24px;

    background:#151820;

    border:1px solid
        rgba(255,255,255,.08);

    cursor:pointer;

    transition:.18s;
}

.search-box:active{
    transform:scale(.98);
}

.search-icon{
    font-size:20px;
    color:#8993a5;
    margin-right:9px;
}

.search-placeholder{
    color:#747d8d;
    font-size:14px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= CONTENT ================= */

.content{
    padding:20px 18px 30px;
}

/* ================= STATUS ================= */

.status-section{
    margin-bottom:25px;
}

.section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:14px;
}

.status-row{
    display:flex;
    gap:15px;

    overflow-x:auto;

    padding:3px 2px 8px;

    scrollbar-width:none;
}

.status-row::-webkit-scrollbar{
    display:none;
}

.status-item{
    min-width:66px;
    text-align:center;
    cursor:pointer;
}

.status-circle{
    width:58px;
    height:58px;

    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    border:2px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 5px 18px
        rgba(15,105,235,.25);

    overflow:hidden;
}

.status-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

.status-plus{
    position:absolute;

    right:-1px;
    bottom:-1px;

    width:21px;
    height:21px;

    border-radius:50%;

    background:#1681ff;

    border:2px solid #07090d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:900;
}

.status-name{
    margin-top:7px;
    font-size:11px;
    color:#9ba4b3;
}

/* ================= CONNECTED ================= */

.connected-section{
    margin-top:5px;
}

.connected-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.user-card{
    min-height:78px;

    display:flex;
    align-items:center;

    padding:12px 13px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);
}

/* AVATAR */

.user-dp{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    font-size:20px;
    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:2px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);
}

.user-dp img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}

.user-info{
    flex:1;
    min-width:0;

    margin-left:12px;
}

.user-name{
    font-size:15px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-id{
    margin-top:5px;

    font-size:11px;

    color:#818a9a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CONNECTED BUTTON */

.connected-btn{
    min-width:86px;
    height:36px;

    padding:0 13px;

    border:0;
    border-radius:12px;

    background:#252b36;

    color:#75e0a2;

    font-size:12px;
    font-weight:700;

    cursor:default;

    opacity:1;
}

.connected-btn:disabled{
    opacity:1;
}

/* ================= EMPTY ================= */

.empty-state{
    display:none;

    text-align:center;

    padding:45px 20px;

    color:#7f8898;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty-title{
    font-size:16px;
    font-weight:700;
    color:#cbd1db;
    margin-bottom:6px;
}

.empty-text{
    font-size:12px;
    line-height:1.5;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:
        7px 8px
        calc(7px + env(safe-area-inset-bottom));

    background:
        rgba(10,13,19,.96);

    border-top:1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(22px);

    z-index:100;
}

/* normal nav */

.nav-item{
    width:20%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    color:#7f8898;

    cursor:pointer;

    position:relative;

    transition:.18s;
}

.nav-item:active{
    transform:scale(.90);
}

.nav-item.active{
    color:#3296ff;
}

.nav-icon{
    font-size:24px;
    line-height:1;
}

/* PLUS */

.plus-nav{
    width:20%;
    height:62px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;

    transition:.18s;
}

.plus-nav:active{
    transform:scale(.90);
}

.plus-button{
    width:53px;
    height:53px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;

    font-size:31px;
    font-weight:400;

    box-shadow:
        0 8px 25px
        rgba(18,105,232,.42);

    border:1px solid
        rgba(255,255,255,.13);
}

/* ================= NOTIFICATION BADGE ================= */

.notification-badge{
    position:absolute;

    top:7px;
    right:18px;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:10px;

    background:#ff3b5c;

    border:2px solid #0a0d13;

    color:#fff;

    font-size:9px;
    font-weight:800;

    display:flex;
    align-items:center;
    justify-content:center;
}

.notification-badge.hidden{
    display:none;
}

/* ================= TOAST ================= */

.status-popup{
    position:fixed;

    left:50%;
    bottom:94px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:700;
}

.status-popup.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= LOADING ================= */

.loading{
    text-align:center;

    padding:35px 0;

    color:#727b8b;

    font-size:13px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:360px){

    .header{
        padding:0 12px;
        gap:8px;
    }

    .logo-name{
        font-size:18px;
    }

    .logo-mark{
        width:40px;
        height:40px;
    }

    .content{
        padding-left:13px;
        padding-right:13px;
    }

    .user-card{
        padding:10px;
    }

    .connected-btn{
        min-width:78px;
        padding:0 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo-mark">
            <span class="logo-u">U</span>
            <span class="logo-shine"></span>
        </div>

        <div class="logo-name">
            Usanex
        </div>

        <!-- SEARCH BOX -->
        <div
            class="search-box"
            id="searchBox"
            role="button"
            tabindex="0"
        >
            <span class="search-icon">⌕</span>

            <span class="search-placeholder">
                Search people...
            </span>
        </div>

    </header>


    <!-- ================= CONTENT ================= -->

    <main class="content">

        <!-- STATUS -->

        <section class="status-section">

            <div class="section-title">
                Status
            </div>

            <div class="status-row">

                <div
                    class="status-item"
                    id="yourStatus"
                >

                    <div class="status-circle">

                        <span id="yourStatusInitial">
                            U
                        </span>

                        <img
                            id="yourStatusImage"
                            style="display:none;"
                            alt=""
                        >

                        <span class="status-plus">
                            +
                        </span>

                    </div>

                    <div class="status-name">
                        You
                    </div>

                </div>

            </div>

        </section>


        <!-- CONNECTED PEOPLE -->

        <section class="connected-section">

            <div class="section-title">
                Connected People
            </div>

            <div
                class="connected-list"
                id="connectedList"
            >

                <div
                    class="loading"
                    id="loading"
                >
                    Loading...
                </div>

            </div>

            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-icon">
                    👥
                </div>

                <div class="empty-title">
                    No connections yet
                </div>

                <div class="empty-text">
                    Your connected people will appear here.
                </div>

            </div>

        </section>

    </main>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <!-- HOME -->

    <div
        class="nav-item active"
        id="homeNav"
        title="Home"
    >
        <div class="nav-icon">
            🏠
        </div>
    </div>


    <!-- REEL -->

    <div
        class="nav-item"
        id="reelNav"
        title="Reel"
    >
        <div class="nav-icon">
            ▶
        </div>
    </div>


    <!-- PLUS -->

    <div
        class="plus-nav"
        id="plusNav"
        title="Create"
    >
        <div class="plus-button">
            +
        </div>
    </div>


    <!-- NOTIFICATION -->

    <div
        class="nav-item"
        id="notificationNav"
        title="Notifications"
    >

        <div class="nav-icon">
            🔔
        </div>

        <span
            class="notification-badge hidden"
            id="notificationBadge"
        >
            0
        </span>

    </div>


    <!-- PROFILE -->

    <div
        class="nav-item"
        id="profileNav"
        title="Profile"
    >
        <div class="nav-icon">
            👤
        </div>
    </div>

</nav>


<!-- ================= TOAST ================= -->

<div
    class="status-popup"
    id="statusPopup"
></div>


<script>

/* ============================================================
   USANEX HOME
============================================================ */

let currentUser = null;


/* ================= BASIC HELPERS ================= */

function showToast(message){

    const popup =
        document.getElementById("statusPopup");

    popup.textContent = message;

    popup.classList.add("show");

    setTimeout(function(){

        popup.classList.remove("show");

    },2200);
}


/* ================= CURRENT USER ================= */

async function loadCurrentUser(){

    try{

        const saved =
            localStorage.getItem("usanex_user");

        if(saved){

            try{

                currentUser =
                    JSON.parse(saved);

            }catch(e){

                currentUser = null;

            }

        }

        /*
         * If your backend already exposes
         * /api/me, it can be loaded here.
         */

        if(
            !currentUser ||
            !currentUser.user_id
        ){

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const userId =
                params.get("user_id");

            if(userId){

                currentUser = {
                    user_id:userId
                };

            }

        }

        updateYourStatus();

        await loadConnections();

        await loadNotificationCount();

    }catch(error){

        console.error(
            "User loading error:",
            error
        );

        await loadConnections();

    }

}


/* ================= STATUS ================= */

function updateYourStatus(){

    const initial =
        document.getElementById(
            "yourStatusInitial"
        );

    const image =
        document.getElementById(
            "yourStatusImage"
        );

    if(!currentUser){

        initial.textContent = "U";

        image.style.display = "none";

        initial.style.display = "block";

        return;

    }

    const name =
        currentUser.name ||
        currentUser.username ||
        "U";

    initial.textContent =
        name
            .trim()
            .charAt(0)
            .toUpperCase() || "U";

    const photo =
        currentUser.profile_photo ||
        currentUser.profile_picture ||
        currentUser.avatar ||
        currentUser.photo ||
        currentUser.profile_image ||
        "";

    if(photo){

        image.src = photo;

        image.style.display = "block";

        initial.style.display = "none";

    }else{

        image.style.display = "none";

        initial.style.display = "block";

    }

}


/* ================= CONNECTIONS ================= */

async function loadConnections(){

    const list =
        document.getElementById(
            "connectedList"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    if(!currentUser ||
       !currentUser.user_id){

        if(loading){

            loading.style.display =
                "none";

        }

        /*
         * Keep UI usable even when
         * current user is not available.
         */

        empty.style.display =
            "block";

        return;

    }

    try{

        const response =
            await fetch(
                "/api/connections?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Connections API returned " +
                response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "Connections:",
            data
        );

        let people = [];

        if(Array.isArray(data)){

            people = data;

        }else if(
            Array.isArray(data.connections)
        ){

            people =
                data.connections;

        }else if(
            Array.isArray(data.users)
        ){

            people =
                data.users;

        }else if(
            Array.isArray(data.data)
        ){

            people =
                data.data;

        }

        list.innerHTML = "";

        if(
            !people.length
        ){

            empty.style.display =
                "block";

            return;

        }

        empty.style.display =
            "none";

        people.forEach(
            function(person){

                renderConnectedPerson(
                    person
                );

            }
        );

    }catch(error){

        console.error(
            "Connection loading failed:",
            error
        );

        list.innerHTML = "";

        /*
         * Do not show Follow here.
         * Connected people stay connected.
         */

        empty.style.display =
            "block";

    }

}


/* ================= RENDER PERSON ================= */

function renderConnectedPerson(person){

    const list =
        document.getElementById(
            "connectedList"
        );

    const card =
        document.createElement("div");

    card.className =
        "user-card";


    /* ---------- PHOTO ---------- */

    const dp =
        document.createElement("div");

    dp.className =
        "user-dp";


    const photo =
        person.profile_photo ||
        person.profile_picture ||
        person.avatar ||
        person.photo ||
        person.profile_image ||
        "";


    const name =
        person.name ||
        person.display_name ||
        person.username ||
        "User";


    const userId =
        person.user_id ||
        person.username ||
        person.id ||
        "";


    if(photo){

        const img =
            document.createElement("img");

        img.src = photo;

        img.alt = name;

        img.onerror =
            function(){

                img.remove();

                dp.textContent =
                    name
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "U";

            };

        dp.appendChild(img);

    }else{

        dp.textContent =
            name
                .trim()
                .charAt(0)
                .toUpperCase() ||
            "U";

    }


    /* ---------- INFO ---------- */

    const info =
        document.createElement("div");

    info.className =
        "user-info";


    const nameEl =
        document.createElement("div");

    nameEl.className =
        "user-name";

    nameEl.textContent =
        name;


    const idEl =
        document.createElement("div");

    idEl.className =
        "user-id";

    idEl.textContent =
        userId;


    info.appendChild(nameEl);

    info.appendChild(idEl);


    /* ---------- CONNECTED ---------- */

    const button =
        document.createElement("button");

    button.className =
        "connected-btn";

    button.type =
        "button";

    button.textContent =
        "Connected";

    button.disabled =
        true;

    button.tabIndex =
        -1;


    /*
     * IMPORTANT:
     *
     * There is intentionally
     * NO card click event.
     *
     * There is intentionally
     * NO Follow button logic.
     *
     * Connected means connected.
     */


    card.appendChild(dp);

    card.appendChild(info);

    card.appendChild(button);

    list.appendChild(card);

}


/* ================= NOTIFICATIONS ================= */

async function loadNotificationCount(){

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        badge.classList.add(
            "hidden"
        );

        return;

    }

    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Notification API " +
                response.status
            );

        }

        const data =
            await response.json();

        let count = 0;

        if(
            typeof data.unread_count ===
            "number"
        ){

            count =
                data.unread_count;

        }else if(
            typeof data.count ===
            "number"
        ){

            count =
                data.count;

        }else if(
            Array.isArray(
                data.notifications
            )
        ){

            count =
                data.notifications.filter(
                    function(item){

                        return (
                            item.is_read === false ||
                            item.read === false
                        );

                    }
                ).length;

        }else if(
            Array.isArray(data)
        ){

            count =
                data.filter(
                    function(item){

                        return (
                            item.is_read === false ||
                            item.read === false
                        );

                    }
                ).length;

        }

        if(count > 0){

            badge.textContent =
                count > 99
                    ? "99+"
                    : String(count);

            badge.classList.remove(
                "hidden"
            );

        }else{

            badge.classList.add(
                "hidden"
            );

        }

    }catch(error){

        console.log(
            "Notification count unavailable"
        );

        badge.classList.add(
            "hidden"
        );

    }

}


/* ================= SEARCH ================= */

document
    .getElementById("searchBox")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "/search";

        }
    );


document
    .getElementById("searchBox")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                window.location.href =
                    "/search";

            }

        }
    );


/* ================= HOME ================= */

document
    .getElementById("homeNav")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "/home";

        }
    );


/* ================= REEL ================= */

document
    .getElementById("reelNav")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "/reels";

        }
    );


/* ================= PLUS ================= */

document
    .getElementById("plusNav")
    .addEventListener(
        "click",
        function(){

            showToast(
                "Create feature coming soon"
            );

        }
    );


/* ================= NOTIFICATION ================= */

document
    .getElementById("notificationNav")
    .addEventListener(
        "click",
        async function(){

            if(
                !currentUser ||
                !currentUser.user_id
            ){

                window.location.href =
                    "/notifications";

                return;

            }

            window.location.href =
                "/notifications";

        }
    );


/* ================= PROFILE ================= */

document
    .getElementById("profileNav")
    .addEventListener(
        "click",
        function(){

            if(
                currentUser &&
                currentUser.user_id
            ){

                window.location.href =
                    "/search?user_id=" +
                    encodeURIComponent(
                        currentUser.user_id
                    );

            }else{

                window.location.href =
                    "/search";

            }

        }
    );


/* ================= STATUS ================= */

document
    .getElementById("yourStatus")
    .addEventListener(
        "click",
        function(){

            showToast(
                "Status feature coming soon"
            );

        }
    );


/* ================= PERIODIC REFRESH ================= */

setInterval(
    function(){

        loadNotificationCount();

    },
    30000
);


/* ================= START ================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadCurrentUser();

    }
);

</script>
