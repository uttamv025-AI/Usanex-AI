<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search • Usanex</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#05070b;
    color:#fff;
}

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    padding-bottom:90px;

    background:
    radial-gradient(
        circle at top,
        #141b2b 0%,
        #080b12 38%,
        #05070b 75%
    );
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:68px;

    display:flex;
    align-items:center;

    padding:0 17px;

    position:sticky;
    top:0;
    z-index:20;

    background:rgba(5,7,11,.90);

    border-bottom:
    1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(20px);
}

.back-btn{
    width:40px;
    height:40px;

    border-radius:13px;

    border:
    1px solid rgba(255,255,255,.09);

    background:#101520;

    color:#fff;

    font-size:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.back-btn:active{
    transform:scale(.90);
}


/* =====================================================
   USANEX BRAND
===================================================== */

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    margin-left:12px;
}

.brand-logo{
    width:36px;
    height:36px;

    border-radius:11px;

    background:
    linear-gradient(
        135deg,
        #ffffff 0%,
        #e5e8ee 42%,
        #9ba5b7 100%
    );

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    box-shadow:
    0 5px 22px rgba(255,255,255,.10);
}

.brand-logo::before{
    content:"U";

    color:#05070b;

    font-size:21px;
    font-weight:950;

    position:relative;
    z-index:2;

    letter-spacing:-2px;
}

.brand-logo::after{
    content:"";

    position:absolute;

    width:20px;
    height:55px;

    left:-30px;
    top:-10px;

    transform:rotate(30deg);

    background:
    linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.75),
        transparent
    );

    animation:logoShine 4s infinite;
}

@keyframes logoShine{

    0%{
        left:-35px;
    }

    30%,100%{
        left:48px;
    }

}

.brand-name{
    font-size:20px;
    font-weight:850;
}


/* =====================================================
   SEARCH
===================================================== */

.search-area{
    padding:25px 17px 10px;
}

.page-title{
    font-size:28px;
    font-weight:850;

    margin-bottom:6px;
}

.page-subtitle{
    color:#7f899b;

    font-size:13px;

    margin-bottom:18px;
}

.search-box{
    height:55px;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-radius:17px;

    background:
    rgba(18,24,35,.90);

    border:
    1px solid rgba(255,255,255,.08);

    transition:.2s;
}

.search-box:focus-within{
    border-color:
    rgba(255,255,255,.23);

    box-shadow:
    0 12px 40px rgba(0,0,0,.38);
}

.search-icon{
    font-size:19px;
    color:#8993a5;
    margin-right:10px;
}

#searchInput{
    width:100%;

    border:none;
    outline:none;

    background:transparent;

    color:#fff;

    font-size:15px;
}

#searchInput::placeholder{
    color:#697386;
}

.clear-btn{
    width:30px;
    height:30px;

    border:none;
    border-radius:50%;

    background:#202735;

    color:#b8c0cf;

    font-size:17px;

    cursor:pointer;

    display:none;
}


/* =====================================================
   RESULTS
===================================================== */

.results-area{
    padding:10px 17px;
}

.result-heading{
    color:#737d90;

    font-size:11px;

    font-weight:800;

    letter-spacing:1.2px;

    margin:8px 3px 12px;

    display:none;
}

.results{
    display:flex;
    flex-direction:column;
    gap:10px;
}


/* =====================================================
   USER CARD
===================================================== */

.user-card{
    min-height:78px;

    display:flex;
    align-items:center;

    padding:12px;

    border-radius:19px;

    background:
    linear-gradient(
        135deg,
        rgba(20,27,39,.97),
        rgba(12,17,26,.97)
    );

    border:
    1px solid rgba(255,255,255,.07);

    box-shadow:
    0 10px 30px rgba(0,0,0,.22);

    animation:cardIn .25s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   AVATAR
===================================================== */

.avatar{
    width:53px;
    height:53px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    position:relative;

    background:
    linear-gradient(
        135deg,
        #293348,
        #101520
    );

    border:
    2px solid rgba(255,255,255,.11);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e1e6ef;

    font-size:20px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.avatar:active{
    transform:scale(.92);
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}


/* =====================================================
   USER DETAILS
===================================================== */

.user-details{
    flex:1;

    min-width:0;

    margin-left:12px;

    overflow:hidden;
}

.user-name{
    color:#fff;

    font-size:16px;

    font-weight:750;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    cursor:pointer;
}

.user-name:active{
    opacity:.65;
}

.user-id{
    margin-top:5px;

    color:#7f899b;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   FOLLOW
===================================================== */

.follow-btn{
    height:38px;

    min-width:78px;

    padding:0 14px;

    border:none;

    border-radius:12px;

    background:#fff;

    color:#05070b;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    flex-shrink:0;

    transition:.2s;
}

.follow-btn:active{
    transform:scale(.93);
}

.follow-btn.sent{
    background:#202735;

    color:#b7c0cf;

    border:
    1px solid rgba(255,255,255,.08);

    cursor:pointer;
}


/* =====================================================
   OWN ACCOUNT
===================================================== */

.own-card{
    padding:16px;

    border-radius:19px;

    background:
    linear-gradient(
        135deg,
        rgba(35,42,57,.96),
        rgba(16,21,32,.96)
    );

    border:
    1px solid rgba(255,255,255,.10);

    box-shadow:
    0 10px 30px rgba(0,0,0,.22);

    animation:cardIn .25s ease;
}

.own-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.own-icon{
    width:46px;
    height:46px;

    flex-shrink:0;

    border-radius:14px;

    background:#fff;

    color:#05070b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
    font-weight:900;
}

.own-title{
    font-size:15px;
    font-weight:800;

    margin-bottom:5px;
}

.own-text{
    color:#8993a5;

    font-size:12px;
}

.own-id{
    margin-top:13px;

    padding:11px 13px;

    border-radius:11px;

    background:
    rgba(255,255,255,.05);

    color:#dbe1eb;

    font-size:13px;

    font-weight:700;
}


/* =====================================================
   STATUS BOX
===================================================== */

.status-box{
    position:fixed;

    left:50%;
    bottom:88px;

    transform:
    translate(-50%,15px);

    width:calc(100% - 34px);

    max-width:430px;

    padding:12px 16px;

    border-radius:14px;

    background:
    rgba(24,29,40,.97);

    border:
    1px solid rgba(255,255,255,.10);

    box-shadow:
    0 15px 45px rgba(0,0,0,.45);

    color:#e7ebf2;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.status-box.show{
    opacity:1;

    transform:
    translate(-50%,0);
}


/* =====================================================
   DP MODAL
===================================================== */

.dp-modal{
    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.88);

    backdrop-filter:blur(12px);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:200;

    padding:25px;
}

.dp-modal.show{
    display:flex;
}

.dp-container{
    position:relative;

    width:min(82vw,390px);
    height:min(82vw,390px);

    border-radius:50%;

    overflow:hidden;

    background:#101520;

    border:
    2px solid rgba(255,255,255,.14);

    box-shadow:
    0 20px 70px rgba(0,0,0,.7);

    animation:dpOpen .22s ease;
}

@keyframes dpOpen{

    from{
        opacity:0;
        transform:scale(.85);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.dp-container img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.dp-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#dfe5ef;

    font-size:100px;
    font-weight:800;
}

.dp-close{
    position:absolute;

    top:22px;
    right:22px;

    width:40px;
    height:40px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,.12);

    background:
    rgba(20,25,35,.90);

    color:#fff;

    font-size:22px;

    cursor:pointer;

    z-index:210;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    display:none;

    text-align:center;

    padding:65px 25px 40px;

    color:#737d90;
}

.empty-icon{
    width:66px;
    height:66px;

    margin:
    auto auto 17px;

    border-radius:20px;

    background:#101520;

    border:
    1px solid rgba(255,255,255,.07);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
}

.empty-title{
    color:#c7cedb;

    font-size:16px;

    font-weight:700;

    margin-bottom:7px;
}

.empty-text{
    font-size:13px;

    line-height:1.6;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    display:none;

    text-align:center;

    padding:35px 20px;

    color:#7f899b;

    font-size:13px;
}

.spinner{
    width:25px;
    height:25px;

    margin:
    0 auto 12px;

    border-radius:50%;

    border:
    2px solid #303848;

    border-top-color:#fff;

    animation:
    spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   ERROR
===================================================== */

.error{
    display:none;

    margin-top:15px;

    padding:13px 15px;

    border-radius:13px;

    background:
    rgba(120,30,30,.16);

    border:
    1px solid rgba(255,80,80,.12);

    color:#ff9b9b;

    font-size:13px;

    text-align:center;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:50%;

    transform:
    translateX(-50%);

    width:100%;
    max-width:600px;

    height:72px;

    background:
    rgba(7,9,14,.95);

    backdrop-filter:blur(20px);

    border-top:
    1px solid rgba(255,255,255,.08);

    display:flex;

    align-items:center;
    justify-content:space-around;

    z-index:30;
}

.nav-item{
    color:#687286;

    text-align:center;

    font-size:11px;

    cursor:pointer;

    min-width:55px;
}

.nav-icon{
    font-size:21px;

    margin-bottom:4px;
}

.nav-item.active{
    color:#fff;
}

.plus{
    width:48px;
    height:48px;

    margin:auto;

    border-radius:15px;

    background:#fff;

    color:#05070b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:420px){

    .page-title{
        font-size:25px;
    }

    .user-card{
        padding:10px;
    }

    .avatar{
        width:50px;
        height:50px;
    }

    .user-name{
        font-size:15px;
    }

    .follow-btn{
        min-width:72px;
        padding:0 11px;
        font-size:12px;
    }

    .brand-name{
        font-size:19px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">

    <button
        class="back-btn"
        onclick="goHome()"
    >
        ‹
    </button>


    <div class="brand">

        <div class="brand-logo"></div>

        <div class="brand-name">
            Usanex
        </div>

    </div>

</header>


<!-- ===================================================
     SEARCH AREA
=================================================== -->

<section class="search-area">

    <h1 class="page-title">
        Search
    </h1>

    <p class="page-subtitle">
        Find people using their User ID or phone number
    </p>


    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>


        <input
            id="searchInput"
            type="text"
            autocomplete="off"
            placeholder="User ID or phone number"
        >


        <button
            id="clearBtn"
            class="clear-btn"
            onclick="clearSearch()"
        >
            ×
        </button>

    </div>


    <div
        id="errorBox"
        class="error"
    ></div>

</section>


<!-- ===================================================
     RESULTS
=================================================== -->

<section class="results-area">

    <div
        id="resultHeading"
        class="result-heading"
    >
        PEOPLE
    </div>


    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        Searching...

    </div>


    <div
        id="results"
        class="results"
    ></div>


    <div
        id="empty"
        class="empty"
    >

        <div class="empty-icon">
            🔍
        </div>

        <div class="empty-title">
            No users found
        </div>

        <div class="empty-text">
            Try searching with a different
            User ID or phone number.
        </div>

    </div>

</section>


<!-- ===================================================
     BOTTOM NAV
=================================================== -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        onclick="goHome()"
    >

        <div class="nav-icon">
            ⌂
        </div>

        Home

    </div>


    <div class="nav-item">

        <div class="nav-icon">
            ▶
        </div>

        Reels

    </div>


    <div class="nav-item">

        <div class="plus">
            +
        </div>

    </div>


    <div class="nav-item">

        <div class="nav-icon">
            ▣
        </div>

        Coll

    </div>


    <div class="nav-item">

        <div class="nav-icon">
            ●
        </div>

        Profile

    </div>

</nav>

</div>


<!-- ===================================================
     STATUS BOX
=================================================== -->

<div
    id="statusBox"
    class="status-box"
></div>


<!-- ===================================================
     DP MODAL
=================================================== -->

<div
    id="dpModal"
    class="dp-modal"
    onclick="closeDp(event)"
>

    <button
        class="dp-close"
        onclick="closeDp()"
    >
        ×
    </button>


    <div
        id="dpContainer"
        class="dp-container"
    ></div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API =
    "https://usanex-ai.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
    document.getElementById("searchInput");

const results =
    document.getElementById("results");

const empty =
    document.getElementById("empty");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const resultHeading =
    document.getElementById("resultHeading");

const clearBtn =
    document.getElementById("clearBtn");

const statusBox =
    document.getElementById("statusBox");

const dpModal =
    document.getElementById("dpModal");

const dpContainer =
    document.getElementById("dpContainer");


let searchTimer = null;
let statusTimer = null;


/* =====================================================
   CURRENT USER
===================================================== */

function getCurrentUser(){

    const keys = [
        "user",
        "currentUser",
        "usanex_user",
        "loggedInUser"
    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(key);

            if(!raw){
                continue;
            }


            const data =
                JSON.parse(raw);


            if(
                data &&
                typeof data === "object"
            ){

                return data;

            }

        }
        catch(error){

            console.log(error);

        }

    }


    return null;
}


/* =====================================================
   OWN USER
===================================================== */

function isOwnUser(user){

    const me =
        getCurrentUser();


    if(!me){
        return false;
    }


    const myId =
        String(
            me.user_id ||
            me.id ||
            ""
        )
        .trim()
        .toLowerCase();


    const myMobile =
        String(
            me.mobile ||
            me.phone ||
            ""
        )
        .trim();


    const targetId =
        String(
            user.user_id ||
            ""
        )
        .trim()
        .toLowerCase();


    const targetMobile =
        String(
            user.mobile ||
            ""
        )
        .trim();


    if(
        myId &&
        targetId &&
        myId === targetId
    ){

        return true;

    }


    if(
        myMobile &&
        targetMobile &&
        myMobile === targetMobile
    ){

        return true;

    }


    return false;
}


/* =====================================================
   SEARCH INPUT
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        const value =
            this.value.trim();


        clearTimeout(
            searchTimer
        );


        clearBtn.style.display =
            value ? "block" : "none";


        if(!value){

            results.innerHTML =
                "";

            empty.style.display =
                "none";

            loading.style.display =
                "none";

            resultHeading.style.display =
                "none";

            errorBox.style.display =
                "none";

            return;
        }


        searchTimer =
            setTimeout(
                function(){

                    searchUsers(value);

                },
                400
            );

    }
);


/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers(query){

    loading.style.display =
        "block";

    empty.style.display =
        "none";

    errorBox.style.display =
        "none";

    results.innerHTML =
        "";

    resultHeading.style.display =
        "none";


    try{

        const response =
            await fetch(
                API +
                "/api/search?q=" +
                encodeURIComponent(query)
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        loading.style.display =
            "none";


        if(
            !data.ok ||
            !data.users ||
            data.users.length === 0
        ){

            empty.style.display =
                "block";

            return;
        }


        resultHeading.style.display =
            "block";


        data.users.forEach(
            function(user){

                createUserCard(
                    user
                );

            }
        );

    }
    catch(error){

        console.error(error);

        loading.style.display =
            "none";

        errorBox.textContent =
            "Server connection failed. Please try again.";

        errorBox.style.display =
            "block";

    }

}


/* =====================================================
   CREATE USER CARD
===================================================== */

function createUserCard(user){

    /*
       Agar searched user khud hai
       to professional own-account card
       show hoga.
    */

    if(
        isOwnUser(user)
    ){

        createOwnCard(
            user
        );

        return;
    }


    const card =
        document.createElement("div");

    card.className =
        "user-card";


    /* ---------- AVATAR ---------- */

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";


    const initial =
        document.createElement("span");

    initial.textContent =
        (
            user.name ||
            "U"
        )
        .charAt(0)
        .toUpperCase();


    avatar.appendChild(
        initial
    );


    if(user.profile_photo){

        const img =
            document.createElement("img");

        img.src =
            user.profile_photo;

        img.alt =
            user.name ||
            "Profile photo";


        img.onload =
            function(){

                initial.style.display =
                    "none";

                img.style.display =
                    "block";

            };


        img.onerror =
            function(){

                img.remove();

            };


        avatar.appendChild(
            img
        );


        avatar.onclick =
            function(){

                openDp(
                    user.profile_photo,
                    user.name
                );

            };

    }
    else{

        avatar.onclick =
            function(){

                openDpPlaceholder(
                    user.name
                );

            };

    }


    /* ---------- DETAILS ---------- */

    const details =
        document.createElement("div");

    details.className =
        "user-details";


    const name =
        document.createElement("div");

    name.className =
        "user-name";

    name.textContent =
        user.name ||
        "Usanex User";


    /*
       Name click:
       sirf status box.
       Profile page open nahi hoga.
    */

    name.onclick =
        function(){

            showUserStatus(
                user
            );

        };


    const userId =
        document.createElement("div");

    userId.className =
        "user-id";

    userId.textContent =
        "ID: " +
        (
            user.user_id ||
            "---"
        );


    details.appendChild(
        name
    );

    details.appendChild(
        userId
    );


    /* ---------- FOLLOW ---------- */

    const followBtn =
        document.createElement("button");

    followBtn.className =
        "follow-btn";

    followBtn.textContent =
        "Follow";


    followBtn.onclick =
        function(){

            toggleFollow(
                user,
                followBtn
            );

        };


    card.appendChild(
        avatar
    );

    card.appendChild(
        details
    );

    card.appendChild(
        followBtn
    );


    results.appendChild(
        card
    );

}


/* =====================================================
   OWN ACCOUNT CARD
===================================================== */

function createOwnCard(user){

    const card =
        document.createElement("div");

    card.className =
        "own-card";


    const top =
        document.createElement("div");

    top.className =
        "own-top";


    const icon =
        document.createElement("div");

    icon.className =
        "own-icon";

    icon.textContent =
        "✓";


    const content =
        document.createElement("div");


    const title =
        document.createElement("div");

    title.className =
        "own-title";

    title.textContent =
        "Your Account";


    const text =
        document.createElement("div");

    text.className =
        "own-text";

    text.textContent =
        "This is your User ID.";


    content.appendChild(
        title
    );

    content.appendChild(
        text
    );


    top.appendChild(
        icon
    );

    top.appendChild(
        content
    );


    const ownId =
        document.createElement("div");

    ownId.className =
        "own-id";

    ownId.textContent =
        "User ID: " +
        (
            user.user_id ||
            "---"
        );


    card.appendChild(
        top
    );

    card.appendChild(
        ownId
    );


    results.appendChild(
        card
    );

}


/* =====================================================
   FOLLOW TOGGLE
===================================================== */

function toggleFollow(
    user,
    button
){

    const requestSent =
        button.classList.contains(
            "sent"
        );


    /*
       Request Sent -> Follow
       Cancel request
    */

    if(requestSent){

        button.textContent =
            "Follow";

        button.classList.remove(
            "sent"
        );

        showStatus(
            "Follow request cancelled"
        );

        return;
    }


    /*
       Follow -> Request Sent
    */

    button.textContent =
        "Request Sent";

    button.classList.add(
        "sent"
    );


    showStatus(
        "Follow request sent to " +
        (
            user.name ||
            "this user"
        )
    );

}


/* =====================================================
   NAME STATUS
===================================================== */

function showUserStatus(user){

    /*
       Backend connection system ke baad
       yahan real status automatically
       load hoga.

       Possible statuses:
       Not Accepted
       Rejected
       Accepted
    */

    let status =
        "Not Accepted";


    /*
       Agar future backend status bheje:
       user.connection_status
    */

    if(
        user.connection_status
    ){

        status =
            user.connection_status;

    }


    showStatus(
        (
            user.name ||
            "User"
        ) +
        " • " +
        status
    );

}


/* =====================================================
   SHOW STATUS
===================================================== */

function showStatus(message){

    clearTimeout(
        statusTimer
    );


    statusBox.textContent =
        message;


    statusBox.classList.add(
        "show"
    );


    statusTimer =
        setTimeout(
            function(){

                statusBox.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* =====================================================
   OPEN DP
===================================================== */

function openDp(
    imageUrl,
    name
){

    dpContainer.innerHTML =
        "";


    const img =
        document.createElement("img");


    img.src =
        imageUrl;

    img.alt =
        name ||
        "Profile photo";


    img.onerror =
        function(){

            openDpPlaceholder(
                name
            );

        };


    dpContainer.appendChild(
        img
    );


    dpModal.classList.add(
        "show"
    );

}


/* =====================================================
   DP PLACEHOLDER
===================================================== */

function openDpPlaceholder(name){

    dpContainer.innerHTML =
        "";


    const placeholder =
        document.createElement("div");

    placeholder.className =
        "dp-placeholder";


    placeholder.textContent =
        (
            name ||
            "U"
        )
        .charAt(0)
        .toUpperCase();


    dpContainer.appendChild(
        placeholder
    );


    dpModal.classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE DP
===================================================== */

function closeDp(event){

    if(
        event &&
        event.target !== dpModal
    ){

        return;

    }


    dpModal.classList.remove(
        "show"
    );

}


/* =====================================================
   CLEAR SEARCH
===================================================== */

function clearSearch(){

    searchInput.value =
        "";

    clearBtn.style.display =
        "none";

    results.innerHTML =
        "";

    empty.style.display =
        "none";

    loading.style.display =
        "none";

    errorBox.style.display =
        "none";

    resultHeading.style.display =
        "none";

    searchInput.focus();

}


/* =====================================================
   GO HOME
===================================================== */

function goHome(){

    window.location.href =
        "/home";

}


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            dpModal.classList.remove(
                "show"
            );

        }

    }
);

</script>
