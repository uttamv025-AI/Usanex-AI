<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Search • Usanex</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#07090d;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{
    min-height:100vh;
    padding-bottom:30px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(24,105,232,.18),
            transparent 38%
        ),
        #07090d;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:88px;
    padding:0 20px;

    display:flex;
    align-items:center;
    gap:14px;

    background:rgba(7,9,13,.88);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    position:sticky;
    top:0;
    z-index:30;

    backdrop-filter:blur(18px);
}


/* =========================================================
   HOME PAGE SAME LOGO
========================================================= */

.brand{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-mark{
    width:43px;
    height:43px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #2d91ff,
            #0756c9
        );

    box-shadow:
        0 7px 22px
        rgba(18,105,232,.38);
}

.logo-u{
    font-size:25px;
    font-weight:900;
    color:#fff;
    z-index:2;
}

.logo-shine{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    right:7px;
    top:6px;

    opacity:.9;
}

.logo-mark:after{
    content:"";

    position:absolute;

    width:21px;
    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.25);

    left:11px;
    bottom:6px;
}

.logo-name{
    margin-left:9px;

    font-size:20px;
    font-weight:800;

    letter-spacing:-.5px;
}


/* =========================================================
   SEARCH BOX
========================================================= */

.search-box{
    flex:1;

    height:45px;
    min-width:0;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-radius:24px;

    background:#151820;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.search-icon{
    font-size:22px;
    color:#8993a5;
    margin-right:9px;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:14px;
}

.search-box input::placeholder{
    color:#747d8d;
}


/* =========================================================
   BACK
========================================================= */

.back-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;
    border-radius:13px;

    background:#151820;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.back-btn:active{
    transform:scale(.92);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:22px 20px 30px;
}

.page-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:6px;
}

.page-subtitle{
    font-size:12px;
    color:#7f8898;
    margin-bottom:22px;
}


/* =========================================================
   YOUR ACCOUNT
========================================================= */

.own-account{
    padding:17px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.98),
            rgba(14,17,23,.98)
        );

    border:
        1px solid
        rgba(45,145,255,.18);

    margin-bottom:18px;
}

.own-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:5px;
}

.own-text{
    font-size:11px;
    color:#7f8999;
    margin-bottom:12px;
}

.own-id{
    display:inline-flex;

    padding:8px 11px;

    border-radius:10px;

    background:#11151d;

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:12px;

    color:#8dbdff;

    font-weight:700;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:none;

    padding:13px 15px;

    margin-bottom:14px;

    border-radius:14px;

    background:#151a23;

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#aeb7c5;

    font-size:12px;

    text-align:center;
}


/* =========================================================
   RESULTS
========================================================= */

.results{
    display:flex;
    flex-direction:column;
    gap:10px;
}


/* =========================================================
   USER CARD
========================================================= */

.user-card{
    min-height:76px;

    display:flex;
    align-items:center;

    padding:12px 13px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(25,29,38,.95),
            rgba(14,17,23,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);
}


/* =========================================================
   DP
========================================================= */

.user-dp{

    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    font-size:20px;
    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:
        2px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 16px
        rgba(15,105,235,.25);

    cursor:pointer;

    user-select:none;
}

.user-dp:active{
    transform:scale(.94);
}

.user-dp img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


/* =========================================================
   USER INFO
========================================================= */

.user-info{
    flex:1;

    min-width:0;

    margin-left:12px;
}

.user-name{

    font-size:15px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;
}

.user-id{

    margin-top:5px;

    font-size:11px;

    color:#818a9a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   FOLLOW
========================================================= */

.follow-btn{

    min-width:84px;
    height:36px;

    padding:0 13px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #3296ff,
            #0758cb
        );

    color:#fff;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.follow-btn.sent{

    background:#252b36;

    color:#aeb7c5;
}

.follow-btn:active{
    transform:scale(.94);
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    min-height:45vh;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 25px;
}

.empty-circle{

    width:92px;
    height:92px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(35,133,245,.20),
            rgba(35,133,245,.04)
        );

    border:
        1px solid
        rgba(50,140,255,.16);

    margin-bottom:20px;
}

.empty-icon{
    font-size:38px;
}

.empty-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:8px;
}

.empty-text{

    max-width:290px;

    color:#7e8797;

    font-size:12px;

    line-height:1.6;
}


/* =========================================================
   STATUS POPUP
========================================================= */

.status-popup{

    position:fixed;

    left:50%;
    bottom:32px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:calc(100% - 40px);
    max-width:360px;

    padding:13px 17px;

    border-radius:15px;

    background:
        rgba(24,28,37,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color:#fff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.status-popup.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   LARGE DP MODAL
========================================================= */

.dp-modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.90);

    padding:25px;

    z-index:500;
}

.dp-modal.show{
    display:flex;
}


/* REAL IMAGE */

.dp-image{

    width:min(82vw,360px);
    height:min(82vw,360px);

    border-radius:50%;

    object-fit:cover;

    border:
        3px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.70);
}


/* DEFAULT LETTER DP */

.dp-letter{

    width:min(70vw,300px);
    height:min(70vw,300px);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #2b8cff,
            #0757c8
        );

    border:
        4px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.70);

    font-size:100px;
    font-weight:900;

    color:#fff;
}

.dp-close{

    position:absolute;

    top:24px;
    right:20px;

    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    background:#191e27;

    color:#fff;

    font-size:25px;

    cursor:pointer;

    z-index:510;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

    .header{
        padding:0 10px;
        gap:7px;
    }

    .logo-mark{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-u{
        font-size:22px;
    }

    .logo-name{
        margin-left:6px;
        font-size:16px;
    }

    .search-box{
        height:40px;
        padding:0 11px;
    }

    .search-icon{
        font-size:19px;
        margin-right:5px;
    }

    .back-btn{
        width:35px;
        height:35px;
        font-size:19px;
    }

    .content{
        padding-left:15px;
        padding-right:15px;
    }

    .user-card{
        padding:10px;
    }

    .user-dp{
        width:47px;
        height:47px;
    }

    .follow-btn{
        min-width:75px;
        padding:0 9px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <!-- SAME HOME LOGO -->

    <div class="brand">

        <div class="logo-mark">

            <span class="logo-u">
                U
            </span>

            <span class="logo-shine">
            </span>

        </div>

        <div class="logo-name">
            Usanex
        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search User ID or phone"
            autocomplete="off">

    </div>


    <!-- BACK -->

    <button
        class="back-btn"
        onclick="goHome()">

        ‹

    </button>


</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="content">


    <div class="page-title">
        Search
    </div>

    <div class="page-subtitle">
        Find people using User ID or phone number.
    </div>


    <!-- YOUR ACCOUNT -->

    <div
        id="ownAccount"
        class="own-account"
        style="display:none;">

        <div class="own-title">
            Your Account
        </div>

        <div class="own-text">
            This is your User ID.
        </div>

        <div
            id="ownUserId"
            class="own-id">
        </div>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- RESULTS -->

    <div
        id="results"
        class="results">
    </div>


    <!-- EMPTY -->

    <div
        id="emptyState"
        class="empty">

        <div class="empty-circle">

            <div class="empty-icon">
                🔎
            </div>

        </div>

        <div class="empty-title">
            Search for people
        </div>

        <div class="empty-text">
            Enter a User ID or phone number
            to find a person on Usanex.
        </div>

    </div>


</main>


<!-- =====================================================
     STATUS POPUP
===================================================== -->

<div
    id="statusPopup"
    class="status-popup">
</div>


<!-- =====================================================
     DP MODAL
===================================================== -->

<div
    id="dpModal"
    class="dp-modal">

    <button
        id="dpClose"
        class="dp-close">

        ×

    </button>

    <div
        id="dpViewer">
    </div>

</div>


</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const results =
    document.getElementById(
        "results"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const ownAccount =
    document.getElementById(
        "ownAccount"
    );

const ownUserId =
    document.getElementById(
        "ownUserId"
    );

const message =
    document.getElementById(
        "message"
    );

const statusPopup =
    document.getElementById(
        "statusPopup"
    );

const dpModal =
    document.getElementById(
        "dpModal"
    );

const dpViewer =
    document.getElementById(
        "dpViewer"
    );

const dpClose =
    document.getElementById(
        "dpClose"
    );


/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;

try{

    const savedUser =
        localStorage.getItem(
            "user"
        );

    if(savedUser){

        currentUser =
            JSON.parse(
                savedUser
            );

    }

}catch(error){

    currentUser = null;

}


/* =========================================================
   SEARCH TIMER
========================================================= */

let searchTimer = null;


/* =========================================================
   SEARCH INPUT
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        clearTimeout(
            searchTimer
        );

        const q =
            this.value.trim();


        if(!q){

            clearResults();

            return;

        }


        searchTimer =
            setTimeout(
                function(){

                    searchUsers(q);

                },
                300
            );

    }
);


/* =========================================================
   SEARCH API
========================================================= */

async function searchUsers(q){

    showMessage(
        "Searching..."
    );


    try{

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(q)
            );


        if(!response.ok){

            throw new Error(
                "Search failed"
            );

        }


        const data =
            await response.json();


        renderUsers(
            data.users || []
        );


    }catch(error){

        console.error(error);

        results.innerHTML = "";

        ownAccount.style.display =
            "none";

        emptyState.style.display =
            "flex";

        showMessage(
            "Unable to search right now."
        );

    }

}


/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(users){

    results.innerHTML = "";

    ownAccount.style.display =
        "none";

    message.style.display =
        "none";


    if(
        !users ||
        users.length === 0
    ){

        emptyState.style.display =
            "flex";

        emptyState.querySelector(
            ".empty-title"
        ).textContent =
            "No people found";

        emptyState.querySelector(
            ".empty-text"
        ).textContent =
            "Try another User ID or phone number.";

        return;

    }


    emptyState.style.display =
        "none";


    checkOwnAccount(
        users
    );


    users.forEach(
        function(user){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "user-card";


            const firstLetter =
                (
                    user.name ||
                    "U"
                )
                .charAt(0)
                .toUpperCase();


            card.innerHTML = `

                <div
                    class="user-dp">

                    ${
                        user.profile_photo
                        ?
                        `
                        <img
                            src="${escapeHtml(
                                user.profile_photo
                            )}"
                            alt="Profile photo"
                        >
                        `
                        :
                        escapeHtml(
                            firstLetter
                        )
                    }

                </div>


                <div class="user-info">

                    <div
                        class="user-name">

                        ${escapeHtml(
                            user.name ||
                            "User"
                        )}

                    </div>

                    <div
                        class="user-id">

                        ${escapeHtml(
                            user.user_id ||
                            ""
                        )}

                    </div>

                </div>


                <button
                    class="follow-btn">

                    Follow

                </button>

            `;


            /* =================================================
               DP CLICK
            ================================================= */

            const dp =
                card.querySelector(
                    ".user-dp"
                );


            dp.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    openDp(
                        user
                    );

                }
            );


            /* =================================================
               NAME CLICK
            ================================================= */

            const name =
                card.querySelector(
                    ".user-name"
                );


            name.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    showUserStatus(
                        user
                    );

                }
            );


            /* =================================================
               FOLLOW CLICK
            ================================================= */

            const followBtn =
                card.querySelector(
                    ".follow-btn"
                );


            followBtn.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    toggleFollow(
                        user,
                        followBtn
                    );

                }
            );


            results.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   DP OPEN
========================================================= */

function openDp(user){

    dpViewer.innerHTML = "";


    const photo =
        user.profile_photo;


    if(photo){

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "dp-image";

        image.src =
            photo;

        image.alt =
            "Profile photo";


        /*
           Agar image load fail ho,
           default letter DP show hoga.
        */

        image.onerror =
            function(){

                showLetterDp(
                    user
                );

            };


        dpViewer.appendChild(
            image
        );

    }else{

        showLetterDp(
            user
        );

    }


    dpModal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   DEFAULT LARGE LETTER DP
========================================================= */

function showLetterDp(user){

    dpViewer.innerHTML = "";


    const letter =
        (
            user.name ||
            "U"
        )
        .charAt(0)
        .toUpperCase();


    const div =
        document.createElement(
            "div"
        );

    div.className =
        "dp-letter";

    div.textContent =
        letter;


    dpViewer.appendChild(
        div
    );

}


/* =========================================================
   CLOSE DP
========================================================= */

function closeDp(){

    dpModal.classList.remove(
        "show"
    );

    dpViewer.innerHTML = "";

    document.body.style.overflow =
        "";

}


/* =========================================================
   DP CLOSE BUTTON
========================================================= */

dpClose.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        closeDp();

    }
);


/* =========================================================
   OUTSIDE DP CLICK
========================================================= */

dpModal.addEventListener(
    "click",
    function(event){

        if(
            event.target === dpModal
        ){

            closeDp();

        }

    }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeDp();

        }

    }
);


/* =========================================================
   FOLLOW
========================================================= */

function toggleFollow(
    user,
    button
){

    const isSent =
        button.classList.contains(
            "sent"
        );


    if(isSent){

        button.classList.remove(
            "sent"
        );

        button.textContent =
            "Follow";


        showPopup(
            "Follow request cancelled"
        );

        return;

    }


    button.classList.add(
        "sent"
    );

    button.textContent =
        "Request Sent";


    showPopup(
        "Follow request sent to " +
        (user.name || "User")
    );


    /*
       Backend Follow API
       next step me connect hoga.
    */

}


/* =========================================================
   USER STATUS
========================================================= */

function showUserStatus(user){

    let status =
        user.connection_status ||
        "Not Accepted";


    const allowed = [
        "Not Accepted",
        "Rejected",
        "Accepted"
    ];


    if(
        !allowed.includes(
            status
        )
    ){

        status =
            "Not Accepted";

    }


    showPopup(
        (user.name || "User") +
        " • " +
        status
    );

}


/* =========================================================
   OWN ACCOUNT
========================================================= */

function checkOwnAccount(users){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        ownAccount.style.display =
            "none";

        return;

    }


    const myId =
        String(
            currentUser.user_id
        )
        .toLowerCase();


    const found =
        users.some(
            function(user){

                return (
                    String(
                        user.user_id || ""
                    )
                    .toLowerCase()
                    ===
                    myId
                );

            }
        );


    if(found){

        ownAccount.style.display =
            "block";

        ownUserId.textContent =
            currentUser.user_id;

    }

}


/* =========================================================
   POPUP
========================================================= */

let popupTimer = null;


function showPopup(text){

    clearTimeout(
        popupTimer
    );


    statusPopup.textContent =
        text;


    statusPopup.classList.add(
        "show"
    );


    popupTimer =
        setTimeout(
            function(){

                statusPopup.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    message.textContent =
        text;

    message.style.display =
        "block";

}


function clearMessage(){

    message.textContent =
        "";

    message.style.display =
        "none";

}


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearResults(){

    results.innerHTML = "";

    ownAccount.style.display =
        "none";

    clearMessage();

    emptyState.style.display =
        "flex";


    emptyState.querySelector(
        ".empty-title"
    ).textContent =
        "Search for people";


    emptyState.querySelector(
        ".empty-text"
    ).textContent =
        "Enter a User ID or phone number to find a person on Usanex.";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* =========================================================
   URL USER ID
========================================================= */

const params =
    new URLSearchParams(
        window.location.search

    );

    );
