<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Usanex - Notifications</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;

    background:#090b10;
    color:#fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;

    margin:auto;

    background:#090b10;

    position:relative;

    padding-bottom:90px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    width:100%;
    height:72px;

    display:flex;
    align-items:center;

    padding:0 16px;

    background:
        rgba(9,11,16,.96);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

    position:sticky;
    top:0;

    z-index:100;
}


/* BACK BUTTON */

.back-btn{

    width:40px;
    height:40px;

    border:none;
    outline:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#151820;

    color:#fff;

    font-size:28px;

    cursor:pointer;

    margin-right:12px;

    flex-shrink:0;
}

.back-btn:active{
    transform:scale(.93);
}


/* HEADER INFO */

.header-info{
    flex:1;
    min-width:0;
}

.header-title{

    font-size:20px;

    font-weight:800;

    letter-spacing:-.4px;
}

.header-subtitle{

    margin-top:3px;

    font-size:11px;

    color:#7f8899;
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    width:100%;

    padding:
        16px
        14px
        20px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    min-height:55vh;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#727b8c;
}

.empty-icon{

    width:72px;
    height:72px;

    border-radius:24px;

    background:#151820;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:32px;

    margin-bottom:15px;

    border:
        1px solid
        rgba(255,255,255,.05);
}

.empty-title{

    color:#fff;

    font-size:17px;

    font-weight:750;

    margin-bottom:7px;
}

.empty-text{

    font-size:13px;

    color:#727b8c;

    max-width:260px;

    line-height:1.5;
}


/* =========================================================
   NOTIFICATION CARD
========================================================= */

.notification-card{

    width:100%;

    background:
        linear-gradient(
            145deg,
            #141820,
            #101319
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:18px;

    padding:14px;

    margin-bottom:11px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);

    position:relative;

    transition:.2s ease;
}


/* UNREAD */

.notification-card.unread{

    border-color:
        rgba(58,145,255,.20);

    background:
        linear-gradient(
            145deg,
            #151b25,
            #11151c
        );
}

.notification-card:active{

    transform:scale(.985);
}


/* UNREAD DOT */

.unread-dot{

    position:absolute;

    top:14px;
    right:14px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#328cff;

    box-shadow:
        0 0 10px
        rgba(50,140,255,.65);
}


/* =========================================================
   MAIN ROW
========================================================= */

.notification-main{

    display:flex;

    align-items:flex-start;

    gap:12px;
}


/* =========================================================
   AVATAR
========================================================= */

.avatar{

    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #237cf1,
            #084db5
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:18px;

    font-weight:800;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================================================
   BODY
========================================================= */

.notification-body{

    flex:1;

    min-width:0;
}

.notification-title{

    font-size:14px;

    font-weight:750;

    line-height:1.35;

    color:#fff;

    padding-right:10px;
}

.notification-message{

    margin-top:5px;

    color:#8c95a5;

    font-size:12px;

    line-height:1.5;

    word-break:break-word;
}

.notification-time{

    margin-top:8px;

    color:#596273;

    font-size:10px;
}


/* =========================================================
   FOLLOW ACTIONS
========================================================= */

.action-row{

    display:flex;

    gap:8px;

    margin-top:13px;
}

.action-btn{

    flex:1;

    height:38px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size:12px;

    font-weight:750;

    cursor:pointer;

    transition:.2s ease;
}

.accept-btn{

    background:#247df1;

    color:#fff;
}

.reject-btn{

    background:#191d25;

    color:#c3cad6;
}

.action-btn:active{

    transform:scale(.97);
}

.action-btn:disabled{

    opacity:.5;
}


/* =========================================================
   VERIFICATION CODE
========================================================= */

.code-box{

    margin-top:13px;

    padding:12px;

    border-radius:14px;

    background:#0c1017;

    border:
        1px solid
        rgba(65,143,255,.16);
}

.code-label{

    font-size:10px;

    color:#687487;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin-bottom:7px;
}

.code-row{

    display:flex;

    align-items:center;

    gap:9px;
}

.code-value{

    flex:1;

    min-width:0;

    height:40px;

    border-radius:10px;

    background:#151a23;

    display:flex;

    align-items:center;

    padding:0 12px;

    font-size:18px;

    font-weight:850;

    letter-spacing:3px;

    color:#fff;

    overflow:hidden;
}

.copy-btn{

    height:40px;

    padding:0 14px;

    border:none;

    border-radius:10px;

    background:#247df1;

    color:#fff;

    font-size:11px;

    font-weight:800;

    cursor:pointer;
}

.copy-btn:active{

    transform:scale(.95);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    left:50%;

    transform:translateX(-50%);

    bottom:0;

    width:100%;

    max-width:600px;

    height:72px;

    background:
        rgba(13,16,22,.96);

    backdrop-filter:blur(20px);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:200;
}

.nav-item{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#697283;

    font-size:10px;

    font-weight:650;

    cursor:pointer;
}

.nav-icon{

    font-size:21px;

    line-height:1;
}

.create-btn{

    width:44px;
    height:44px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #328eff,
            #0758ca
        );

    color:#fff;

    font-size:27px;

    box-shadow:
        0 7px 22px
        rgba(30,120,255,.30);

    margin-top:-17px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#191e27;

    color:#fff;

    padding:11px 16px;

    border-radius:12px;

    font-size:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.3);

    opacity:0;

    pointer-events:none;

    transition:.25s ease;

    z-index:500;

    max-width:
        calc(100% - 30px);

    text-align:center;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

    .header{

        padding:0 10px;
    }

    .back-btn{

        width:37px;
        height:37px;

        font-size:24px;

        margin-right:9px;
    }

    .header-title{

        font-size:18px;
    }

    .header-subtitle{

        font-size:10px;
    }

    .content{

        padding:
            13px
            10px
            18px;
    }

    .notification-card{

        border-radius:16px;

        padding:12px;
    }

    .avatar{

        width:44px;
        height:44px;
    }

    .notification-title{

        font-size:13px;
    }

    .notification-message{

        font-size:11px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <button
            class="back-btn"
            onclick="goHome()">

            ‹

        </button>


        <div class="header-info">

            <div class="header-title">
                Notifications
            </div>

            <div
                class="header-subtitle"
                id="notificationSubtitle">

                Stay updated

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="content">

        <div id="notificationList"></div>

    </main>

</div>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav class="bottom-nav">


    <div
        class="nav-item"
        onclick="goHome()">

        <div class="nav-icon">
            ⌂
        </div>

        <div>
            Home
        </div>

    </div>



    <div
        class="nav-item"
        onclick="showToast('Reels coming soon')">

        <div class="nav-icon">
            ▶
        </div>

        <div>
            Reels
        </div>

    </div>



    <div
        class="nav-item"
        onclick="openCreate()">

        <div class="create-btn">
            +
        </div>

    </div>



    <div
        class="nav-item"
        onclick="showToast('Coll coming soon')">

        <div class="nav-icon">
            ◎
        </div>

        <div>
            Coll
        </div>

    </div>



    <div
        class="nav-item"
        onclick="showToast('Profile coming soon')">

        <div class="nav-icon">
            ◯
        </div>

        <div>
            Profile
        </div>

    </div>


</nav>



<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast">
</div>



<script>

/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;

let notificationList = [];

let notificationSocket = null;

let toastTimer = null;


/* =========================================================
   GET CURRENT USER
========================================================= */

function getCurrentUser(){

    try{

        const raw =
            localStorage.getItem("user");

        if(!raw){

            return null;
        }

        return JSON.parse(raw);

    }catch(error){

        console.error(
            "User parse error:",
            error
        );

        return null;
    }
}


/* =========================================================
   REQUIRE USER
========================================================= */

function requireUser(){

    currentUser =
        getCurrentUser();

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        window.location.href = "/";

        return false;
    }

    return true;
}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

    if(!requireUser()){

        return;
    }


    try{

        const response =
            await fetch(
                "/api/notifications?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ) +
                "&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Notification request failed"
            );
        }


        const data =
            await response.json();


        notificationList =
            Array.isArray(data)
            ? data
            : (
                Array.isArray(
                    data.notifications
                )
                ? data.notifications
                : []
            );


        renderNotifications();


        /*
         * IMPORTANT
         *
         * Page open hote hi database me
         * saare notifications READ kar do.
         */

        await markAllReadOnServer();


    }catch(error){

        console.error(
            "Load notifications error:",
            error
        );

        renderError();
    }
}


/* =========================================================
   RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(){

    const container =
        document.getElementById(
            "notificationList"
        );


    if(!container){

        return;
    }


    if(
        !Array.isArray(notificationList) ||
        notificationList.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ♡
                </div>

                <div class="empty-title">
                    No notifications
                </div>

                <div class="empty-text">
                    New follow requests,
                    connection codes and updates
                    will appear here.
                </div>

            </div>

        `;


        updateSubtitle(0);

        return;
    }


    const unreadCount =
        notificationList.filter(
            item =>
                item &&
                item.is_read === false
        ).length;


    updateSubtitle(
        unreadCount
    );


    container.innerHTML =
        notificationList
        .map(
            notification =>
                createNotificationCard(
                    notification
                )
        )
        .join("");
}


/* =========================================================
   UPDATE SUBTITLE
========================================================= */

function updateSubtitle(
    unreadCount
){

    const subtitle =
        document.getElementById(
            "notificationSubtitle"
        );


    if(!subtitle){

        return;
    }


    if(unreadCount > 0){

        subtitle.textContent =
            unreadCount +
            (
                unreadCount === 1
                ? " unread notification"
                : " unread notifications"
            );

    }else{

        subtitle.textContent =
            "All caught up";
    }
}


/* =========================================================
   CREATE NOTIFICATION CARD
========================================================= */

function createNotificationCard(
    notification
){

    if(!notification){

        return "";
    }


    const type =
        notification.type ||
        notification.notification_type ||
        "";


    /*
     * Backend:
     *
     * sender:{
     *   user_id,
     *   name,
     *   profile_photo
     * }
     */

    const sender =
        notification.sender || {};


    const senderName =
        sender.name ||
        notification.sender_name ||
        notification.name ||
        sender.user_id ||
        notification.sender_user_id ||
        "Someone";


    const senderUserId =
        sender.user_id ||
        notification.sender_user_id ||
        null;


    const senderPhoto =
        sender.profile_photo ||
        notification.sender_profile_photo ||
        notification.profile_photo ||
        null;


    const title =
        notification.title ||
        getDefaultTitle(
            type
        );


    const message =
        notification.message ||
        "";


    const time =
        formatTime(
            notification.created_at
        );


    const isUnread =
        notification.is_read === false;


    const avatar =
        createAvatar(
            senderName,
            senderPhoto
        );


    let extraHTML = "";


    /* =====================================================
       FOLLOW REQUEST
    ====================================================== */

    if(
        type === "follow_request"
    ){

        extraHTML = `

            <div class="action-row">

                <button
                    class="action-btn accept-btn"
                    onclick="acceptFollow(
                        ${Number(
                            notification.id
                        )}
                    )">

                    Accept

                </button>


                <button
                    class="action-btn reject-btn"
                    onclick="rejectFollow(
                        ${Number(
                            notification.id
                        )}
                    )">

                    Reject

                </button>

            </div>

        `;
    }


    /* =====================================================
       CONNECTION CODE
    ====================================================== */

    if(
        type === "connection_code"
    ){

        const code =
            notification.verification_code ||
            extractCodeFromMessage(
                message
            );


        if(code){

            extraHTML = `

                <div class="code-box">

                    <div class="code-label">
                        Verification code
                    </div>

                    <div class="code-row">

                        <div class="code-value">
                            ${escapeHTML(code)}
                        </div>

                        <button
                            class="copy-btn"
                            onclick="copyVerificationCode(
                                '${escapeJS(code)}',
                                '${escapeJS(
                                    senderUserId || ""
                                )}'
                            )">

                            Copy

                        </button>

                    </div>

                </div>

            `;
        }
    }


    /* =====================================================
       CARD
    ====================================================== */

    return `

        <article
            class="notification-card
            ${isUnread ? "unread" : ""}"
            data-notification-id="${Number(
                notification.id
            )}">

            ${
                isUnread
                ? `<div class="unread-dot"></div>`
                : ""
            }


            <div class="notification-main">

                ${avatar}


                <div class="notification-body">

                    <div class="notification-title">

                        ${escapeHTML(
                            title
                        )}

                    </div>


                    <div class="notification-message">

                        ${escapeHTML(
                            message
                        )}

                    </div>


                    <div class="notification-time">

                        ${escapeHTML(
                            time
                        )}

                    </div>


                    ${extraHTML}

                </div>

            </div>

        </article>

    `;
}


/* =========================================================
   DEFAULT TITLE
========================================================= */

function getDefaultTitle(
    type
){

    switch(type){

        case "follow_request":

            return "New follow request";


        case "connection_code":

            return "Connection accepted";


        case "follow_rejected":

            return "Follow request rejected";


        case "connection_verified":

            return "Connection verified";


        default:

            return "New notification";
    }
}


/* =========================================================
   CREATE AVATAR
========================================================= */

function createAvatar(
    name,
    photo
){

    if(photo){

        return `

            <div class="avatar">

                <img
                    src="${escapeAttr(
                        photo
                    )}"
                    alt=""
                    onerror="
                        this.style.display='none';
                        this.parentElement.textContent='${escapeJS(
                            getInitial(name)
                        )}';
                    "
                >

            </div>

        `;
    }


    return `

        <div class="avatar">

            ${escapeHTML(
                getInitial(name)
            )}

        </div>

    `;
}


/* =========================================================
   INITIAL
========================================================= */

function getInitial(
    name
){

    if(
        !name ||
        typeof name !== "string"
    ){

        return "U";
    }


    return name
        .trim()
        .charAt(0)
        .toUpperCase() || "U";
}


/* =========================================================
   ACCEPT FOLLOW
========================================================= */

async function acceptFollow(
    notificationId
){

    if(!requireUser()){

        return;
    }


    try{

        const response =
            await fetch(
                "/api/follow/accept",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        notification_id:
                            Number(
                                notificationId
                            ),

                        user_id:
                            currentUser.user_id
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Accept failed"
            );
        }


        showToast(
            data.message ||
            "Request accepted"
        );


        await loadNotifications();


    }catch(error){

        console.error(
            "Accept error:",
            error
        );

        showToast(
            error.message ||
            "Unable to accept request"
        );
    }
}


/* =========================================================
   REJECT FOLLOW
========================================================= */

async function rejectFollow(
    notificationId
){

    if(!requireUser()){

        return;
    }


    try{

        const response =
            await fetch(
                "/api/follow/reject",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        notification_id:
                            Number(
                                notificationId
                            ),

                        user_id:
                            currentUser.user_id
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Reject failed"
            );
        }


        showToast(
            data.message ||
            "Request rejected"
        );


        await loadNotifications();


    }catch(error){

        console.error(
            "Reject error:",
            error
        );

        showToast(
            error.message ||
            "Unable to reject request"
        );
    }
}


/* =========================================================
   MARK ALL READ - SERVER ONLY
========================================================= */

async function markAllReadOnServer(){

    if(!requireUser()){

        return false;
    }


    try{

        const response =
            await fetch(
                "/api/notifications/read-all?user_id=" +
                encodeURIComponent(
                    currentUser.user_id
                ),
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            console.warn(
                "read-all endpoint unavailable"
            );

            return false;
        }


        /*
         * Database successfully updated.
         */

        notificationList =
            notificationList.map(
                item => ({
                    ...item,
                    is_read:true
                })
            );


        renderNotifications();


        return true;


    }catch(error){

        console.error(
            "Mark all read error:",
            error
        );

        return false;
    }
}


/* =========================================================
   COPY VERIFICATION CODE
========================================================= */

async function copyVerificationCode(
    code,
    targetUserId
){

    if(!code){

        showToast(
            "Verification code missing"
        );

        return;
    }


    try{

        await navigator.clipboard.writeText(
            code
        );

    }catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            code;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();
    }


    /*
     * Connection code notification me
     * sender = target user.
     */

    if(!targetUserId){

        showToast(
            "Code copied, but User ID missing"
        );

        return;
    }


    localStorage.setItem(
        "usanex_pending_verification",
        JSON.stringify({

            user_id:
                targetUserId,

            code:
                code,

            from_notification:
                true,

            created_at:
                new Date().toISOString()

        })
    );


    showToast(
        "Code copied. Opening search..."
    );


    setTimeout(
        function(){

            window.location.href =
                "/search?verify_user_id=" +
                encodeURIComponent(
                    targetUserId
                );

        },
        500
    );
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectNotificationSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){

        return;
    }


    try{

        if(notificationSocket){

            try{

                notificationSocket.close();

            }catch(error){}
        }


        const protocol =
            window.location.protocol === "https:"
            ? "wss:"
            : "ws:";


        const socketUrl =
            protocol +
            "//" +
            window.location.host +
            "/ws/" +
            encodeURIComponent(
                currentUser.user_id
            );


        notificationSocket =
            new WebSocket(
                socketUrl
            );


        notificationSocket.onopen =
            function(){

                console.log(
                    "Usanex notification socket connected"
                );
            };


        notificationSocket.onmessage =
            function(event){

                try{

                    const payload =
                        JSON.parse(
                            event.data
                        );


                    handleRealtimeNotification(
                        payload
                    );


                }catch(error){

                    console.error(
                        "Realtime parse error:",
                        error
                    );
                }
            };


        notificationSocket.onerror =
            function(error){

                console.warn(
                    "Notification socket error",
                    error
                );
            };


        notificationSocket.onclose =
            function(){

                console.log(
                    "Notification socket closed"
                );


                setTimeout(
                    function(){

                        if(
                            document.visibilityState !==
                            "hidden"
                        ){

                            connectNotificationSocket();
                        }

                    },
                    4000
                );
            };


    }catch(error){

        console.error(
            "WebSocket error:",
            error
        );
    }
}


/* =========================================================
   REALTIME NOTIFICATION
========================================================= */

function handleRealtimeNotification(
    payload
){

    if(!payload){

        return;
    }


    const notification =
        payload.notification ||
        payload;


    if(
        payload.type !== "notification" &&
        !notification.type &&
        !notification.notification_type
    ){

        return;
    }


    const type =
        notification.type ||
        notification.notification_type ||
        "";


    /*
     * Connection verified
     */

    if(
        type === "connection_verified"
    ){

        loadNotifications();

        return;
    }


    /*
     * Duplicate check
     */

    const existing =
        notificationList.find(
            item =>
                Number(item.id) ===
                Number(notification.id)
        );


    if(existing){

        return;
    }


    /*
     * New notification.
     */

    notificationList.unshift({

        ...notification,

        is_read:false

    });


    renderNotifications();


    showToast(
        notification.title ||
        "New notification"
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    value
){

    if(!value){

        return "";
    }


    try{

        const date =
            new Date(value);


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "";
        }


        const now =
            new Date();


        const diff =
            Math.floor(
                (
                    now.getTime() -
                    date.getTime()
                ) / 1000
            );


        if(diff < 10){

            return "Just now";
        }


        if(diff < 60){

            return diff + "s ago";
        }


        if(diff < 3600){

            return Math.floor(
                diff / 60
            ) + "m ago";
        }


        if(diff < 86400){

            return Math.floor(
                diff / 3600
            ) + "h ago";
        }


        if(diff < 604800){

            return Math.floor(
                diff / 86400
            ) + "d ago";
        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"short"
            }
        );


    }catch(error){

        return "";
    }
}


/* =========================================================
   EXTRACT CODE
========================================================= */

function extractCodeFromMessage(
    message
){

    if(!message){

        return "";
    }


    const match =
        String(message).match(
            /\b\d{4,8}\b/
        );


    return match
        ? match[0]
        : "";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(
    value
){

    return escapeHTML(
        value
    );
}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );
}

/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;
    }


    toast.textContent =
        message || "";


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}
