<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Usanex</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f8ff;
    color:#172033;
    min-height:100vh;
}

.topbar{
    height:64px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 16px;
    border-bottom:1px solid #e5e9f2;
    position:sticky;
    top:0;
    z-index:10;
}

.back{
    width:40px;
    height:40px;
    border:0;
    background:#f0f4ff;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
}

.title{
    margin-left:12px;
    font-size:20px;
    font-weight:700;
}

.container{
    max-width:650px;
    margin:0 auto;
    padding:15px;
}

.notification{
    background:white;
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    display:flex;
    gap:12px;
    box-shadow:0 3px 12px rgba(30,60,120,.06);
    border:1px solid #edf0f7;
}

.notification.unread{
    border-left:4px solid #2563eb;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#60a5fa);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:700;
}

.content{
    flex:1;
}

.message{
    font-size:15px;
    line-height:1.45;
}

.time{
    color:#8a94a8;
    font-size:12px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.btn{
    border:0;
    padding:8px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

.accept{
    background:#2563eb;
    color:white;
}

.reject{
    background:#edf1f7;
    color:#344054;
}

.code-box{
    margin-top:10px;
    padding:10px;
    background:#f1f5ff;
    border-radius:10px;
    font-weight:700;
    color:#1d4ed8;
    word-break:break-all;
}

.copy-btn{
    margin-top:8px;
    background:#2563eb;
    color:white;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#8b95a7;
}

.empty-icon{
    font-size:48px;
    margin-bottom:12px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#7b8495;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#172033;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    display:none;
    z-index:100;
    font-size:14px;
}
</style>
</head>

<body>

<div class="topbar">
    <button class="back" onclick="goBack()">‹</button>
    <div class="title">Notifications</div>
</div>

<div class="container">
    <div id="notificationList">
        <div class="loading">Loading notifications...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
let currentUser = null;
let notificationList = [];
let socket = null;

/* =========================
   USER
========================= */

function getCurrentUser(){
    try{
        const raw = localStorage.getItem("user");
        if(!raw) return null;

        const user = JSON.parse(raw);

        if(!user || !user.user_id){
            return null;
        }

        return user;
    }catch(error){
        console.error("User parse error:",error);
        return null;
    }
}

currentUser = getCurrentUser();

/* =========================
   REQUIRE USER
========================= */

function requireUser(){
    if(!currentUser){
        window.location.href="/login";
        return false;
    }

    return true;
}

/* =========================
   TOAST
========================= */

function showToast(message){
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },2200);
}

/* =========================
   BACK
========================= */

function goBack(){
    window.location.href="/home";
}

/* =========================
   MARK ONE NOTIFICATION READ
========================= */

async function markNotificationReadOnServer(notificationId){

    if(!currentUser || !currentUser.user_id || !notificationId){
        return false;
    }

    try{

        const response = await fetch("/api/notifications/read",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                notification_id:Number(notificationId),
                user_id:currentUser.user_id
            })
        });

        if(!response.ok){
            console.error(
                "Read notification failed:",
                response.status
            );

            return false;
        }

        return true;

    }catch(error){

        console.error(
            "Mark notification read error:",
            error
        );

        return false;
    }
}

/* =========================
   MARK ALL CURRENT UNREAD
========================= */

async function markUnreadNotificationsOnServer(){

    if(!currentUser || !currentUser.user_id){
        return;
    }

    const unread = notificationList.filter(
        notification =>
            notification &&
            notification.is_read === false
    );

    if(unread.length === 0){
        return;
    }

    const successfulIds = new Set();

    await Promise.all(
        unread.map(async notification => {

            const ok =
                await markNotificationReadOnServer(
                    notification.id
                );

            if(ok){
                successfulIds.add(
                    Number(notification.id)
                );
            }
        })
    );

    if(successfulIds.size > 0){

        notificationList =
            notificationList.map(notification => {

                if(
                    successfulIds.has(
                        Number(notification.id)
                    )
                ){
                    return {
                        ...notification,
                        is_read:true
                    };
                }

                return notification;
            });

        renderNotifications();
    }
}

/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications(){

    if(!requireUser()){
        return;
    }

    const list =
        document.getElementById(
            "notificationList"
        );

    list.innerHTML =
        '<div class="loading">Loading notifications...</div>';

    try{

        const response = await fetch(
            "/api/notifications?user_id=" +
            encodeURIComponent(
                currentUser.user_id
            ) +
            "&_=" +
            Date.now()
        );

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        if(!data.ok){
            throw new Error(
                data.message ||
                "Unable to load notifications"
            );
        }

        notificationList =
            Array.isArray(data.notifications)
                ? data.notifications
                : [];

        renderNotifications();

        /*
          IMPORTANT:
          Notifications page open होते ही
          सभी current unread notifications
          database में READ होंगी.
        */
        await markUnreadNotificationsOnServer();

    }catch(error){

        console.error(
            "Load notifications error:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <div>Unable to load notifications</div>
            </div>
        `;
    }
}

/* =========================
   RENDER
========================= */

function renderNotifications(){

    const list =
        document.getElementById(
            "notificationList"
        );

    if(!notificationList.length){

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔔</div>
                <div>No notifications yet</div>
            </div>
        `;

        return;
    }

    list.innerHTML =
        notificationList.map(
            notification =>
                createNotificationHTML(
                    notification
                )
        ).join("");
}

/* =========================
   NOTIFICATION HTML
========================= */

function createNotificationHTML(notification){

    const sender =
        notification.sender || {};

    const senderName =
        sender.name ||
        sender.username ||
        notification.sender_name ||
        "User";

    const senderUserId =
        sender.user_id ||
        notification.sender_user_id ||
        "";

    const firstLetter =
        senderName
            .charAt(0)
            .toUpperCase();

    const message =
        notification.message ||
        notification.type ||
        "You have a new notification.";

    const time =
        notification.created_at ||
        notification.time ||
        "";

    const unreadClass =
        notification.is_read === false
            ? "unread"
            : "";

    let actions = "";

    /* FOLLOW REQUEST */

    if(
        notification.type === "follow_request"
    ){

        actions = `
            <div class="actions">

                <button
                    class="btn accept"
                    onclick="acceptFollow(
                        ${Number(notification.id)}
                    )"
                >
                    Accept
                </button>

                <button
                    class="btn reject"
                    onclick="rejectFollow(
                        ${Number(notification.id)}
                    )"
                >
                    Reject
                </button>

            </div>
        `;
    }

    /* CONNECTION CODE */

    if(
        notification.type === "connection_code" ||
        notification.type === "connection_verified"
    ){

        const code =
            notification.code ||
            notification.connection_code ||
            "";

        if(code){

            actions += `
                <div class="code-box">
                    Connection Code:
                    <br>
                    ${escapeHTML(code)}

                    <br>

                    <button
                        class="btn copy-btn"
                        onclick="copyCode(
                            '${escapeJS(code)}'
                        )"
                    >
                        Copy Code
                    </button>
                </div>
            `;
        }
    }

    /* USER ID CLICK */

    if(senderUserId){

        actions += `
            <div class="actions">

                <button
                    class="btn reject"
                    onclick="openUserProfile(
                        '${escapeJS(senderUserId)}'
                    )"
                >
                    View Profile
                </button>

            </div>
        `;
    }

    return `
        <div
            class="notification ${unreadClass}"
            data-id="${Number(notification.id)}"
        >

            <div class="avatar">
                ${escapeHTML(firstLetter)}
            </div>

            <div class="content">

                <div class="message">
                    <strong>
                        ${escapeHTML(senderName)}
                    </strong>
                    ${escapeHTML(message)}
                </div>

                ${
                    time
                    ? `
                        <div class="time">
                            ${escapeHTML(String(time))}
                        </div>
                      `
                    : ""
                }

                ${actions}

            </div>

        </div>
    `;
}

/* =========================
   ACCEPT FOLLOW
========================= */

async function acceptFollow(notificationId){

    if(!requireUser()){
        return;
    }

    try{

        const response = await fetch(
            "/api/follow/accept",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    notification_id:
                        Number(notificationId),

                    user_id:
                        currentUser.user_id
                })
            }
        );

        const data =
            await response.json();

        if(!response.ok || data.ok === false){

            showToast(
                data.message ||
                "Unable to accept request"
            );

            return;
        }

        showToast(
            "Follow request accepted"
        );

        await loadNotifications();

    }catch(error){

        console.error(
            "Accept follow error:",
            error
        );

        showToast(
            "Something went wrong"
        );
    }
}

/* =========================
   REJECT FOLLOW
========================= */

async function rejectFollow(notificationId){

    if(!requireUser()){
        return;
    }

    try{

        const response = await fetch(
            "/api/follow/reject",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    notification_id:
                        Number(notificationId),

                    user_id:
                        currentUser.user_id
                })
            }
        );

        const data =
            await response.json();

        if(!response.ok || data.ok === false){

            showToast(
                data.message ||
                "Unable to reject request"
            );

            return;
        }

        showToast(
            "Follow request rejected"
        );

        await loadNotifications();

    }catch(error){

        console.error(
            "Reject follow error:",
            error
        );

        showToast(
            "Something went wrong"
        );
    }
}

/* =========================
   COPY CODE
========================= */

async function copyCode(code){

    try{

        await navigator.clipboard.writeText(code);

        showToast(
            "Code copied"
        );

    }catch(error){

        console.error(
            "Copy error:",
            error
        );

        showToast(
            "Unable to copy"
        );
    }
}

/* =========================
   OPEN PROFILE / SEARCH
========================= */

function openUserProfile(userId){

    if(!userId){
        return;
    }

    window.location.href =
        "/search?user_id=" +
        encodeURIComponent(userId);
}

/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}

/* =========================
   REALTIME WEBSOCKET
========================= */

function connectWebSocket(){

    if(
        !currentUser ||
        !currentUser.user_id
    ){
        return;
    }

    try{

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host +
                "/ws/" +
                encodeURIComponent(
                    currentUser.user_id
                )
            );

        socket.onopen = function(){

            console.log(
                "Notification WebSocket connected"
            );
        };

        socket.onmessage =
            async function(event){

                try{

                    const payload =
                        JSON.parse(
                            event.data
                        );

                    await handleRealtimeNotification(
                        payload
                    );

                }catch(error){

                    console.error(
                        "Realtime notification error:",
                        error
                    );
                }
            };

        socket.onclose = function(){

            console.log(
                "Notification WebSocket closed"
            );

            setTimeout(
                connectWebSocket,
                3000
            );
        };

        socket.onerror = function(error){

            console.error(
                "WebSocket error:",
                error
            );
        };

    }catch(error){

        console.error(
            "WebSocket connection error:",
            error
        );
    }
}

/* =========================
   REALTIME NOTIFICATION
========================= */

async function handleRealtimeNotification(
    payload
){

    if(!payload){
        return;
    }

    let notification =
        payload.notification ||
        payload;

    if(
        !notification ||
        typeof notification !== "object"
    ){
        return;
    }

    /*
      अगर notification में ID नहीं है,
      तो refresh कर देंगे.
    */
    if(!notification.id){

        await loadNotifications();
        return;
    }

    /*
      Notifications page already open है,
      इसलिए नया notification भी तुरंत READ
      कर दो.
    */
    const readOk =
        await markNotificationReadOnServer(
            notification.id
        );

    notificationList.unshift({
        ...notification,
        is_read: readOk
    });

    renderNotifications();

    showToast(
        notification.message ||
        "New notification"
    );
}

/* =========================
   START
========================= */

if(requireUser()){

    loadNotifications();

    connectWebSocket();
}

/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
    "pageshow",
    function(){

        if(currentUser){

            loadNotifications();

        }
    }
);
</script>

</body>
</html>
