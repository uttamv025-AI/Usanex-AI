<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Usanex • Reels</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#07101d;
}

/* ================= REEL AREA ================= */

.reel{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 35%,
            #173963 0%,
            #0b1d34 35%,
            #050b13 75%
        );
}

/* No video here */
.empty-reel{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

.empty-logo{
    width:74px;
    height:74px;
    border-radius:22px;
    background:linear-gradient(145deg,#3998ff,#075dcc);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:900;
    box-shadow:0 12px 35px rgba(0,100,255,.35);
}

.empty-title{
    margin-top:18px;
    font-size:21px;
    font-weight:800;
}

.empty-text{
    margin-top:7px;
    color:#aebbd0;
    font-size:13px;
}

/* ================= TOP ================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:70px;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:39px;
    height:39px;
    border-radius:12px;
    background:linear-gradient(145deg,#3998ff,#075dcc);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:24px;
    font-weight:900;
}

.brand-name{
    color:#fff;
    font-size:20px;
    font-weight:800;
}

.top-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    color:#fff;
    font-size:19px;
}

/* ================= TABS ================= */

.tabs{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:11;

    display:flex;
    gap:25px;

    color:#8997aa;
    font-size:14px;
    font-weight:700;
}

.tab.active{
    color:#fff;
}

.tab{
    position:relative;
}

.tab.active:after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:-8px;

    width:20px;
    height:3px;
    border-radius:10px;
    background:#fff;
}

/* ================= RIGHT BUTTONS ================= */

.actions{
    position:absolute;
    right:13px;
    bottom:110px;
    z-index:12;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.action-btn{
    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.38);
    color:#fff;

    font-size:21px;
}

.count{
    color:#fff;
    font-size:11px;
    font-weight:700;
}

/* ================= INFO ================= */

.info{
    position:absolute;
    left:16px;
    right:80px;
    bottom:100px;
    z-index:12;
    color:#fff;
}

.creator{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;

    background:linear-gradient(135deg,#55aaff,#075dcc);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:900;

    border:2px solid white;
}

.creator-name{
    font-size:15px;
    font-weight:800;
}

.username{
    margin-top:3px;
    font-size:11px;
    color:#aebbd0;
}

.follow{
    margin-left:5px;
    padding:7px 12px;

    border:1px solid #fff;
    border-radius:8px;

    background:rgba(0,0,0,.25);
    color:#fff;

    font-size:11px;
    font-weight:700;
}

.caption{
    margin-top:12px;
    font-size:14px;
}

.audio{
    margin-top:8px;
    font-size:12px;
    color:#d7dfeb;
}

/* ================= EMPTY REEL LABEL ================= */

.coming{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    color:#7f91a8;
    font-size:12px;
    letter-spacing:.5px;
}

/* ================= CAMERA ================= */

.camera{
    position:absolute;
    right:20px;
    bottom:74px;
    z-index:20;

    width:48px;
    height:48px;

    border-radius:50%;
    border:4px solid white;

    background:#0869e6;
    color:#fff;

    font-size:20px;

    box-shadow:0 8px 25px rgba(0,70,180,.45);
}

/* ================= BOTTOM ================= */

.bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:70px;
    z-index:19;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    background:rgba(3,11,21,.93);
    backdrop-filter:blur(18px);

    border-top:1px solid rgba(255,255,255,.08);
}

.nav{
    border:0;
    background:none;
    color:#8997aa;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;

    font-size:10px;
    font-weight:700;
}

.nav-icon{
    font-size:20px;
}

.nav.active{
    color:#fff;
}

.nav.active .nav-icon{
    color:#4a9cff;
}

.profile{
    width:25px;
    height:25px;
    border-radius:50%;

    background:linear-gradient(135deg,#55aaff,#075dcc);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:11px;
    font-weight:800;
}

@media(min-width:700px){
    .app{
        max-width:480px;
        margin:auto;
        box-shadow:0 0 60px #000;
    }

    body{
        background:#050b13;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->
    <div class="topbar">

        <div class="brand">
            <div class="logo">U</div>
            <div class="brand-name">Usanex</div>
        </div>

        <button class="top-btn"
                onclick="alert('Messages')">
            💬
        </button>

    </div>


    <!-- TABS -->
    <div class="tabs">
        <div class="tab active">For You</div>
        <div class="tab">Following</div>
    </div>


    <!-- EMPTY REEL -->
    <div class="reel">

        <div class="empty-reel">

            <div class="empty-logo">U</div>

            <div class="empty-title">
                Usanex Reels
            </div>

            <div class="empty-text">
                Reels will appear here
            </div>

        </div>

    </div>


    <!-- RIGHT ACTIONS -->
    <div class="actions">

        <div class="action">
            <button class="action-btn">♡</button>
            <span class="count">0</span>
        </div>

        <div class="action">
            <button class="action-btn">💬</button>
            <span class="count">0</span>
        </div>

        <div class="action">
            <button class="action-btn">↻</button>
            <span class="count">0</span>
        </div>

        <div class="action">
            <button class="action-btn">↗</button>
            <span class="count">Share</span>
        </div>

        <div class="action">
            <button class="action-btn">🔖</button>
            <span class="count">Save</span>
        </div>

    </div>


    <!-- INFO -->
    <div class="info">

        <div class="creator">

            <div class="avatar">U</div>

            <div>
                <div class="creator-name">
                    Usanex ✓
                </div>

                <div class="username">
                    @usanex
                </div>
            </div>

            <button class="follow">
                Follow
            </button>

        </div>

        <div class="caption">
            Share your moments on Usanex 💙
        </div>

        <div class="audio">
            ♫ Original audio
        </div>

    </div>


    <!-- CAMERA -->
    <button class="camera"
            onclick="alert('Create Reel')">
        📷
    </button>


    <!-- BOTTOM NAV -->
    <nav class="bottom">

        <button class="nav"
                onclick="location.href='/home'">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </button>

        <button class="nav active">
            <span class="nav-icon">▶</span>
            <span>Reels</span>
        </button>

        <button class="nav">
            <span class="nav-icon">◎</span>
            <span>Coll</span>
        </button>

        <button class="nav"
                onclick="location.href='/home'">
            <span class="profile">U</span>
            <span>Profile</span>
        </button>

    </nav>

</div>

</body>
</html>
