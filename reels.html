<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Usanex Reels</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   TOP
===================================================== */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:70px;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.55);

    border-bottom:1px solid rgba(255,255,255,.06);
}

.tabs{
    display:flex;
    align-items:center;
    gap:28px;
}

.tab{
    position:relative;

    border:none;
    background:none;

    color:#8f9db0;

    font-size:15px;
    font-weight:700;

    padding:10px 3px;
}

.tab.active{
    color:#fff;
}

.tab.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:2px;

    transform:translateX(-50%);

    width:24px;
    height:3px;

    border-radius:10px;

    background:#fff;
}

/* CAMERA */

.top-camera{
    width:38px;
    height:38px;

    margin-left:4px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.08);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;

    transition:.2s;
}

.top-camera:active{
    transform:scale(.92);
    background:rgba(255,255,255,.18);
}

/* =====================================================
   REEL AREA
===================================================== */

.reel-area{
    position:absolute;
    inset:0;

    background:#000;
}

/* CENTER CREATE REEL */

.create-reel-center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:#fff;

    font-size:20px;
    font-weight:800;

    text-align:center;

    cursor:pointer;

    padding:15px 22px;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.14);

    transition:.2s;
}

.create-reel-center:active{
    transform:translate(-50%,-50%) scale(.96);
    background:rgba(255,255,255,.12);
}

/* =====================================================
   RIGHT ACTIONS
===================================================== */

.right-actions{
    position:absolute;

    right:12px;
    bottom:135px;

    z-index:25;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:14px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:3px;
}

.action-btn{
    width:47px;
    height:47px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.48);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    backdrop-filter:blur(8px);
}

.action-btn:active{
    transform:scale(.92);
}

.action-count{
    color:#fff;

    font-size:10px;
    font-weight:700;

    text-shadow:0 1px 5px #000;
}

/* =====================================================
   USER INFORMATION
===================================================== */

.user-info{
    position:absolute;

    left:15px;
    right:82px;

    bottom:102px;

    z-index:25;

    color:#fff;
}

.user-row{
    display:flex;
    align-items:center;

    gap:9px;
}

.avatar{
    width:45px;
    height:45px;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    border:2px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:18px;
    font-weight:800;
}

.user-details{
    min-width:0;
    flex:1;
}

.username{
    color:#fff;

    font-size:14px;
    font-weight:800;

    white-space:nowrap;
}

/* FOLLOW */

.follow-btn{
    min-width:72px;

    height:34px;

    padding:0 12px;

    border:1px solid rgba(255,255,255,.8);
    border-radius:9px;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.follow-btn.following{
    background:#fff;
    color:#0966dc;
}

/* =====================================================
   INTERESTED / NOT INTERESTED
   USERNAME KE NICHE
===================================================== */

.preference-row{
    display:flex;
    align-items:center;

    gap:8px;

    margin-top:10px;
}

.preference{
    height:31px;

    padding:0 11px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:17px;

    background:rgba(0,0,0,.40);

    color:#fff;

    font-size:11px;
    font-weight:700;

    backdrop-filter:blur(7px);
}

.preference.selected{
    background:#fff;
    color:#0867dd;
    border-color:#fff;
}

/* =====================================================
   CAPTION
===================================================== */

.caption{
    margin-top:10px;

    color:#fff;

    font-size:13px;

    line-height:1.4;
}

.audio{
    margin-top:7px;

    color:#c6d1df;

    font-size:11px;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    z-index:40;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        1fr;

    background:rgba(3,10,20,.96);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.nav{
    border:none;
    background:none;

    color:#8997aa;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:9px;
    font-weight:700;
}

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.nav.active{
    color:#fff;
}

.nav.active .nav-icon{
    color:#4c9fff;
}

/* CREATE BOTTOM PLUS */

.bottom-create{
    width:43px;
    height:43px;

    margin-top:-9px;

    border-radius:14px;

    border:2px solid #fff;

    background:#0869e6;

    color:#fff;

    font-size:29px;
    font-weight:400;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 7px 22px rgba(0,90,220,.40);
}

/* PROFILE */

.profile-icon{
    width:25px;
    height:25px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:11px;
    font-weight:800;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:absolute;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(15px);

    z-index:60;

    padding:9px 15px;

    border-radius:10px;

    background:rgba(5,15,28,.95);

    color:#fff;

    font-size:12px;
    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .app{
        max-width:480px;
        margin:auto;

        box-shadow:
            0 0 70px rgba(0,0,0,.65);
    }

    body{
        background:#02060c;
    }
}

/* =====================================================
   SAFE AREA
===================================================== */

@supports(padding-bottom:env(safe-area-inset-bottom)){

    .bottom-nav{
        height:
            calc(
                72px +
                env(safe-area-inset-bottom)
            );

        padding-bottom:
            env(safe-area-inset-bottom);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         TOP
    ================================================== -->

    <header class="top">

        <div class="tabs">

            <button
                class="tab active"
                onclick="selectTab(this)">
                For You
            </button>

            <button
                class="tab"
                onclick="selectTab(this)">
                Following
            </button>

            <!-- CAMERA -->

            <button
                class="top-camera"
                onclick="openCreateReel()"
                aria-label="Create Reel">
                📷
            </button>

        </div>

    </header>


    <!-- =================================================
         REEL AREA
    ================================================== -->

    <main class="reel-area">

        <!-- CENTER -->

        <button
            class="create-reel-center"
            onclick="openCreateReel()">

            Create a Reel

        </button>


        <!-- =================================================
             RIGHT SIDE
        ================================================== -->

        <div class="right-actions">

            <!-- LIKE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="toggleLike(this)">
                    ♡
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- COMMENT -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Comments')">
                    💭
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- REPOST -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Reposted')">
                    ↻
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- SHARE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="shareReel()">
                    ↗
                </button>

                <span class="action-count">
                    Share
                </span>

            </div>

        </div>


        <!-- =================================================
             USER INFO
        ================================================== -->

        <section class="user-info">

            <div class="user-row">

                <div class="avatar">
                    U
                </div>


                <div class="user-details">

                    <div class="username">
                        @uttamv025
                    </div>

                </div>


                <!-- FOLLOW -->

                <button
                    class="follow-btn"
                    onclick="toggleFollow(this)">
                    Follow
                </button>

            </div>


            <!-- INTERESTED / NOT INTERESTED -->

            <div class="preference-row">

                <button
                    class="preference"
                    id="interestedBtn"
                    onclick="selectPreference('interested')">
                    👍 Interested
                </button>

                <button
                    class="preference"
                    id="notInterestedBtn"
                    onclick="selectPreference('not')">
                    × Not interested
                </button>

            </div>


            <!-- CAPTION -->

            <div class="caption">
                Your reel caption will appear here...
            </div>


            <!-- AUDIO -->

            <div class="audio">
                ♫ Original audio
            </div>

        </section>

    </main>


    <!-- =================================================
         BOTTOM NAV
    ================================================== -->

    <nav class="bottom-nav">

        <!-- HOME -->

        <button
            class="nav"
            onclick="goHome()">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </button>


        <!-- REELS -->

        <button
            class="nav active"
            onclick="goReels()">

            <span class="nav-icon">
                ▶
            </span>

            <span>
                Reels
            </span>

        </button>


        <!-- CREATE -->

        <button
            class="nav"
            onclick="openCreateReel()">

            <span class="bottom-create">
                +
            </span>

            <span>
                Create
            </span>

        </button>


        <!-- NOTIFICATION -->

        <button
            class="nav"
            onclick="openNotifications()">

            <span class="nav-icon">
                🔔
            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            class="nav"
            onclick="goProfile()">

            <span class="profile-icon">
                U
            </span>

            <span>
                Profile
            </span>

        </button>

    </nav>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast">
    </div>

</div>


<script>

/* =====================================================
   TAB
===================================================== */

function selectTab(button){

    document
        .querySelectorAll(".tab")
        .forEach(tab=>{
            tab.classList.remove("active");
        });

    button.classList.add("active");

}


/* =====================================================
   CREATE REEL
===================================================== */

function openCreateReel(){

    window.location.href =
        "/create-reel";

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(button){

    if(button.dataset.liked === "true"){

        button.dataset.liked = "false";

        button.textContent = "♡";

        showToast("Removed like");

    }else{

        button.dataset.liked = "true";

        button.textContent = "♥";

        showToast("Liked");

    }

}


/* =====================================================
   FOLLOW
===================================================== */

function toggleFollow(button){

    if(button.dataset.following === "true"){

        button.dataset.following = "false";

        button.textContent = "Follow";

    }else{

        button.dataset.following = "true";

        button.textContent = "Following";

    }

}


/* =====================================================
   INTERESTED
===================================================== */

function selectPreference(type){

    const interested =
        document.getElementById(
            "interestedBtn"
        );

    const notInterested =
        document.getElementById(
            "notInterestedBtn"
        );

    interested.classList.remove("selected");

    notInterested.classList.remove("selected");


    if(type === "interested"){

        interested.classList.add("selected");

        showToast("Marked Interested");

    }else{

        notInterested.classList.add("selected");

        showToast("Not interested");

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareReel(){

    try{

        if(navigator.share){

            await navigator.share({

                title:"Usanex Reel",

                text:
                    "Check this reel on Usanex"

            });

        }else{

            showToast("Share");

        }

    }catch(e){

        /* cancelled */

    }

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.location.href =
        "/home";

}


function goReels(){

    window.location.href =
        "/reels";

}


function goProfile(){

    window.location.href =
        "/profile";

}


function openNotifications(){

    window.location.href =
        "/notifications";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },1400);

}

</script>

</body>
</html>
