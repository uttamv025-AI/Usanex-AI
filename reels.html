<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Usanex Reels</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button{
    font-family:inherit;
    border:none;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   FULL SCREEN REEL
===================================================== */

.reel{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;
}

/* VIDEO */

.reel-video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;

    user-select:none;
    -webkit-user-select:none;
}

/*
   Touch layer:
   normal tap = mute/unmute
   long press = pause/resume
*/

.video-touch{
    position:absolute;
    inset:0;

    z-index:5;

    background:transparent;
}

/* =====================================================
   TOP BAR
===================================================== */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:64px;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-top:
        env(safe-area-inset-top);
}

.top-inner{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:24px;
}

.tab{
    position:relative;

    background:transparent;

    color:rgba(255,255,255,.65);

    font-size:15px;
    font-weight:700;

    padding:8px 3px;

    text-shadow:
        0 1px 6px rgba(0,0,0,.8);
}

.tab.active{
    color:#fff;
}

.tab.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:22px;
    height:2px;

    border-radius:10px;

    background:#fff;
}

/* =====================================================
   CAMERA
===================================================== */

.camera-btn{
    width:38px;
    height:38px;

    background:transparent;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:4px;

    text-shadow:
        0 1px 8px #000;
}

.camera-btn:active{
    transform:scale(.9);
}

.camera-svg{
    width:29px;
    height:29px;
}

/* =====================================================
   RIGHT ACTIONS
===================================================== */

.right-actions{
    position:absolute;

    right:10px;
    bottom:155px;

    z-index:15;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:12px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:3px;
}

.action-btn{
    width:46px;
    height:46px;

    border-radius:50%;

    background:rgba(0,0,0,.32);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    backdrop-filter:blur(5px);

    text-shadow:
        0 1px 5px #000;
}

.action-btn:active{
    transform:scale(.9);
}

.action-count{
    color:#fff;

    font-size:10px;
    font-weight:700;

    text-shadow:
        0 1px 6px #000;
}

.more-btn{
    font-size:28px;
}

/* =====================================================
   USER INFO
===================================================== */

.user-info{
    position:absolute;

    left:14px;
    right:72px;

    bottom:102px;

    z-index:15;

    color:#fff;

    text-shadow:
        0 1px 6px rgba(0,0,0,.9);
}

.user-row{
    display:flex;
    align-items:center;

    gap:9px;
}

.avatar{
    width:44px;
    height:44px;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    border:2px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:17px;
    font-weight:800;
}

.username{
    color:#fff;

    font-size:14px;
    font-weight:800;
}

.follow-btn{
    height:32px;

    min-width:72px;

    padding:0 12px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.9);

    background:rgba(0,0,0,.3);

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.follow-btn.following{
    background:#fff;
    color:#0867dd;
}

/* =====================================================
   PREFERENCE
===================================================== */

.preference-row{
    display:flex;

    gap:8px;

    margin-top:8px;
}

.preference{
    height:30px;

    padding:0 11px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.45);

    background:rgba(0,0,0,.32);

    color:#fff;

    font-size:11px;
    font-weight:700;

    backdrop-filter:blur(5px);
}

.preference.selected{
    background:#fff;
    color:#0867dd;
}

/* =====================================================
   CAPTION
===================================================== */

.caption{
    margin-top:8px;

    font-size:13px;

    line-height:1.4;

    color:#fff;
}

.audio{
    margin-top:5px;

    font-size:11px;

    color:#d7dce3;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:
        calc(
            70px +
            env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    z-index:40;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        1fr;

    background:
        rgba(3,10,20,.96);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.nav{
    background:transparent;

    color:#8997aa;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:9px;
    font-weight:700;
}

.nav.active{
    color:#fff;
}

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.nav.active .nav-icon{
    color:#4c9fff;
}

.bottom-create{
    width:43px;
    height:43px;

    margin-top:-8px;

    border-radius:14px;

    border:2px solid #fff;

    background:#0869e6;

    color:#fff;

    font-size:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 7px 22px
        rgba(0,90,220,.4);
}

.profile-icon{
    width:25px;
    height:25px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:11px;
    font-weight:800;
}

/* =====================================================
   MORE SHEET
===================================================== */

.sheet-overlay{
    position:absolute;

    inset:0;

    z-index:80;

    background:rgba(0,0,0,.58);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.sheet-overlay.show{
    opacity:1;

    pointer-events:auto;
}

.bottom-sheet{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:50dvh;

    min-height:340px;

    background:#fff;

    color:#111;

    border-radius:
        22px 22px 0 0;

    transform:translateY(100%);

    transition:
        transform .28s
        cubic-bezier(.2,.8,.2,1);

    overflow:hidden;

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,.35);
}

.sheet-overlay.show .bottom-sheet{
    transform:translateY(0);
}

.sheet-handle{
    width:42px;
    height:4px;

    margin:10px auto 4px;

    border-radius:10px;

    background:#c8c8c8;
}

.sheet-header{
    height:54px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid #eee;
}

.sheet-title{
    font-size:17px;
    font-weight:800;
}

.sheet-close{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#f1f1f1;

    color:#222;

    font-size:21px;
}

.sheet-content{
    height:calc(50dvh - 68px);

    padding:16px 18px 30px;

    overflow-y:auto;
}

.detail{
    margin-bottom:18px;
}

.detail-label{
    margin-bottom:6px;

    color:#777;

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;
}

.detail-value{
    color:#111;

    font-size:14px;

    line-height:1.45;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    padding:7px 10px;

    border-radius:15px;

    background:#edf4ff;

    color:#0867dd;

    font-size:11px;
    font-weight:700;
}

.video-type{
    display:inline-flex;

    padding:8px 12px;

    border-radius:16px;

    background:#f1f1f1;

    font-size:12px;
    font-weight:700;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:absolute;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(15px);

    z-index:100;

    padding:9px 15px;

    border-radius:10px;

    background:rgba(5,15,28,.95);

    color:#fff;

    font-size:12px;
    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .app{
        max-width:480px;
        margin:auto;

        box-shadow:
            0 0 70px
            rgba(0,0,0,.65);
    }

    body{
        background:#02060c;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         FULL SCREEN VIDEO
    ================================================== -->

    <main class="reel">

        <!--
            Backend se actual video URL yahan set karein.
            Example:
            src="/media/reel.mp4"
        -->

        <video
            id="reelVideo"
            class="reel-video"
            playsinline
            autoplay
            loop
            preload="auto">

        </video>


        <!-- Invisible touch layer -->
        <div
            id="videoTouch"
            class="video-touch">
        </div>


        <!-- =================================================
             TOP
        ================================================== -->

        <header class="top">

            <div class="top-inner">

                <button
                    class="tab active"
                    onclick="selectTab(this)">
                    For You
                </button>

                <button
                    class="tab"
                    onclick="selectTab(this)">
                    Following
                </button>


                <!-- CAMERA -->

                <button
                    class="camera-btn"
                    onclick="openCreateReel()"
                    aria-label="Create Reel">

                    <svg
                        class="camera-svg"
                        viewBox="0 0 64 64"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M18 18H27L31 12H43C47 12 50 15 50 19V21H53C57 21 60 24 60 28V48C60 52 57 55 53 55H11C7 55 4 52 4 48V28C4 24 7 21 11 21H18V18Z"
                            stroke="white"
                            stroke-width="4"
                            stroke-linejoin="round"/>

                        <circle
                            cx="32"
                            cy="38"
                            r="10"
                            stroke="white"
                            stroke-width="4"/>

                    </svg>

                </button>

            </div>

        </header>


        <!-- =================================================
             RIGHT ACTIONS
        ================================================== -->

        <div class="right-actions">

            <!-- LIKE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="toggleLike(this)">
                    ♡
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- COMMENT -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Comments')">
                    💭
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- REPOST -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Reposted')">
                    ↻
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- SHARE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="shareReel()">
                    ↗
                </button>

                <span class="action-count">
                    Share
                </span>

            </div>


            <!-- MORE -->

            <div class="action">

                <button
                    class="action-btn more-btn"
                    onclick="openMoreSheet()">
                    ⋮
                </button>

                <span class="action-count">
                    More
                </span>

            </div>

        </div>


        <!-- =================================================
             USER INFO
        ================================================== -->

        <section class="user-info">

            <div class="user-row">

                <div class="avatar">
                    U
                </div>

                <div class="username">
                    @uttamv025
                </div>

                <button
                    class="follow-btn"
                    onclick="toggleFollow(this)">
                    Follow
                </button>

            </div>


            <div class="preference-row">

                <button
                    class="preference"
                    id="interestedBtn"
                    onclick="selectPreference('interested')">
                    👍 Interested
                </button>

                <button
                    class="preference"
                    id="notInterestedBtn"
                    onclick="selectPreference('not')">
                    × Not interested
                </button>

            </div>


            <div class="caption">
                Your reel caption will appear here...
            </div>


            <div class="audio">
                ♫ Original audio
            </div>

        </section>

    </main>


    <!-- =================================================
         BOTTOM NAV
    ================================================== -->

    <nav class="bottom-nav">

        <button
            class="nav"
            onclick="goHome()">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </button>


        <button
            class="nav active"
            onclick="goReels()">

            <span class="nav-icon">
                ▶
            </span>

            <span>
                Reels
            </span>

        </button>


        <button
            class="nav"
            onclick="openCreateReel()">

            <span class="bottom-create">
                +
            </span>

            <span>
                Create
            </span>

        </button>


        <button
            class="nav"
            onclick="openNotifications()">

            <span class="nav-icon">
                🔔
            </span>

            <span>
                Notification
            </span>

        </button>


        <button
            class="nav"
            onclick="goProfile()">

            <span class="profile-icon">
                U
            </span>

            <span>
                Profile
            </span>

        </button>

    </nav>


    <!-- =================================================
         MORE SHEET
    ================================================== -->

    <div
        class="sheet-overlay"
        id="sheetOverlay"
        onclick="closeMoreSheet(event)">

        <section
            class="bottom-sheet"
            id="bottomSheet"
            onclick="event.stopPropagation()">

            <div class="sheet-handle"></div>

            <div class="sheet-header">

                <div class="sheet-title">
                    Reel Details
                </div>

                <button
                    class="sheet-close"
                    onclick="closeMoreSheet()">
                    ×
                </button>

            </div>


            <div class="sheet-content">

                <div class="detail">

                    <div class="detail-label">
                        Description
                    </div>

                    <div class="detail-value">
                        Your reel description will appear here.
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Tags
                    </div>

                    <div class="tags">

                        <span class="tag">
                            #Usanex
                        </span>

                        <span class="tag">
                            #Reels
                        </span>

                        <span class="tag">
                            #Trending
                        </span>

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Location
                    </div>

                    <div class="detail-value">
                        Location not added
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Type of Video
                    </div>

                    <span class="video-type">
                        General
                    </span>

                </div>

            </div>

        </section>

    </div>


    <div
        class="toast"
        id="toast">
    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("reelVideo");

const videoTouch =
    document.getElementById("videoTouch");


/* =====================================================
   VIDEO START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
         * Browser autoplay policy normally allows
         * autoplay only when video is muted.
         *
         * When your real video URL is connected,
         * this starts it muted.
         */

        video.muted = true;

        video.play().catch(()=>{});

    }
);


/* =====================================================
   NORMAL TAP
   ONLY AUDIO MUTE / UNMUTE
===================================================== */

let longPress = false;

let pressTimer = null;

let touchStarted = false;

const LONG_PRESS_TIME = 500;


/* =====================================================
   START PRESS
===================================================== */

function startPress(){

    touchStarted = true;

    longPress = false;

    clearTimeout(pressTimer);

    pressTimer = setTimeout(
        function(){

            longPress = true;

            /*
             * Long press:
             * VIDEO + AUDIO PAUSE
             */

            video.pause();

        },
        LONG_PRESS_TIME
    );

}


/* =====================================================
   END PRESS
===================================================== */

function endPress(){

    clearTimeout(pressTimer);

    /*
     * Long press finished
     */

    if(longPress){

        /*
         * Resume video + audio
         */

        video.muted = false;

        video.play().catch(()=>{});

        longPress = false;

        touchStarted = false;

        return;

    }


    /*
     * Normal tap:
     * ONLY mute / unmute
     */

    if(touchStarted){

        video.muted = !video.muted;

        touchStarted = false;

    }

}


/* =====================================================
   TOUCH EVENTS
===================================================== */

videoTouch.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        startPress();

    },
    {
        passive:false
    }
);


videoTouch.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        endPress();

    },
    {
        passive:false
    }
);


videoTouch.addEventListener(
    "touchcancel",
    function(){

        clearTimeout(pressTimer);

        /*
         * If long press was active,
         * resume video.
         */

        if(longPress){

            video.muted = false;

            video.play().catch(()=>{});

        }

        longPress = false;

        touchStarted = false;

    },
    {
        passive:true
    }
);


/* =====================================================
   DESKTOP / MOUSE SUPPORT
===================================================== */

videoTouch.addEventListener(
    "mousedown",
    function(e){

        e.preventDefault();

        startPress();

    }
);


videoTouch.addEventListener(
    "mouseup",
    function(e){

        e.preventDefault();

        endPress();

    }
);


videoTouch.addEventListener(
    "mouseleave",
    function(){

        if(longPress){

            clearTimeout(pressTimer);

            video.muted = false;

            video.play().catch(()=>{});

            longPress = false;

            touchStarted = false;

        }

    }
);


/* =====================================================
   TAB
===================================================== */

function selectTab(button){

    document
        .querySelectorAll(".tab")
        .forEach(function(tab){

            tab.classList.remove("active");

        });

    button.classList.add("active");

}


/* =====================================================
   CREATE
===================================================== */

function openCreateReel(){

    window.location.href =
        "/create-reel";

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(button){

    if(
        button.dataset.liked ===
        "true"
    ){

        button.dataset.liked =
            "false";

        button.textContent =
            "♡";

        showToast("Removed like");

    }else{

        button.dataset.liked =
            "true";

        button.textContent =
            "♥";

        showToast("Liked");

    }

}


/* =====================================================
   FOLLOW
===================================================== */

function toggleFollow(button){

    if(
        button.dataset.following ===
        "true"
    ){

        button.dataset.following =
            "false";

        button.textContent =
            "Follow";

        button.classList.remove(
            "following"
        );

    }else{

        button.dataset.following =
            "true";

        button.textContent =
            "Following";

        button.classList.add(
            "following"
        );

    }

}


/* =====================================================
   PREFERENCE
===================================================== */

function selectPreference(type){

    const interested =
        document.getElementById(
            "interestedBtn"
        );

    const notInterested =
        document.getElementById(
            "notInterestedBtn"
        );


    interested.classList.remove(
        "selected"
    );

    notInterested.classList.remove(
        "selected"
    );


    if(type === "interested"){

        interested.classList.add(
            "selected"
        );

        showToast(
            "Marked Interested"
        );

    }else{

        notInterested.classList.add(
            "selected"
        );

        showToast(
            "Not interested"
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareReel(){

    try{

        if(navigator.share){

            await navigator.share({

                title:"Usanex Reel",

                text:
                    "Check this reel on Usanex"

            });

        }else{

            showToast("Share");

        }

    }catch(error){

        /* user cancelled share */

    }

}


/* =====================================================
   MORE SHEET
===================================================== */

function openMoreSheet(){

    document
        .getElementById(
            "sheetOverlay"
        )
        .classList.add("show");

}


function closeMoreSheet(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "sheetOverlay"
        )
    ){

        return;

    }


    document
        .getElementById(
            "sheetOverlay"
        )
        .classList.remove("show");

}


/* =====================================================
   SHEET SWIPE DOWN
===================================================== */

let sheetStartY = 0;

const sheet =
    document.getElementById(
        "bottomSheet"
    );


sheet.addEventListener(
    "touchstart",
    function(e){

        sheetStartY =
            e.touches[0].clientY;

    },
    {
        passive:true
    }
);


sheet.addEventListener(
    "touchend",
    function(e){

        const sheetEndY =
            e.changedTouches[0].clientY;

        if(
            sheetEndY -
            sheetStartY >
            70
        ){

            closeMoreSheet();

        }

    },
    {
        passive:true
    }
);

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1400
        );

}

</script>
