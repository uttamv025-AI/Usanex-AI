<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Usanex Reels</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050b18;
    color:#fff;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   REEL
===================================================== */

.reel{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

.reel-video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}

.video-touch{
    position:absolute;
    inset:0;
    z-index:5;
    background:transparent;
}

/* =====================================================
   TOP
===================================================== */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:68px;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-top:env(safe-area-inset-top);
}

.top-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:25px;
}

.tab{
    position:relative;

    padding:8px 3px;

    background:transparent;

    color:#aab5c5;

    font-size:15px;
    font-weight:700;

    text-shadow:0 1px 7px #000;
}

.tab.active{
    color:#fff;
}

.tab.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:22px;
    height:2px;

    border-radius:10px;

    background:#fff;
}

/* =====================================================
   CAMERA
===================================================== */

.camera-btn{
    width:38px;
    height:38px;

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
}

.camera-btn:active{
    transform:scale(.9);
}

.camera-svg{
    width:29px;
    height:29px;
}

/* =====================================================
   RIGHT ACTIONS
===================================================== */

.right-actions{
    position:absolute;

    right:10px;
    bottom:157px;

    z-index:15;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:11px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
}

.action-btn{
    width:46px;
    height:46px;

    border-radius:50%;

    background:rgba(0,0,0,.38);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    backdrop-filter:blur(5px);

    text-shadow:0 1px 6px #000;
}

.action-btn:active{
    transform:scale(.9);
}

.action-count{
    color:#fff;

    font-size:10px;
    font-weight:700;

    text-shadow:0 1px 6px #000;
}

.more-btn{
    font-size:28px;
}

/* =====================================================
   USER INFO
===================================================== */

.user-info{
    position:absolute;

    left:14px;
    right:70px;

    bottom:101px;

    z-index:15;

    color:#fff;

    text-shadow:0 1px 7px #000;
}

.user-row{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:44px;
    height:44px;

    min-width:44px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #2185ff,
            #0868e8,
            #0049b5
        );

    border:2px solid #fff;

    font-size:17px;
    font-weight:800;
}

.username{
    flex:1;

    min-width:0;

    color:#fff;

    font-size:14px;
    font-weight:800;
}

.follow-btn{
    height:32px;

    padding:0 12px;

    min-width:72px;

    border-radius:9px;

    background:rgba(0,0,0,.35);

    border:1px solid rgba(255,255,255,.85);

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.follow-btn.following{
    background:#fff;
    color:#0867dd;
}

.preference-row{
    display:flex;
    gap:8px;

    margin-top:8px;
}

.preference{
    height:30px;

    padding:0 11px;

    border-radius:17px;

    background:rgba(0,0,0,.38);

    border:1px solid rgba(255,255,255,.4);

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.preference.selected{
    background:#fff;
    color:#0867dd;
}

.caption{
    margin-top:8px;

    font-size:13px;

    line-height:1.4;
}

.audio{
    margin-top:5px;

    color:#d4dbe5;

    font-size:11px;
}

/* =====================================================
   HOME PAGE EXACT BOTTOM NAV STYLE
===================================================== */

.bottom-nav{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:
        calc(
            70px +
            env(safe-area-inset-bottom)
        );

    padding:
        5px 8px
        env(safe-area-inset-bottom);

    z-index:40;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:rgba(7,14,28,.98);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);
}

.nav-item{
    width:20%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    cursor:pointer;
}

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9aa7b9;

    font-size:23px;
}

.nav-item.active .nav-icon{
    color:#fff;
}

.plus-nav{
    width:44px;
    height:44px;

    border-radius:14px;

    background:#1677ff;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    box-shadow:
        0 5px 20px
        rgba(22,119,255,.25);
}

.notification-badge{
    position:absolute;

    top:7px;
    right:25%;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:10px;

    background:#1677ff;

    color:#fff;

    font-size:9px;
    font-weight:bold;

    display:none;

    align-items:center;
    justify-content:center;
}

/* =====================================================
   DARK MORE SHEET
===================================================== */

.sheet-overlay{
    position:absolute;
    inset:0;

    z-index:80;

    background:rgba(0,0,0,.62);

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.sheet-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.bottom-sheet{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:50dvh;

    min-height:350px;

    background:#0d1728;

    color:#fff;

    border-radius:
        22px 22px 0 0;

    border:
        1px solid
        rgba(255,255,255,.07);

    transform:translateY(100%);

    transition:
        transform .28s
        cubic-bezier(.2,.8,.2,1);

    overflow:hidden;

    box-shadow:
        0 -15px 45px
        rgba(0,0,0,.55);
}

.sheet-overlay.show .bottom-sheet{
    transform:translateY(0);
}

.sheet-handle{
    width:42px;
    height:4px;

    margin:10px auto 4px;

    border-radius:10px;

    background:#5f6d80;
}

.sheet-header{
    height:55px;

    padding:0 17px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.sheet-title{
    font-size:17px;
    font-weight:800;
}

.sheet-close{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#17243a;

    color:#fff;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.sheet-content{
    height:calc(50dvh - 70px);

    padding:16px 17px 30px;

    overflow-y:auto;
}

.detail{
    margin-bottom:18px;

    padding:13px;

    border-radius:14px;

    background:#101b2d;

    border:
        1px solid
        rgba(255,255,255,.06);
}

.detail-label{
    margin-bottom:7px;

    color:#7f8da3;

    font-size:10px;
    font-weight:700;

    text-transform:uppercase;
}

.detail-value{
    color:#dce3ee;

    font-size:13px;

    line-height:1.45;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    padding:7px 10px;

    border-radius:15px;

    background:
        rgba(22,119,255,.12);

    border:
        1px solid
        rgba(22,119,255,.22);

    color:#63a7ff;

    font-size:11px;
    font-weight:700;
}

.video-type{
    display:inline-flex;

    padding:7px 11px;

    border-radius:15px;

    background:#17243a;

    color:#b9c5d5;

    font-size:11px;
    font-weight:700;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:absolute;

    left:50%;
    bottom:86px;

    transform:
        translateX(-50%)
        translateY(15px);

    z-index:100;

    padding:10px 16px;

    border-radius:22px;

    background:#17243a;

    color:#fff;

    font-size:12px;
    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

@media(min-width:700px){

    .app{
        max-width:480px;
        margin:auto;

        box-shadow:
            0 0 70px
            rgba(0,0,0,.65);
    }

    body{
        background:#02060c;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         FULL SCREEN REEL
    ================================================== -->

    <main class="reel">

        <video
            id="reelVideo"
            class="reel-video"
            playsinline
            autoplay
            loop
            preload="auto">
        </video>

        <!-- Invisible touch layer -->
        <div
            id="videoTouch"
            class="video-touch">
        </div>


        <!-- =================================================
             TOP
        ================================================== -->

        <header class="top">

            <div class="top-inner">

                <button
                    class="tab active"
                    onclick="selectTab(this)">
                    For You
                </button>

                <button
                    class="tab"
                    onclick="selectTab(this)">
                    Following
                </button>

                <button
                    class="camera-btn"
                    onclick="openCreateReel()"
                    aria-label="Create Reel">

                    <svg
                        class="camera-svg"
                        viewBox="0 0 64 64"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M18 18H27L31 12H43C47 12 50 15 50 19V21H53C57 21 60 24 60 28V48C60 52 57 55 53 55H11C7 55 4 52 4 48V28C4 24 7 21 11 21H18V18Z"
                            stroke="white"
                            stroke-width="4"
                            stroke-linejoin="round"/>

                        <circle
                            cx="32"
                            cy="38"
                            r="10"
                            stroke="white"
                            stroke-width="4"/>

                    </svg>

                </button>

            </div>

        </header>


        <!-- =================================================
             CENTER
        ================================================== -->

        <button
            class="create-center"
            onclick="openCreateReel()"
            style="
                position:absolute;
                left:50%;
                top:50%;
                transform:translate(-50%,-50%);
                z-index:8;
                padding:14px 21px;
                border-radius:13px;
                background:rgba(13,23,40,.78);
                border:1px solid rgba(255,255,255,.1);
                color:#fff;
                font-size:18px;
                font-weight:800;
            ">
            Create a Reel
        </button>


        <!-- =================================================
             RIGHT ACTIONS
        ================================================== -->

        <div class="right-actions">

            <div class="action">

                <button
                    class="action-btn"
                    onclick="toggleLike(this)">
                    ♡
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Comments')">
                    💭
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Reposted')">
                    ↻
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <div class="action">

                <button
                    class="action-btn"
                    onclick="shareReel()">
                    ↗
                </button>

                <span class="action-count">
                    Share
                </span>

            </div>


            <div class="action">

                <button
                    class="action-btn more-btn"
                    onclick="openMoreSheet()">
                    ⋮
                </button>

                <span class="action-count">
                    More
                </span>

            </div>

        </div>


        <!-- =================================================
             USER
        ================================================== -->

        <section class="user-info">

            <div class="user-row">

                <div class="avatar">
                    U
                </div>

                <div class="username">
                    @uttamv025
                </div>

                <button
                    class="follow-btn"
                    onclick="toggleFollow(this)">
                    Follow
                </button>

            </div>


            <div class="preference-row">

                <button
                    class="preference"
                    id="interestedBtn"
                    onclick="selectPreference('interested')">
                    👍 Interested
                </button>

                <button
                    class="preference"
                    id="notInterestedBtn"
                    onclick="selectPreference('not')">
                    × Not interested
                </button>

            </div>


            <div class="caption">
                Your reel caption will appear here...
            </div>


            <div class="audio">
                ♫ Original audio
            </div>

        </section>

    </main>


    <!-- =================================================
         EXACT HOME BOTTOM NAV
    ================================================== -->

    <nav class="bottom-nav">

        <div
            class="nav-item"
            onclick="goHome()">

            <div class="nav-icon">
                ⌂
            </div>

        </div>


        <div
            class="nav-item active"
            onclick="goReels()">

            <div class="nav-icon">
                ▶
            </div>

        </div>


        <div
            class="nav-item"
            onclick="createPost()">

            <div class="plus-nav">
                +
            </div>

        </div>


        <div
            class="nav-item"
            onclick="goNotifications()">

            <div class="nav-icon">
                ♡
            </div>

            <div
                class="notification-badge"
                id="notificationBadge">
                0
            </div>

        </div>


        <div
            class="nav-item"
            onclick="goProfile()">

            <div class="nav-icon">
                ◉
            </div>

        </div>

    </nav>


    <!-- =================================================
         DARK MORE SHEET
    ================================================== -->

    <div
        class="sheet-overlay"
        id="sheetOverlay"
        onclick="closeMoreSheet(event)">

        <section
            class="bottom-sheet"
            id="bottomSheet"
            onclick="event.stopPropagation()">

            <div class="sheet-handle"></div>

            <div class="sheet-header">

                <div class="sheet-title">
                    Reel Details
                </div>

                <button
                    class="sheet-close"
                    onclick="closeMoreSheet()">
                    ×
                </button>

            </div>


            <div class="sheet-content">

                <div class="detail">

                    <div class="detail-label">
                        Description
                    </div>

                    <div class="detail-value">
                        Your reel description will appear here.
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Tags
                    </div>

                    <div class="tags">

                        <span class="tag">
                            #Usanex
                        </span>

                        <span class="tag">
                            #Reels
                        </span>

                        <span class="tag">
                            #Trending
                        </span>

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Location
                    </div>

                    <div class="detail-value">
                        Location not added
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Type of Video
                    </div>

                    <span class="video-type">
                        General
                    </span>

                </div>

            </div>

        </section>

    </div>


    <div
        class="toast"
        id="toast">
    </div>

</div>


<script>

/* =====================================================
   VIDEO
===================================================== */

const video =
    document.getElementById("reelVideo");

const videoTouch =
    document.getElementById("videoTouch");

let pressTimer = null;
let longPress = false;
let touchStarted = false;

const LONG_PRESS_TIME = 500;


/*
   Video is initially muted because
   browser autoplay generally requires mute.
*/

video.muted = true;

video.play().catch(()=>{});


/* =====================================================
   NORMAL TAP / LONG PRESS
===================================================== */

function startPress(){

    touchStarted = true;
    longPress = false;

    clearTimeout(pressTimer);

    pressTimer =
        setTimeout(
            function(){

                longPress = true;

                /*
                   Long press:
                   video + audio pause
                */

                video.pause();

            },
            LONG_PRESS_TIME
        );

}


function endPress(){

    clearTimeout(pressTimer);

    if(longPress){

        /*
           Long press released:
           video + audio resume
        */

        video.muted = false;

        video.play().catch(()=>{});

        longPress = false;
        touchStarted = false;

        return;

    }


    if(touchStarted){

        /*
           Normal tap:
           ONLY audio mute/unmute.
        */

        video.muted =
            !video.muted;

        touchStarted = false;

    }

}


videoTouch.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        startPress();

    },
    {passive:false}
);


videoTouch.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        endPress();

    },
    {passive:false}
);


videoTouch.addEventListener(
    "touchcancel",
    function(){

        clearTimeout(
            pressTimer
        );

        if(longPress){

            video.muted = false;

            video.play().catch(()=>{});

        }

        longPress = false;
        touchStarted = false;

    },
    {passive:true}
);


/* =====================================================
   TAB
===================================================== */

function selectTab(button){

    document
        .querySelectorAll(".tab")
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );

}


/* =====================================================
   CREATE REEL
===================================================== */

function openCreateReel(){

    window.location.href =
        "/create-reel";

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(button){

    if(
        button.dataset.liked ===
        "true"
    ){

        button.dataset.liked =
            "false";

        button.textContent =
            "♡";

        showToast(
            "Removed like"
        );

    }else{

        button.dataset.liked =
            "true";

        button.textContent =
            "♥";

        showToast(
            "Liked"
        );

    }

}


/* =====================================================
   FOLLOW
===================================================== */

function toggleFollow(button){

    if(
        button.dataset.following ===
        "true"
    ){

        button.dataset.following =
            "false";

        button.textContent =
            "Follow";

        button.classList.remove(
            "following"
        );

    }else{

        button.dataset.following =
            "true";

        button.textContent =
            "Following";

        button.classList.add(
            "following"
        );

    }

}


/* =====================================================
   INTERESTED
===================================================== */

function selectPreference(type){

    const interested =
        document.getElementById(
            "interestedBtn"
        );

    const notInterested =
        document.getElementById(
            "notInterestedBtn"
        );


    interested.classList.remove(
        "selected"
    );

    notInterested.classList.remove(
        "selected"
    );


    if(
        type ===
        "interested"
    ){

        interested.classList.add(
            "selected"
        );

        showToast(
            "Marked Interested"
        );

    }else{

        notInterested.classList.add(
            "selected"
        );

        showToast(
            "Not interested"
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareReel(){

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Usanex Reel",

                text:
                    "Check this reel on Usanex"

            });

        }else{

            showToast(
                "Share"
            );

        }

    }catch(error){

        /* cancelled */

    }

}


/* =====================================================
   MORE SHEET
===================================================== */

function openMoreSheet(){

    document
        .getElementById(
            "sheetOverlay"
        )
        .classList.add(
            "show"
        );

}


function closeMoreSheet(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "sheetOverlay"
        )
    ){

        return;

    }

    document
        .getElementById(
            "sheetOverlay"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   SWIPE SHEET DOWN
===================================================== */

let sheetStartY = 0;

const sheet =
    document.getElementById(
        "bottomSheet"
    );


sheet.addEventListener(
    "touchstart",
    function(e){

        sheetStartY =
            e.touches[0].clientY;

    },
    {passive:true}
);


sheet.addEventListener(
    "touchend",
    function(e){

        const endY =
            e.changedTouches[0].clientY;

        if(
            endY - sheetStartY >
            70
        ){

            closeMoreSheet();

        }

    },
    {passive:true}
);


/* =====================================================
   EXACT HOME NAVIGATION
===================================================== */

function goHome(){

    window.location.href =
        "/home";

}


function goReels(){

    window.location.href =
        "/reels";

}


function createPost(){

    window.location.href =
        "/create-reel";

}


function goNotifications(){

    window.location.href =
        "/notifications";

}


/*
   Home page ke current code ke
   according profile search?user_id
*/

function goProfile(){

    window.location.href =
        "/search?user_id=uttamv025";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );

}

</script>
