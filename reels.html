<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Usanex Reels</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   TOP
===================================================== */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:64px;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;
}

.tabs{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:28px;
}

.tab{
    position:relative;

    border:none;
    background:none;

    color:#a5afbd;

    font-size:15px;
    font-weight:700;

    padding:8px 2px;
}

.tab.active{
    color:#fff;
}

.tab.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:22px;
    height:2px;

    border-radius:10px;

    background:#fff;
}

/* =====================================================
   CAMERA ICON
===================================================== */

.camera-btn{
    width:40px;
    height:40px;

    margin-left:2px;

    border:none;
    background:transparent;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:5px;
}

.camera-btn:active{
    transform:scale(.90);
}

.camera-svg{
    width:29px;
    height:29px;

    display:block;
}

/* =====================================================
   REEL AREA
===================================================== */

.reel-area{
    position:absolute;
    inset:0;

    background:#000;
}

/* CENTER */

.create-reel-center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:none;

    padding:15px 22px;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.12);

    color:#fff;

    font-size:19px;
    font-weight:800;

    white-space:nowrap;
}

.create-reel-center:active{
    transform:translate(-50%,-50%) scale(.96);
}

/* =====================================================
   RIGHT ACTIONS
===================================================== */

.right-actions{
    position:absolute;

    right:11px;
    bottom:142px;

    z-index:25;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:13px;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:3px;
}

.action-btn{
    width:46px;
    height:46px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.45);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    backdrop-filter:blur(8px);
}

.action-btn:active{
    transform:scale(.90);
}

.action-count{
    color:#fff;

    font-size:10px;
    font-weight:700;

    text-shadow:0 1px 5px #000;
}

/* MORE */

.more-btn{
    font-size:27px;
    line-height:1;
}

/* =====================================================
   USER INFO
===================================================== */

.user-info{
    position:absolute;

    left:15px;
    right:75px;

    bottom:103px;

    z-index:25;

    color:#fff;
}

.user-row{
    display:flex;
    align-items:center;

    gap:9px;
}

.avatar{
    width:44px;
    height:44px;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    border:2px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:17px;
    font-weight:800;
}

.user-details{
    min-width:0;
    flex:1;
}

.username{
    color:#fff;

    font-size:14px;
    font-weight:800;

    white-space:nowrap;
}

.follow-btn{
    min-width:72px;

    height:33px;

    padding:0 12px;

    border:1px solid rgba(255,255,255,.85);

    border-radius:9px;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:11px;
    font-weight:700;
}

.follow-btn.following{
    background:#fff;
    color:#0867dd;
}

/* =====================================================
   INTERESTED / NOT INTERESTED
===================================================== */

.preference-row{
    display:flex;
    align-items:center;

    gap:8px;

    margin-top:9px;
}

.preference{
    height:30px;

    padding:0 11px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:17px;

    background:rgba(0,0,0,.38);

    color:#fff;

    font-size:11px;
    font-weight:700;

    backdrop-filter:blur(7px);
}

.preference.selected{
    background:#fff;
    color:#0867dd;
    border-color:#fff;
}

/* =====================================================
   CAPTION
===================================================== */

.caption{
    margin-top:9px;

    color:#fff;

    font-size:13px;

    line-height:1.4;
}

.audio{
    margin-top:6px;

    color:#c6d1df;

    font-size:11px;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    z-index:40;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        1fr;

    background:rgba(3,10,20,.96);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.nav{
    border:none;
    background:none;

    color:#8997aa;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:9px;
    font-weight:700;
}

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.nav.active{
    color:#fff;
}

.nav.active .nav-icon{
    color:#4c9fff;
}

.bottom-create{
    width:43px;
    height:43px;

    margin-top:-9px;

    border-radius:14px;

    border:2px solid #fff;

    background:#0869e6;

    color:#fff;

    font-size:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 7px 22px rgba(0,90,220,.40);
}

.profile-icon{
    width:25px;
    height:25px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #58adff,
            #0864d8
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:11px;
    font-weight:800;
}

/* =====================================================
   BOTTOM SHEET OVERLAY
===================================================== */

.sheet-overlay{
    position:absolute;

    inset:0;

    z-index:80;

    background:rgba(0,0,0,.55);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.sheet-overlay.show{
    opacity:1;

    pointer-events:auto;
}

/* =====================================================
   HALF PAGE SHEET
===================================================== */

.bottom-sheet{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:50vh;

    min-height:350px;

    background:#fff;

    color:#111;

    border-radius:
        22px
        22px
        0
        0;

    transform:translateY(100%);

    transition:
        transform .28s
        cubic-bezier(.2,.8,.2,1);

    overflow:hidden;

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,.35);
}

.sheet-overlay.show .bottom-sheet{
    transform:translateY(0);
}

/* SHEET HANDLE */

.sheet-handle{
    width:42px;
    height:4px;

    border-radius:10px;

    background:#c8c8c8;

    margin:10px auto 4px;
}

/* SHEET HEADER */

.sheet-header{
    height:54px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:
        1px solid
        #eeeeee;
}

.sheet-title{
    font-size:17px;
    font-weight:800;
}

.sheet-close{
    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    background:#f1f1f1;

    color:#222;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* SHEET CONTENT */

.sheet-content{
    padding:16px 18px 28px;

    overflow-y:auto;

    height:
        calc(
            50vh -
            68px
        );
}

.detail{
    margin-bottom:17px;
}

.detail-label{
    color:#777;

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;

    margin-bottom:6px;
}

.detail-value{
    color:#111;

    font-size:14px;

    line-height:1.45;

    font-weight:500;
}

/* TAGS */

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.tag{
    padding:7px 10px;

    border-radius:15px;

    background:#edf4ff;

    color:#0867dd;

    font-size:11px;
    font-weight:700;
}

/* VIDEO TYPE */

.video-type{
    display:inline-flex;

    padding:8px 12px;

    border-radius:16px;

    background:#f1f1f1;

    font-size:12px;
    font-weight:700;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:absolute;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(15px);

    z-index:100;

    padding:9px 15px;

    border-radius:10px;

    background:rgba(5,15,28,.95);

    color:#fff;

    font-size:12px;
    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .app{
        max-width:480px;

        margin:auto;

        box-shadow:
            0 0 70px
            rgba(0,0,0,.65);
    }

    body{
        background:#02060c;
    }
}

/* =====================================================
   SAFE AREA
===================================================== */

@supports(padding-bottom:env(safe-area-inset-bottom)){

    .bottom-nav{
        height:
            calc(
                72px +
                env(safe-area-inset-bottom)
            );

        padding-bottom:
            env(safe-area-inset-bottom);
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         TOP
    ================================================== -->

    <header class="top">

        <div class="tabs">

            <button
                class="tab active"
                onclick="selectTab(this)">
                For You
            </button>

            <button
                class="tab"
                onclick="selectTab(this)">
                Following
            </button>

            <!-- CAMERA -->
            <button
                class="camera-btn"
                onclick="openCreateReel()"
                aria-label="Create Reel">

                <!-- Camera outline like your reference -->

                <svg
                    class="camera-svg"
                    viewBox="0 0 64 64"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M18 18H27L31 12H43C47 12 50 15 50 19V21H53C57 21 60 24 60 28V48C60 52 57 55 53 55H11C7 55 4 52 4 48V28C4 24 7 21 11 21H18V18Z"
                        stroke="white"
                        stroke-width="4"
                        stroke-linejoin="round"/>

                    <circle
                        cx="32"
                        cy="38"
                        r="10"
                        stroke="white"
                        stroke-width="4"/>

                </svg>

            </button>

        </div>

    </header>


    <!-- =================================================
         REEL AREA
    ================================================== -->

    <main class="reel-area">

        <!-- CENTER -->

        <button
            class="create-reel-center"
            onclick="openCreateReel()">

            Create a Reel

        </button>


        <!-- =================================================
             RIGHT ACTIONS
        ================================================== -->

        <div class="right-actions">

            <!-- LIKE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="toggleLike(this)">
                    ♡
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- COMMENT -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Comments')">
                    💭
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- REPOST -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="showToast('Reposted')">
                    ↻
                </button>

                <span class="action-count">
                    0
                </span>

            </div>


            <!-- SHARE -->

            <div class="action">

                <button
                    class="action-btn"
                    onclick="shareReel()">
                    ↗
                </button>

                <span class="action-count">
                    Share
                </span>

            </div>


            <!-- MORE -->

            <div class="action">

                <button
                    class="action-btn more-btn"
                    onclick="openMoreSheet()">

                    ⋮

                </button>

                <span class="action-count">
                    More
                </span>

            </div>

        </div>


        <!-- =================================================
             USER INFO
        ================================================== -->

        <section class="user-info">

            <div class="user-row">

                <div class="avatar">
                    U
                </div>


                <div class="user-details">

                    <div class="username">
                        @uttamv025
                    </div>

                </div>


                <button
                    class="follow-btn"
                    onclick="toggleFollow(this)">

                    Follow

                </button>

            </div>


            <!-- INTERESTED / NOT INTERESTED -->

            <div class="preference-row">

                <button
                    class="preference"
                    id="interestedBtn"
                    onclick="selectPreference('interested')">

                    👍 Interested

                </button>

                <button
                    class="preference"
                    id="notInterestedBtn"
                    onclick="selectPreference('not')">

                    × Not interested

                </button>

            </div>


            <!-- CAPTION -->

            <div class="caption">
                Your reel caption will appear here...
            </div>


            <!-- AUDIO -->

            <div class="audio">
                ♫ Original audio
            </div>

        </section>

    </main>


    <!-- =================================================
         BOTTOM NAV
    ================================================== -->

    <nav class="bottom-nav">

        <!-- HOME -->

        <button
            class="nav"
            onclick="goHome()">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </button>


        <!-- REELS -->

        <button
            class="nav active"
            onclick="goReels()">

            <span class="nav-icon">
                ▶
            </span>

            <span>
                Reels
            </span>

        </button>


        <!-- CREATE -->

        <button
            class="nav"
            onclick="openCreateReel()">

            <span class="bottom-create">
                +
            </span>

            <span>
                Create
            </span>

        </button>


        <!-- NOTIFICATION -->

        <button
            class="nav"
            onclick="openNotifications()">

            <span class="nav-icon">
                🔔
            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            class="nav"
            onclick="goProfile()">

            <span class="profile-icon">
                U
            </span>

            <span>
                Profile
            </span>

        </button>

    </nav>


    <!-- =================================================
         MORE OVERLAY + HALF PAGE
    ================================================== -->

    <div
        class="sheet-overlay"
        id="sheetOverlay"
        onclick="closeMoreSheet(event)">

        <section
            class="bottom-sheet"
            id="bottomSheet"
            onclick="event.stopPropagation()">

            <div class="sheet-handle"></div>


            <!-- HEADER -->

            <div class="sheet-header">

                <div class="sheet-title">
                    Reel Details
                </div>

                <button
                    class="sheet-close"
                    onclick="closeMoreSheet()">

                    ×

                </button>

            </div>


            <!-- CONTENT -->

            <div class="sheet-content">

                <!-- DESCRIPTION -->

                <div class="detail">

                    <div class="detail-label">
                        Description
                    </div>

                    <div class="detail-value">
                        Your reel description will appear here.
                    </div>

                </div>


                <!-- TAGS -->

                <div class="detail">

                    <div class="detail-label">
                        Tags
                    </div>

                    <div class="tags">

                        <span class="tag">
                            #Usanex
                        </span>

                        <span class="tag">
                            #Reels
                        </span>

                        <span class="tag">
                            #Trending
                        </span>

                    </div>

                </div>


                <!-- LOCATION -->

                <div class="detail">

                    <div class="detail-label">
                        Location
                    </div>

                    <div class="detail-value">
                        Location not added
                    </div>

                </div>


                <!-- VIDEO TYPE -->

                <div class="detail">

                    <div class="detail-label">
                        Type of Video
                    </div>

                    <span class="video-type">
                        General
                    </span>

                </div>

            </div>

        </section>

    </div>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast">
    </div>

</div>


<script>

/* =====================================================
   TAB
===================================================== */

function selectTab(button){

    document
        .querySelectorAll(".tab")
        .forEach(tab=>{
            tab.classList.remove("active");
        });

    button.classList.add("active");

}


/* =====================================================
   CREATE REEL
===================================================== */

function openCreateReel(){

    window.location.href =
        "/create-reel";

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(button){

    if(button.dataset.liked === "true"){

        button.dataset.liked = "false";

        button.textContent = "♡";

        showToast("Removed like");

    }else{

        button.dataset.liked = "true";

        button.textContent = "♥";

        showToast("Liked");

    }

}


/* =====================================================
   FOLLOW
===================================================== */

function toggleFollow(button){

    if(button.dataset.following === "true"){

        button.dataset.following = "false";

        button.textContent = "Follow";

    }else{

        button.dataset.following = "true";

        button.textContent = "Following";

    }

}


/* =====================================================
   INTERESTED
===================================================== */

function selectPreference(type){

    const interested =
        document.getElementById(
            "interestedBtn"
        );

    const notInterested =
        document.getElementById(
            "notInterestedBtn"
        );

    interested.classList.remove("selected");

    notInterested.classList.remove("selected");


    if(type === "interested"){

        interested.classList.add("selected");

        showToast("Marked Interested");

    }else{

        notInterested.classList.add("selected");

        showToast("Not interested");

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareReel(){

    try{

        if(navigator.share){

            await navigator.share({

                title:"Usanex Reel",

                text:
                    "Check this reel on Usanex"

            });

        }else{

            showToast("Share");

        }

    }catch(e){

        /* cancelled */

    }

}


/* =====================================================
   MORE SHEET
===================================================== */

function openMoreSheet(){

    const overlay =
        document.getElementById(
            "sheetOverlay"
        );

    overlay.classList.add("show");

}


function closeMoreSheet(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "sheetOverlay"
        )
    ){
        return;
    }

    document
        .getElementById("sheetOverlay")
        .classList.remove("show");

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.location.href =
        "/home";

}


function goReels(){

    window.location.href =
        "/reels";

}


function goProfile(){

    window.location.href =
        "/profile";

}


function openNotifications(){

    window.location.href =
        "/notifications";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },1400);

}


/* =====================================================
   SWIPE DOWN TO CLOSE
===================================================== */

let touchStartY = 0;

const sheet =
    document.getElementById(
        "bottomSheet"
    );

sheet.addEventListener(
    "touchstart",
    function(e){

        touchStartY =
            e.touches[0].clientY;

    },
    {passive:true}
);


sheet.addEventListener(
    "touchend",
    function(e){

        const touchEndY =
            e.changedTouches[0].clientY;

        const difference =
            touchEndY - touchStartY;

        if(difference > 70){

            closeMoreSheet();

        }

    },
    {passive:true}
);

</script>

</body>
</html>
